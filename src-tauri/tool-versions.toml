# MeedyaDL External Tool Version Requirements
# =============================================
#
# This file defines the minimum supported versions for all external tool
# dependencies that GAMDL requires at runtime. The dependency manager reads
# these values (compiled into the binary via include_str!) to:
#
#   1. Check system-installed tools against minimum version requirements
#   2. Verify managed (sandboxed) tool installations meet requirements
#   3. Report version compatibility in the setup wizard UI
#
# To update version requirements, edit this file and rebuild the application.
#
# Fields per tool:
#   minimum_version  - Minimum supported version (major.minor or major.minor.patch)
#   binary_name      - The executable filename (case-sensitive on Unix)
#   version_flag     - CLI flag to get version output (e.g., "--version", "-version")

# Fallback mirror repository for tool downloads.
# When primary upstream sources fail (404, timeout, naming changes, etc.),
# the dependency manager falls back to downloading from this GitHub repo.
#
# The mirror uses GitHub Releases with a standardized asset naming convention:
#   {tool_id}-{os}-{arch}.{ext}
#   os:   linux, windows, macos
#   arch: x86_64, aarch64
#   ext:  zip (Windows), tar.gz (Linux/macOS)
#
# Example mirror assets:
#   ffmpeg-linux-x86_64.tar.gz
#   ffmpeg-windows-x86_64.zip
#   mp4decrypt-macos-aarch64.tar.gz
#   nm3u8dlre-linux-x86_64.tar.gz
#   mp4box-windows-x86_64.zip
#
# To populate the mirror, upload tool binaries to the GitHub release
# matching the release_tag below. See the mirror repo README for details.
[mirror]
github_repo = "MeedyaSuite/MeedyaDL-Tools"
release_tag = "latest"

[ffmpeg]
minimum_version = "5.0"
binary_name = "ffmpeg"
version_flag = "-version"

[mp4decrypt]
minimum_version = "1.6.0"
binary_name = "mp4decrypt"
version_flag = "--version"

[nm3u8dlre]
minimum_version = "0.4.0"
binary_name = "N_m3u8DL-RE"
version_flag = "--version"

[mp4box]
minimum_version = "2.0"
binary_name = "MP4Box"
version_flag = "-version"

[mediainfo]
minimum_version = "22.0"
binary_name = "mediainfo"
version_flag = "--version"

# rclone is an OPTIONAL dependency — only required when the user enables
# direct-to-cloud upload (Settings → Cloud Destinations, feature landing in
# v1.11.0 / M11 per issue #859). Listed as `required: false` in the TOOLS
# array so the setup wizard does not block first-launch on its absence.
# MeedyaDL invokes rclone as a subprocess; rclone's MIT licence means there
# is no GPL propagation concern (same pattern as FFmpeg / mp4decrypt /
# N_m3u8DL-RE / MP4Box / get_iplayer planned for M8).
#
# Upstream: https://github.com/rclone/rclone — official rclone project.
# Releases ship signed binaries for every platform MeedyaDL targets.
# Mirror fallback ships from MeedyaSuite/MeedyaDL-Tools (planned, tracked
# in MeedyaSuite/MeedyaDL-Tools#17).
[rclone]
minimum_version = "1.60.0"
binary_name = "rclone"
version_flag = "version"

# GAMDL is installed via pip (not as a standalone binary) so the
# `binary_name` / `version_flag` fields above don't apply. Instead we
# declare a **support window** that bounds which GAMDL releases this
# MeedyaDL build has been validated against. Consumed by
# `services::gamdl_capabilities` for:
#
#   * capping `pip install --upgrade` to the tested range,
#   * suppressing update prompts when upstream ships beyond our
#     ceiling (users shouldn't be pushed into untested territory), and
#   * classifying the installed version at startup
#     (Unsupported / Supported / Untested / NotInstalled).
#
# Bump `maximum_tested_version` / `recommended_version` every time we
# validate a new GAMDL release. `minimum_version` is the oldest
# release that still supports `--song-codec-priority` for albums
# (native fallback chain support; older releases silently degrade).
[gamdl]
# Lowest release we still support. Anything below degrades features
# (native codec priority, modern error classification) silently.
minimum_version = "2.9.1"
# Highest release MeedyaDL has been tested against. Upstream may ship
# newer versions before we validate them; see module docs in
# `gamdl_capabilities.rs` for how that scenario is handled.
#
# 3.1 validation (#604, landed on `claude/audit-gamdl-v3-1-Qlyug`):
#   * `--wrapper-m3u8-ip` / `wrapper_m3u8_ip` CLI + INI gated behind
#     `GamdlFeature::WrapperM3u8Ip` — #605.
#   * `--no-exceptions` suppressed on 3.1+ (no-op upstream) — #606.
#   * `extract_python_exception()` handles the new
#     `ExceptionPrettyPrinter` output ordering — #607.
#   * `TRACK_INFO_V2_REGEX` + `ERROR_PREFIX_REGEX` verified against
#     v3.1 padded Track/URL brackets — #608.
#   * QueueItem counter wiring for per-track index/total — #609.
#
# 3.2 validation (#613, landed on `claude/audit-gamdl-v3.2-eI87q`):
#   * Upstream flipped `AppleMusicInterface.concurrency` 5 → 1
#     (sequential by default); no MeedyaDL code change needed,
#     aligns with our serial-queue design (#455). Docs only — #616.
#   * `track_log.info('Downloading ...')` now conditional on partial
#     media + specific media types; `TRACK_INFO_V2_REGEX` unaffected
#     since it keys on the bracket shape. Regression tests — #615.
#   * `GamdlDownloaderFlatFilterExcludedError` →
#     `GamdlInterfaceFlatFilterExcludedError` rename is invisible to
#     our classifier (matches substrings, not class names) — #615.
#   * Latent pre-existing bugs surfaced during the audit:
#     — `--song-codec` flag never existed in v2.9.1+ CLI; MeedyaDL
#       now always emits `--song-codec-priority` — #614.
#     — Upstream dataclass field misspelled `song_codec_piority`
#       caused our INI emission to be silently dropped; INI codec
#       block now empty, CLI path is authoritative — #617.
#   * `--playlist-folder-template` (v3.0+ flag) finally wired with
#     a new `GamdlFeature::PlaylistFolderTemplate` gate — #618.
#   * Queue-level "Abort All" destructive action surfaced in the UI
#     for fast escape from batch downloads — #620.
#
# 3.3 validation (audit landed on `claude/fix-meedyadl-gamdl-updates-ucJWJ`):
#   * Upstream change set is a single commit — `c83e47d` "Remove total
#     arg from media fetch calls" — which deletes a stale `total=...`
#     kwarg from two `_get_*_media` invocations inside
#     `interface.py::_get_playlist_media`. Pure internal bugfix that
#     unbreaks playlist downloads when a fetch helper signature drifted.
#   * Zero CLI flag changes, zero INI key changes, zero output-format
#     or regex changes. `TRACK_INFO_V2_REGEX`, `ERROR_PREFIX_REGEX`,
#     and every `GamdlFeature` gate behave identically on 3.3 and 3.2.
#   * Safe to admit to the support window without further code changes.
#
# 3.4 validation (audit: `.github/audits/gamdl-v3.4-v3.5-audit.md`,
# 2026-04-27, 11 upstream commits, 9 files touched):
#   * **Logging stream swap**: `cli/cli.py` migrated from
#     `structlog.stdlib.LoggerFactory` (which routed through stdlib
#     `logging.StreamHandler()` defaulting to **stderr**) to
#     `structlog.PrintLoggerFactory(file=CustomOutputWriter([sys.stdout]))`.
#     Every GAMDL log line now lands on **stdout** instead of stderr.
#     Benign for MeedyaDL because both reader tasks in `download_queue.rs`
#     call `parse_gamdl_output()` identically — error collection,
#     progress updates, and Python-traceback extraction are all
#     stream-agnostic. The cosmetic `──── [Track N/M] Downloading
#     "Title" ────` separator (only emitted from the stdout reader)
#     was a latent no-op pre-3.4 because TrackInfo lines came from
#     stderr; it now starts firing reliably as a free UX improvement.
#   * **Subprocess error format change**: `utils.async_subprocess()`
#     replaced `'"<arg0>" exited with code N'` with
#     `'Exited with code N: <full args>\nstdout:\n…\nstderr:\n…'`.
#     `process::classify_error()` matches on substrings (ffmpeg,
#     mp4decrypt, timeout, dns, …) so the new richer text classifies
#     **better**, not worse. No regex update needed.
#   * **`Database(overwrite)` constructor + new `flat_filter` sentinel
#     return** (`"Registered in database"` instead of a path string):
#     scoped to `--database-path` users only. MeedyaDL never sets that
#     flag (`grep -rn "database_path" src-tauri/src/` confirms only the
#     `gamdl_capabilities.rs` module-doc reference). Invisible to us.
#   * **`DownloadItem.uuid_` factory fix** (class-level expression →
#     `field(default_factory=…)`), **`skip_cleanup` cleanup refactor**
#     (caller-side check, net behaviour identical), **raw cover URL
#     suffix strip** (`/{w}x{h}bb.jpg` removed by `_get_raw_cover_url`),
#     **filter exclusion error message reworded**: all internal to GAMDL
#     and never crossed our IPC boundary.
#   * **`--log-file` codepath** also swapped from `logging.FileHandler`
#     to `CustomOutputWriter.add_file()`. MeedyaDL doesn't pass
#     `--log-file` (only `--log-level`), so the file-logging change is
#     irrelevant.
#   * No CLI flag added, removed, or renamed. No INI key changed. No
#     `GamdlFeature` gate touched.
#
# 3.5 validation (same audit, 4 upstream commits, 3 files touched —
# all internal HTTP/storefront fixes for the iTunes lookup path used
# by music-video metadata):
#   * `api/itunes.py`: `httpx.AsyncClient(..., follow_redirects=True)`.
#   * `api/itunes.py`: `X-Apple-Store-Front` header changed from
#     `"{storefront_id}-1,32 t:music31"` to
#     `"{storefront_id},32 t:music31"` (commit message references
#     `-28`; the diff strips `-1`. Either way it's a header detail
#     internal to GAMDL's HTTP layer).
#   * `interface/base.py`: passes `storefront_id=None` to
#     `ItunesApi.create()` for non-US storefronts.
#   * Bug-fixes-only release for music-video iTunes-page lookups; no
#     CLI / INI / output-format surface change.
#   * Safe to admit to the support window without further code changes.
#
# 3.5.1 validation (#711, audit doc at
# `.github/audits/gamdl-v3.5.1-audit.md`):
#   * Single upstream commit (`34a397e`): "Fixed an issue with music
#     video m3u8 URL returning error 403." Pure HTTP/header fix inside
#     GAMDL's music-video URL handling layer.
#   * No CLI / INI / output-format / regex / log surface change.
#   * Same shape as v3.3 (playlist fix) and v3.5 (iTunes lookup fix);
#     zero-code-change admission to the support window.
#   * User-facing benefit: 403 errors on music-video downloads (both
#     standalone MV URLs and music-video companions) silently resolve
#     once installed users upgrade to 3.5.1.
#
# 3.5.2 validation (#767, audit doc at
# `.github/audits/gamdl-v3.5.2-audit.md`):
#   * Four upstream commits, four functional files (plus pure version
#     metadata). Bug-fix-only release.
#     — `b48dbef` `gamdl/api/apple_music.py`: forward all `next_params`
#       (except `limit`) when paginating `_amp_request`. Pure HTTP-layer
#       fix; resolves silent pagination failures on Apple Music
#       resources whose `next` link carries params beyond `offset`
#       (playlists, artist track lists, editorial art extends).
#     — `dec4a22` `gamdl/interface/music_video.py`: track Apple's
#       host migration by rewriting `play-edge.itunes.apple.com` →
#       `play.itunes.apple.com` (was rewriting `itunes.apple.com`).
#       This is **the** user-facing fix referenced in the release
#       ("Fixed an issue with music video m3u8 URL formation").
#       MV downloads that broke on 3.5.1 once Apple flipped the edge
#       host succeed once users upgrade. Also adds a `log.debug()`
#       call gated behind `--log-level DEBUG`; MeedyaDL never sets
#       that level so the line is invisible in normal operation.
#     — `bc4cdd1` `gamdl/cli/utils.py`: `CustomOutputWriter.add_file()`
#       opens the log file as UTF-8. Only matters for `--log-file`,
#       which MeedyaDL never passes (we capture stdout/stderr via
#       Tokio `BufReader::lines()` instead). Invisible to us.
#   * No CLI / INI / output-format / regex / log surface change at
#     the default `INFO` log level. No `GamdlFeature` gate touched.
#   * Same zero-code-change admission shape as v3.3 (playlist fix),
#     v3.5 (iTunes lookup fix), and v3.5.1 (music-video 403 fix).
#
# - 3.6 (2026-05-20 — #853 EPIC). LARGE upstream release; touches every
#   v3.x release before it.
#   * Wrapper support flipped from v1 (three sockets:
#     wrapper-account-url HTTP, wrapper-m3u8-ip TCP, wrapper-decrypt-ip
#     TCP) to wrapper-v2 (single HTTP base URL: --wrapper-url with
#     /health, /me, /playback, /decrypt, /login REST API). MeedyaDL
#     emits exactly one family per CLI invocation, gated on
#     `GamdlFeature::WrapperUrl`.
#   * Codec identifier rename: aac-legacy → aac-web,
#     aac-he-legacy → aac-he-web. The underlying codec is unchanged on
#     disk; only the CLI / INI / dispatch identifier changes. Bound
#     to `SongCodec::to_runtime_cli_string()` via
#     `GamdlFeature::AacWebCodecRename`. From a fetch-path perspective
#     the rename is meaningful: codec.is_web → goes through
#     apple_music_api.get_webplayback() (MusicKit JWT, no wrapper
#     needed); other codecs hit the m3u8 master URL (may need
#     wrapper-v2).
#   * Native muxing + decryption: FFmpeg / MP4Box / mp4decrypt are no
#     longer invoked by GAMDL itself. The three CLI path options
#     (--ffmpeg-path, --mp4box-path, --mp4decrypt-path) are REMOVED,
#     as is --music-video-remux-mode. MeedyaDL still ships these
#     binaries for its OWN pipeline (FFmpeg → ReplayGain / BPM,
#     MP4Box + mp4decrypt are now unused dependencies — kept in the
#     bundle while older GAMDL releases are still in the support
#     window). Emission gated on `GamdlFeature::NativeMuxing` /
#     `GamdlFeature::MusicVideoRemuxMode`.
#   * Interactive credential prompting added at the GAMDL CLI level
#     (InquirerPy in `cli/interactive_prompts.py`). MeedyaDL must
#     ensure the wrapper-v2 daemon is pre-authenticated (via its
#     `POST /login` API) before spawning GAMDL — otherwise GAMDL
#     would deadlock waiting on stdin. New
#     `health_check_service::ensure_wrapper_v2_ready()` handles this.
#   * Improved iTunes compatibility for songs; fixed song codec
#     priority being ignored — both pure upstream wins with no
#     MeedyaDL-side change.
#
# - 3.7 (2026-05-23 — #867 EPIC). Audit doc:
#   `.github/audits/gamdl-v3.7-audit.md`. 22 upstream commits, 17 files
#   touched. Two user-visible features + one regression-of-v3.6:
#   * **Library URL support extended.** GAMDL now natively downloads from
#     the user's personal Apple Music library (songs, albums, playlists,
#     music-videos; `p.` / `l.` / `i.` ID prefixes). MeedyaDL's frontend
#     URL parser already passes `/library/` URLs through — no code
#     change required for routing. URL-audit-diagnostic message updated
#     (#870); enrichment now skipped for `/library/` items to avoid
#     noisy 404s on catalog APIs (#871).
#   * **`--ffmpeg-path` REINSTATED.** v3.6 removed all three tool-path
#     CLI options when switching to native muxing. v3.7 brings back
#     `--ffmpeg-path` because N_m3u8DL-RE depends on FFmpeg for HLS
#     streaming. The other two (`--mp4box-path` / `--mp4decrypt-path`)
#     stay removed. New `GamdlFeature::FFmpegPath` gate (#869) — true
#     on `<3.6` OR `>=3.7`, only false on the `3.6.x` line. The
#     existing `GamdlFeature::NativeMuxing` continues to gate the two
#     STILL-removed tool paths.
#   * **DRM-free tracks marked explicitly.** Uploaded music videos and
#     certain library uploads now have `drm_free=True` and skip the
#     decrypt step server-side. MeedyaDL's stdout/stderr parsing
#     doesn't strictly require "Decrypting…" lines, so no code change
#     expected (verification follow-up tracked in #872).
#   * **Internal-only changes** (no MeedyaDL impact): library API
#     endpoint constants, `StreamInfo.drm_free` / `AppleMusicMedia.is_library`
#     dataclass fields, `media_id` sourcing change (uses API response
#     `id` field), `AppleMusicSongInterface.get_tags` method removed,
#     new `get_m3u8_master_url` helper.
#
# - 3.7.1 (in prep on upstream `main` — admitted to support window as
#   "Untested" until upstream tags it; gate logic already handles 3.7.1
#   transparently via `is_version_at_least("3.7.1", "3.7") == true`).
#   Four-commit bug-fix release:
#   * `eb9caff8` "Await get_tags_from_asset_info call" — async bug fix
#   * `50f82b5d` + `141d9cd6` music-video stream fetching refactor
#   * `5a41dfbd` "Handle missing m3u8 master URL" — graceful degradation
#   * `7ac33228` "Handle missing webplayback in song stream info" —
#     graceful degradation for `aac-web` codecs
#   * `4f910c8e` "Use 'codec' key instead of 'formats' in error" —
#     internal exception kwarg rename (MeedyaDL's error parser keys on
#     the human substring `"format is not available"`, not the
#     structured exception fields; zero impact)
#   * Same zero-code-change admission shape as v3.3 / v3.5 / v3.5.1 /
#     v3.5.2. Will bump `maximum_tested_version` to `3.7.1` in a
#     one-line PR once upstream tags it.
#
# 3.7.1 audit (2026-05-24, full-codebase re-audit after upstream tagged
# the release):
#   * 17 commits between v3.7 and v3.7.1 — 13 are internal refactors
#     (mp4.clear cleanup, SONG_CODEC_FLAVOR_MAP → MEDIA_CODEC_FLAVOR_MAP
#     rename, MusicVideoCodec.fourcc → @property, 447-line streaming-
#     decrypt refactor, yt-dlp HlsFD/HttpFD direct calls). All
#     zero-MeedyaDL-surface-impact.
#   * Two new RuntimeError strings ("yt-dlp HLS download failed" /
#     "yt-dlp HTTP download failed") — added to MeedyaDL's
#     `classify_error` network-category matcher.
#   * v3.7.1 track-info log adds `-` placeholder for unknown total
#     (`media_total or "-"`) — TRACK_INFO_V2_REGEX widened to accept
#     `(\d+|-)` for the total slot; downstream parse-to-None path
#     already handled non-numeric.
#   * No new CLI flags / INI keys / wrapper-protocol changes / URL
#     regex changes / metadata-tag changes.
#
# 3.7.2 + 3.7.3 audit (#898, 2026-05-28, audit doc at
# `.github/audits/gamdl-v3.7.2-v3.7.3-audit.md`):
#   * Both releases shipped the same day; 3 functional commits across
#     the pair (~4 lines changed). Bug-fix-only pattern.
#   * `817479d` `interface/music_video.py::get_tags`: music-video title /
#     album tags swap to UNCENSORED names (`trackName` / `collectionName`)
#     for the primary `\xa9nam` / `\xa9alb` atoms, with the censored
#     variants moving to the standard sort-order atoms `sonm` / `soal`.
#     MeedyaDL does not write either sort atom, so we don't collide.
#     User-visible: MV filename templates using `{title}` / `{album}`
#     produce uncensored filenames post-upgrade. Songs unaffected.
#     Documentation only — no MeedyaDL code change.
#   * `f54ab12` (3.7.2 songs) + `8398d9c` (3.7.3 music-videos): defensive
#     `.get("playParams", {}).get("isLibrary")` access prevents bare
#     `KeyError: 'playParams'` tracebacks. Affected items now reach the
#     existing `is_media_streamable` check and raise the structured
#     `GamdlInterfaceMediaNotStreamableError("Media is not streamable:
#     <id>")` instead. The error class itself has existed since at
#     least 3.5.2; what's new is that the message now surfaces
#     reliably for content that's been removed, region-locked, or is
#     library-only.
#   * MeedyaDL change: new `is_media_not_streamable_error()` helper +
#     dedicated `media_not_streamable` classifier bucket with
#     actionable guidance, in `utils/process.rs`. Ordered before the
#     generic `not_found` substring check so the specific guidance
#     wins over the broader "content may be removed" message. 6 new
#     unit tests cover matcher, classifier ordering, and guidance.
#   * No new CLI flags / INI keys / wrapper-protocol changes / URL
#     regex changes / `GamdlFeature` gate. Same zero-or-minimal-code-
#     change admission shape as v3.3 / v3.5 / v3.5.1 / v3.5.2 / v3.7.1.
#
# 3.7.4 audit (#925, 2026-06-14, audit doc at
# `.github/audits/gamdl-v3.7.4-audit.md`):
#   * Pure upstream reliability patch — 5 commits, 7 files (5
#     functional + 2 version-bump). Same bug-fix-only shape as v3.3 /
#     v3.5 / v3.5.1 / v3.5.2.
#   * `a9e7538` (`interface/song.py`): new private
#     `_switch_m3u8_master_url_to_default()` regex rewrites HLS
#     variant master URLs to the canonical `_default.m3u8` form.
#     Internal to GAMDL's HLS pipeline — MeedyaDL never inspects
#     m3u8 URLs; the only references in our codebase are comments
#     about GAMDL's debug-log key.
#   * `b66c06a` (`api/apple_music.py`): token-extraction regex
#     hardened — Apple renamed the home-page bundle from
#     `index-legacy-*.js` to `index-*.js`; tightened JWT capture to
#     require structurally valid `eyJ*.eyJ*.*` segments inside
#     quotes. Internal to GAMDL's own `get_token()` — MeedyaDL's
#     `apple_music_api.rs::TokenSource` chain (user MusicKit JWT >
#     embedded > web-player keychain) is independent.
#   * `fb143ad` (`interface/base.py::get_cover_bytes`): explicit
#     30s timeout + `follow_redirects=True` on cover-art HTTP
#     fetches. Reliability win — MeedyaDL observes the resulting
#     cover-image *files* on disk, not the HTTP path.
#   * `69c2a8a` (`api/exceptions.py::GamdlApiResponseError`):
#     `content` typed `Any | None` (was `str | None`); non-string
#     content now JSON-serialised via `json.dumps()` with `TypeError`
#     fallback to `str()`. The `Resource Not Found` literal that
#     `process::is_storefront_mismatch_error` keys on is preserved;
#     `PYTHON_EXCEPTION_REGEX` keys on the class-name prefix, not
#     content. Verified compatible.
#   * No new CLI flags / INI keys / output-line format changes /
#     exception classes / log-level changes / `GamdlFeature` gate
#     thresholds. Same zero-code-change admission shape as v3.3 /
#     v3.5 / v3.5.1 / v3.5.2 / v3.7.1.
maximum_tested_version = "3.7.4"
# What the installer will resolve to when run with no override. Always
# within `[minimum_version, maximum_tested_version]`.
recommended_version = "3.7.4"

# Votify is installed via pip (mirrors the GAMDL pattern). Same support-
# window contract: the running MeedyaDL build only "knows about" releases
# within `[minimum_version, maximum_tested_version]`. Consumed by
# `services::votify_capabilities` for:
#
#   * capping `pip install --upgrade` to the tested range (M9-2),
#   * suppressing update prompts when upstream ships beyond our
#     ceiling (M9-2 / future update banner), and
#   * classifying the installed version at startup
#     (Unsupported / Supported / Untested / NotInstalled).
#
# Bump `maximum_tested_version` / `recommended_version` every time we
# validate a new votify release. `minimum_version` is the oldest
# release MeedyaDL still supports — bump up only when an older release
# drops a CLI feature we depend on (mirrors the GAMDL pattern where
# minimum is held at 2.9.1 because that's where `--song-codec-priority`
# became reliable for albums).
#
# Initial M9-1 window:
#
# - minimum_version = "1.9.0" — first 1.9.x release. Conservative floor;
#   older 1.7.x/1.8.x lines exist but predate the AAC-medium / AAC-high
#   default-codec flow MeedyaDL relies on for free + Premium accounts.
# - maximum_tested_version = "1.9.9" — current latest on PyPI at the
#   time of PR M9-1 landing (2026-06-07). No audit has been done yet;
#   the M9-1 scaffold treats every flag MeedyaDL emits as conservative.
# - recommended_version = "1.9.9" — same.
#
# When upstream votify ships 1.10.x or 2.x, the `upstream-engine-watch.yml`
# workflow files an audit issue (#101 follow-up), same shape as the
# existing GAMDL audit cadence (#898 / #767 / #711). The audit reviews
# the upstream commits, decides whether the new release is admitted to
# the support window with or without code changes, and bumps these
# constants in a one-line PR (same shape as the GAMDL ceiling bumps).
[votify]
minimum_version = "1.9.0"
maximum_tested_version = "1.9.9"
recommended_version = "1.9.9"
