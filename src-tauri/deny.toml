# deny.toml -- cargo-deny configuration for licence scanning and advisory auditing
# =================================================================================
#
# This file configures `cargo deny` to check the dependency tree for:
#   1. Known security vulnerabilities and unmaintained crate advisories (RustSec)
#   2. Licence compatibility with MeedyaDL's MIT licence
#   3. Allowed crate sources (crates.io and GitHub only)
#
# Run locally:
#   cd src-tauri && cargo deny check
#
# In CI, the EmbarkStudios/cargo-deny-action GitHub Action runs this automatically
# as part of the backend job in .github/workflows/ci.yml.
#
# @see https://embarkstudios.github.io/cargo-deny/ -- cargo-deny documentation
# @see https://rustsec.org/ -- RustSec Advisory Database

# ============================================================
# [graph] -- Dependency graph filtering
# ============================================================
# Exclude targets we don't build for to reduce false positives from
# platform-specific transitive dependencies.
#
# @see https://embarkstudios.github.io/cargo-deny/checks/cfg.html
[graph]
all-features = true

# ============================================================
# [advisories] -- Security vulnerability and unmaintained crate checks
# ============================================================
# Checks all dependencies against the RustSec Advisory Database for known
# vulnerabilities (CVEs, soundness issues) and unmaintained crate warnings.
#
# @see https://embarkstudios.github.io/cargo-deny/checks/advisories.html
# @see https://github.com/RustSec/advisory-db
[advisories]
# Ignore policy — two narrow carve-outs:
#
#   (a) Unmaintained-crate advisories that come from Tauri's transitive
#       dependencies (derivative, fxhash, instant, proc-macro-error,
#       unic-*, and previously the GTK3 bindings) — none of these are
#       something MeedyaDL can update independently of Tauri/tao/wry
#       themselves. The GTK3 entries this comment used to mention were
#       removed on 2026-09-09: the gtk-rs project un-archived those
#       bindings and picked development back up, and RustSec marked all
#       ten advisories `withdrawn` on 2026-08-14 — see the `ignore` list
#       below for the verification.
#
#
#   (b) Security advisories whose vulnerable code path is demonstrably
#       unreachable in MeedyaDL's build/runtime AND that are tracked
#       upstream (Tauri or the intermediate crate) for permanent fix.
#       Each (b) entry MUST cite (i) the specific trigger conditions
#       from the advisory that do not apply to our usage, (ii) an
#       internal tracker issue, and (iii) the upstream tracker once
#       filed. An (b) entry without all three is not acceptable.
#
# If a genuine security vulnerability with a reachable code path
# appears, it will NOT be ignored — fix it, don't hide it.
ignore = [
    # GTK3 bindings (Tauri Linux dependency). These ten were previously
    # ignored as "awaiting Tauri GTK4 migration" -- that reason no longer
    # holds. The gtk-rs project un-archived its GTK3 bindings and picked
    # development back up; every one of these ten advisories carries
    # `withdrawn = "2026-08-14"` in the RustSec database now, and
    # `cargo deny check advisories` reports all ten as "advisory was not
    # encountered" (verified locally against cargo-deny 0.20.2). There is
    # nothing left for this ignore list to suppress.

    # Other unmaintained transitive dependencies from Tauri/tao/wry
    "RUSTSEC-2024-0370", # proc-macro-error — unmaintained (used by tao, field-offset)
    "RUSTSEC-2024-0384", # instant — unmaintained (used by parking_lot via Tauri)
    "RUSTSEC-2024-0388", # derivative — unmaintained (used by zbus via Tauri D-Bus)

    # unic-* crates — unmaintained (used by html5ever/markup5ever via Tauri)
    "RUSTSEC-2025-0075", # unic-char-range — unmaintained
    "RUSTSEC-2025-0080", # unic-common — unmaintained
    "RUSTSEC-2025-0081", # unic-char-property — unmaintained
    "RUSTSEC-2025-0098", # unic-ucd-version — unmaintained
    "RUSTSEC-2025-0100", # unic-ucd-ident — unmaintained

    # paste — unmaintained (transitive dependency from lofty, used for ReplayGain tagging)
    "RUSTSEC-2024-0436", # paste — unmaintained (archived by dtolnay, no security issue)

    # glib — VariantStrIter unsoundness in Iterator / DoubleEndedIterator
    # impls. Removed from the tree at some point during the Tauri dependency
    # churn (cargo-deny reports "advisory-not-detected"); the ignore is
    # kept commented for forensic traceability of past exposure.
    # "RUSTSEC-2024-0429", # glib — no longer in the tree (advisory-not-detected)

    # Security advisories with demonstrably unreachable code paths (carve-out
    # (b) in the policy comment above). Each entry MUST cite the specific
    # advisory trigger conditions that do NOT apply to our usage, an internal
    # tracker issue, and an upstream tracker URL.
    #
    # quick-xml 0.36.2 — two DoS advisories on the O(N²) attribute /
    # namespace scan hot paths (both patched in quick-xml >= 0.41.0).
    #
    # This entry previously claimed the vulnerable copy only arrives via
    # `plist -> tauri`, on a path that never sees untrusted XML, and that
    # user-supplied lyrics TTML is parsed via the separate `roxmltree`
    # crate instead. Checked again while auditing this file (2026-09-09,
    # `cargo tree -i quick-xml@0.36.2`): that is no longer true, and may
    # not have been true when written. There are two copies of quick-xml
    # in the tree today. `quick-xml 0.41.0` does arrive via
    # `plist -> tauri`, and IS already patched. But `quick-xml 0.36.2` —
    # the vulnerable one this ignore entry is actually about — arrives
    # via `meedya-lyrics -> meedyadl` (`meedya-lyrics::lyricsfile_ttml.rs`
    # / `lyricsfile_ttml_classify.rs`, both plain `quick_xml::Reader`,
    # both call `.attributes()` with duplicate-name checking on, its
    # default). `services/lyricsfile_service.rs` feeds that reader the
    # TTML lyrics sidecar GAMDL fetched from Apple Music for the track
    # just downloaded — exactly the untrusted input this ignore entry
    # said never reached quick-xml.
    #
    # What actually limits the exposure: this whole code path is opt-in
    # and off by default. It only runs when the user has turned on
    # `generate_lyricsfile` (Settings > Lyrics > Lyricsfile), and only
    # RUSTSEC-2026-0194 (the O(N²) duplicate-attribute-name scan) is
    # reachable through it — `meedya-lyrics` never uses `NsReader`, so
    # RUSTSEC-2026-0195 (unbounded namespace-declaration allocation)
    # cannot fire via this path; cargo-deny still has to be told to
    # ignore both, because it flags a vulnerable crate VERSION in the
    # tree, not a specific reachable function. Both advisories are
    # denial-of-service only (CPU or memory exhaustion) — a
    # maliciously-crafted lyrics file already covered by this ignore
    # could make the app become unresponsive while converting it, never
    # anything worse (no code execution, no data exposure).
    #
    # This cannot be fixed from this repository: MeedyaDL cannot bump
    # `meedya-lyrics`'s own `quick-xml` dependency, only MeedyaSuite-core
    # can. The real fix is upstream, in `meedya-lyrics`'s `Cargo.toml`.
    # Upstream trackers (for quick-xml's own fix, already released):
    # https://github.com/tafia/quick-xml/issues/970
    # https://github.com/tafia/quick-xml/issues/978
    "RUSTSEC-2026-0194", # quick-xml 0.36.2 via meedya-lyrics — O(N²) attributes() on untrusted TTML, opt-in feature, DoS only
    "RUSTSEC-2026-0195", # quick-xml 0.36.2 via meedya-lyrics — NsReader unbounded push; not reachable (meedya-lyrics never uses NsReader), kept ignored because cargo-deny flags the crate version regardless
]

# ============================================================
# [licenses] -- Licence compatibility checks
# ============================================================
# MeedyaDL is MIT-licensed. This section ensures all dependencies use
# licences compatible with MIT distribution. Most Rust crates use
# MIT/Apache-2.0 dual licensing. Some Tauri dependencies use MPL-2.0,
# which is compatible when linked (not copy-pasted).
#
# @see https://embarkstudios.github.io/cargo-deny/checks/licenses.html
# @see https://spdx.org/licenses/ -- SPDX licence identifiers
[licenses]
# Confidence threshold for licence file detection (0.0 - 1.0).
# 0.8 is the recommended default — high enough to avoid false positives
# while catching most licence variations.
confidence-threshold = 0.8

# Licences explicitly allowed in the dependency tree.
# All of these are permissive or weakly-copyleft licences compatible
# with MIT distribution as a desktop application.
allow = [
    # Permissive licences (no restrictions beyond attribution)
    "MIT",                      # Most Rust crates
    "MIT-0",                    # MIT No Attribution (even more permissive)
    "Apache-2.0",               # Many Rust crates (often dual with MIT)
    "Apache-2.0 WITH LLVM-exception", # rustix, wasi, linux-raw-sys
    "BSD-2-Clause",             # zerocopy
    "BSD-3-Clause",             # brotli, encoding_rs, subtle, num_enum
    "BSL-1.0",                  # ryu (Boost Software Licence)
    "ISC",                      # ring, rustls, aws-lc-rs, untrusted
    "Unlicense",                # aho-corasick, memchr, byteorder, walkdir
    "Zlib",                     # bytemuck, objc2-*, miniz_oxide, raw-window-handle
    "0BSD",                     # adler2 (BSD Zero Clause)
    "CC0-1.0",                  # constant_time_eq, dunce, tiny-keccak
    "Unicode-3.0",              # icu_*, unicode-ident, zerovec, yoke
    "CDLA-Permissive-2.0",      # webpki-root-certs (Community Data Licence)

    # Weakly-copyleft licences (compatible with MIT for linking)
    "MPL-2.0",                  # symphonia, cssparser, selectors (Mozilla Public Licence)
]

# Crates whose licence is not in a standard SPDX-parseable format or needs
# manual verification. These have been reviewed and confirmed compatible.
[[licenses.clarify]]
# ring uses a custom ISC-style licence with OpenSSL heritage.
# The licence text is ISC-compatible and has been reviewed.
# @see https://github.com/briansmith/ring/blob/main/LICENSE
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---- LGPL exceptions ----
# These crates are LGPL-licensed but are transitive dependencies that we
# cannot avoid. They are statically linked into the binary, which technically
# requires LGPL compliance (source availability for the LGPL portions).
# MeedyaDL is open-source (MIT), so this obligation is satisfied.

[[licenses.exceptions]]
# configparser — MIT OR LGPL-3.0-or-later (direct dependency, MIT chosen)
name = "configparser"
allow = ["LGPL-3.0-or-later"]

[[licenses.exceptions]]
# libesedb — LGPL-3.0-or-later only (transitive via rookie cookie extraction)
name = "libesedb"
allow = ["LGPL-3.0-or-later"]

[[licenses.exceptions]]
# libesedb-sys — LGPL-3.0-or-later only (transitive via rookie)
name = "libesedb-sys"
allow = ["LGPL-3.0-or-later"]

[[licenses.exceptions]]
# r-efi — MIT OR Apache-2.0 OR LGPL-2.1-or-later (MIT chosen, but LGPL listed)
name = "r-efi"
allow = ["LGPL-2.1-or-later"]

# ============================================================
# [bans] -- Crate ban and duplicate detection
# ============================================================
# Skipped for now. The default deny-multiple-versions mode is too noisy
# for a Tauri project with deep transitive dependency trees that naturally
# pull in multiple versions of common crates (e.g., windows-sys, bitflags,
# syn, tokio, indexmap). Revisit when the ecosystem converges.
#
# @see https://embarkstudios.github.io/cargo-deny/checks/bans.html
[bans]
multiple-versions = "allow"

# ============================================================
# [sources] -- Allowed crate sources
# ============================================================
# Restricts where crates can be fetched from. Only crates.io (the official
# Rust package registry) and GitHub repositories are allowed. This prevents
# supply chain attacks via unofficial registries.
#
# @see https://embarkstudios.github.io/cargo-deny/checks/sources.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Allow crates from the official registry
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allow all git dependencies from our GitHub organisations.
# - MWBMPartners: MeedyaSuite-core and future internal crates
# - MeedyaSuite: MeedyaDL-Tools and future project-specific repos
# Covers any branch, tag, or rev qualifier in the Cargo.toml git URL.
[sources.allow-org]
github = ["MWBMPartners", "MeedyaSuite"]
