# ============================================================
# Meta Codecs — Resolve Per-Service
# ============================================================
# Meta codecs are abstract quality tiers that resolve to the best
# available concrete codec for each service. Users select intent
# (e.g., "lossless") without needing to know service internals.

[meta.lossless]
name = "Lossless (Best Available)"
category = "lossless"
resolves_to = { gamdl = "alac", votify = "flac" }

[meta.atmos]
name = "Dolby Atmos (Best Available)"
category = "spatial"
resolves_to = { gamdl = "eac3-atmos" }

[meta.best-lossy]
name = "Best Lossy"
category = "lossy"
resolves_to = { gamdl = "aac-hq", votify = "ogg-vorbis" }

