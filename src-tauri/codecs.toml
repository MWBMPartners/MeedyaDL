[video.h265]
name = "H.265 (HEVC)"
category = "modern"
mimetype = "video/hevc"
[video.h265.services]
gamdl = "h265"

[video.h264]
name = "H.264 (AVC)"
category = "compatible"
mimetype = "video/avc"
[video.h264.services]
gamdl = "h264"
votify = "mp4"

[video.vp9]
name = "VP9"
category = "modern"
mimetype = "video/webm"
# YouTube/yt-dlp mapping TBD in M9

[video.av1]
name = "AV1"
category = "modern"
mimetype = "video/av1"
# Future codec — increasingly used by streaming services

# ============================================================
# Lyrics / Subtitle / Caption Formats
# ============================================================
# These define the text-based sidecar and embedded lyrics formats
# supported across services. Each format has a file extension,
# MIME type, and per-service support flags.

[lyrics.ttml]
name = "TTML (Timed Text Markup Language)"
category = "xml"
extension = "ttml"
mimetype = "application/ttml+xml"
word_timing = true
[lyrics.ttml.services]
gamdl = "ttml"

[lyrics.lrc]
name = "LRC (Synced Lyrics)"
category = "text"
extension = "lrc"
mimetype = "text/x-lrc"
word_timing = false
[lyrics.lrc.services]
gamdl = "lrc"

[lyrics.enhanced-lrc]
name = "Enhanced LRC (Word-by-Word Sync)"
category = "text"
extension = "lrc"
mimetype = "text/x-lrc"
word_timing = true
# Enhanced LRC is generated by MeedyaDL from TTML — not a native
# GAMDL output format. It uses the same .lrc extension but includes
# inline <mm:ss.xx> word timestamps.

[lyrics.srt]
name = "SRT (SubRip Subtitle)"
category = "text"
extension = "srt"
mimetype = "application/x-subrip"
word_timing = false
[lyrics.srt.services]
gamdl = "srt"

[lyrics.vtt]
name = "WebVTT"
category = "text"
extension = "vtt"
mimetype = "text/vtt"
word_timing = false
# YouTube/yt-dlp mapping TBD in M9
