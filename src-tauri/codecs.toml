# MeedyaDL Universal Codec Registry
# =================================
#
# Defines canonical codec IDs and their per-service CLI flag mappings.
# This file is compiled into the binary via `include_str!("../../codecs.toml")`
# in `models/codec_registry.rs` and parsed at runtime.
#
# ## Structure
#
# Each codec has:
#   - `name`     : Human-readable display name for the UI
#   - `category` : Grouping for UI organisation ("spatial", "lossless", "lossy")
#   - `lossless` : Whether this codec preserves original audio quality
#   - `suffix`   : Filename suffix for companion download disambiguation
#                  (e.g., "[Lossless]", "[Dolby Atmos]"). Empty string means
#                  the codec uses clean filenames (most universal format).
#   - `services` : Per-service CLI flag mappings (service_id = "flag_value")
#                  Omitted services mean the codec is not available there.
#
# Meta codecs have `resolves_to` instead of `services` — they map to a
# concrete codec ID per service (e.g., "lossless" → "alac" for Apple Music).
#
# ## Adding a New Service
#
# 1. Add a new key under each codec's `[*.services]` table
# 2. The key is the service engine ID (e.g., "gamdl", "votify", "ytdlp")
# 3. The value is the exact CLI flag string that engine expects
#
# ## Adding a New Codec
#
# 1. Add a new `[audio.<id>]` or `[video.<id>]` section
# 2. Choose an ID that is descriptive and kebab-case (e.g., "aac-hq")
# 3. Add `[audio.<id>.services]` with mappings for supported services
# 4. If the codec isn't supported by any service yet, omit the services table

# ============================================================
# Audio Codecs — Spatial / Immersive
# ============================================================

[audio.eac3-atmos]
name = "Dolby Atmos (E-AC-3)"
category = "spatial"
lossless = false
mimetype = "audio/eac3"
suffix = "[Dolby Atmos]"
[audio.eac3-atmos.services]
gamdl = "atmos"

[audio.ac3]
name = "Dolby Digital (AC-3)"
category = "spatial"
lossless = false
mimetype = "audio/ac3"
suffix = "[Dolby Digital]"
[audio.ac3.services]
gamdl = "ac3"

[audio.ac4-atmos]
name = "Dolby Atmos (AC-4)"
category = "spatial"
lossless = false
mimetype = "audio/ac4"
suffix = "[Dolby Atmos AC-4]"
# No service mappings yet — AC-4 Atmos is used in streaming but not
# currently downloadable via any supported service engine.

[audio.thd-atmos]
name = "Dolby Atmos (TrueHD)"
category = "spatial"
lossless = true
mimetype = "audio/truehd"
suffix = "[Dolby TrueHD]"
# No service mappings yet — TrueHD Atmos is disc-only (Blu-ray),
# not available from any streaming service.

