<svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!--
    BBC Sounds icon (sound waves radiating from centre).
    Inspired by the BBC Sounds visual identity (concentric arcs).
    Uses currentColor for theme adaptability — inherits colour from parent
    CSS context, so it works in light, dark, and colour-blind modes.
    Rendered inline via PlatformIcon component (not as <img>).
  -->
  <!-- Centre dot -->
  <circle cx="12" cy="12" r="2" fill="currentColor" fill-opacity="0.8"/>
  <!-- Inner wave -->
  <path d="M8.5 8.5a5 5 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M8.5 15.5a5 5 0 0 0 7 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Outer wave -->
  <path d="M5.5 5.5a9.2 9.2 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M5.5 18.5a9.2 9.2 0 0 0 13 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
