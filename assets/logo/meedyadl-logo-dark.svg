  MeedyaDL Brand Logo (Dark Variant)
  Intended for dark backgrounds with light wordmark colors.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc">
  <title id="title">MeedyaDL logo dark</title>
  <desc id="desc">A rounded-square media download icon followed by the word MeedyaDL and the tagline online multimedia downloader.</desc>

  <defs>
    <linearGradient id="bg" x1="56" y1="44" x2="464" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B132B"/>
      <stop offset="0.52" stop-color="#1C2541"/>
      <stop offset="1" stop-color="#3A506B"/>
    </linearGradient>
    <linearGradient id="edge" x1="96" y1="86" x2="426" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BC0BE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6FFFE9" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="core" x1="152" y1="146" x2="360" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DFF8FF"/>
    </linearGradient>
    <linearGradient id="arrow" x1="256" y1="224" x2="256" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7BFFD8"/>
      <stop offset="1" stop-color="#3BC9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g transform="translate(40 40)" filter="url(#shadow)">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
    <rect x="98" y="94" width="316" height="316" rx="76" fill="none" stroke="url(#edge)" stroke-width="20"/>
    <rect x="152" y="148" width="208" height="208" rx="44" fill="url(#core)" opacity="0.97"/>
    <path d="M214 219L214 289" stroke="#1C2541" stroke-width="18" stroke-linecap="round"/>
    <path d="M298 219L298 289" stroke="#1C2541" stroke-width="18" stroke-linecap="round"/>
    <rect x="186" y="194" width="140" height="24" rx="12" fill="#1C2541"/>
    <rect x="240" y="248" width="32" height="90" rx="16" fill="url(#arrow)"/>
    <path d="M199 317L256 378L313 317" fill="url(#arrow)"/>
    <rect x="188" y="391" width="136" height="16" rx="8" fill="url(#arrow)" opacity="0.96"/>
  </g>

  <g font-family="Avenir Next, Montserrat, Poppins, Segoe UI, Arial, sans-serif">
    <text x="610" y="292" font-size="196" font-weight="800" letter-spacing="0.2" fill="#E2E8F0">Meedya</text>
    <text x="1326" y="292" font-size="196" font-weight="900" letter-spacing="1.2" fill="#7DD3FC">DL</text>
    <text x="616" y="370" font-size="42" font-weight="600" letter-spacing="8" fill="#94A3B8">ONLINE MULTIMEDIA DOWNLOADER</text>
  </g>
</svg>
