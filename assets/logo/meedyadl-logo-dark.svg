  MeedyaDL Brand Logo (Dark Variant)
  Intended for dark backgrounds with light wordmark colors.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc">
  <title id="title">MeedyaDL logo dark</title>
  <desc id="desc">A rounded-square media mark combining an open clapperboard, download arrow, and music note followed by the MeedyaDL wordmark.</desc>

  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="452" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B9FFF"/>
      <stop offset="1" stop-color="#0F78F8"/>
    </linearGradient>
    <linearGradient id="shine" x1="120" y1="80" x2="392" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8DD0FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8DD0FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.50"/>
    </filter>
  </defs>

  <g transform="translate(40 40)" filter="url(#shadow)">
    <rect x="24" y="24" width="464" height="464" rx="106" fill="url(#bg)"/>
    <rect x="24" y="24" width="464" height="464" rx="106" fill="url(#shine)"/>
    <rect x="70" y="70" width="372" height="372" rx="84" fill="none" stroke="#C8E5FF" stroke-opacity="0.24" stroke-width="8"/>

    <g transform="rotate(-12 256 166)">
      <rect x="140" y="132" width="232" height="54" rx="15" fill="#061B37" fill-opacity="0.92"/>
      <line x1="162" y1="140" x2="184" y2="178" stroke="#8CCBFF" stroke-width="10" stroke-linecap="round"/>
      <line x1="206" y1="140" x2="228" y2="178" stroke="#8CCBFF" stroke-width="10" stroke-linecap="round"/>
      <line x1="250" y1="140" x2="272" y2="178" stroke="#8CCBFF" stroke-width="10" stroke-linecap="round"/>
      <line x1="294" y1="140" x2="316" y2="178" stroke="#8CCBFF" stroke-width="10" stroke-linecap="round"/>
    </g>

    <rect x="154" y="210" width="204" height="150" rx="24" fill="#061B37" fill-opacity="0.90"/>
    <path d="M256 236V292" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <path d="M224 270L256 302L288 270" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M214 322V336C214 346.493 222.507 355 233 355H279C289.493 355 298 346.493 298 336V322" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

    <circle cx="352" cy="352" r="40" fill="#0C66D9" stroke="#9BD2FF" stroke-width="4"/>
    <circle cx="349" cy="366" r="9" fill="#FFFFFF"/>
    <circle cx="371" cy="356" r="9" fill="#FFFFFF"/>
    <rect x="345" y="320" width="8" height="42" rx="4" fill="#FFFFFF"/>
    <rect x="367" y="312" width="8" height="38" rx="4" fill="#FFFFFF"/>
    <path d="M349 322L371 314V326L349 334V322Z" fill="#FFFFFF"/>
  </g>

  <g font-family="Avenir Next, Montserrat, Poppins, Segoe UI, Arial, sans-serif">
    <text x="610" y="292" font-size="196" font-weight="800" letter-spacing="0.2" fill="#E2E8F0">Meedya</text>
    <text x="1326" y="292" font-size="196" font-weight="900" letter-spacing="1.2" fill="#93C5FD">DL</text>
    <text x="616" y="370" font-size="42" font-weight="600" letter-spacing="8" fill="#94A3B8">ONLINE MULTIMEDIA DOWNLOADER</text>
  </g>
</svg>
