<!DOCTYPE html>
<html>
<head>
<title>MeedyaDL Brand — Mode Tests</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; padding: 20px; background: #f8f9fa; }
  h1 { font-size: 20px; margin-bottom: 8px; color: #333; }
  h2 { font-size: 15px; margin: 24px 0 12px; color: #666; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .card { text-align: center; border-radius: 8px; overflow: hidden; }
  .card.light { background: #fff; border: 1px solid #e0e0e0; }
  .card.dark { background: #1a1a2e; border: 1px solid #333; }
  .card label { display: block; padding: 6px 10px; font-size: 11px; font-weight: 600; }
  .card.light label { color: #666; background: #f5f5f5; }
  .card.dark label { color: #aaa; background: #12121f; }
  object { display: block; border: none; }
  .logo-obj { width: 200px; height: 200px; }
  .logotype-obj { width: 300px; height: 65px; }
  .icon-obj { width: 128px; height: 128px; }
</style>
</head>
<body>

<h1>MeedyaDL Brand — Mode Tests</h1>

<h2>Logo (logo.svg)</h2>
<div class="grid">
  <div class="card light">
    <label>Default (light)</label>
    <object class="logo-obj" data="logo.svg" type="image/svg+xml"></object>
  </div>
  <div class="card dark">
    <label>?mode=dark</label>
    <object class="logo-obj" data="logo.svg?mode=dark" type="image/svg+xml"></object>
  </div>
  <div class="card light">
    <label>?mode=cb-deutan</label>
    <object class="logo-obj" data="logo.svg?mode=cb-deutan" type="image/svg+xml"></object>
  </div>
  <div class="card light">
    <label>?mode=cb-protan</label>
    <object class="logo-obj" data="logo.svg?mode=cb-protan" type="image/svg+xml"></object>
  </div>
  <div class="card light">
    <label>?mode=cb-tritan</label>
    <object class="logo-obj" data="logo.svg?mode=cb-tritan" type="image/svg+xml"></object>
  </div>
  <div class="card dark">
    <label>?mode=cb-deutan-dark</label>
    <object class="logo-obj" data="logo.svg?mode=cb-deutan-dark" type="image/svg+xml"></object>
  </div>
  <div class="card dark">
    <label>?mode=cb-protan-dark</label>
    <object class="logo-obj" data="logo.svg?mode=cb-protan-dark" type="image/svg+xml"></object>
  </div>
  <div class="card dark">
    <label>?mode=cb-tritan-dark</label>
    <object class="logo-obj" data="logo.svg?mode=cb-tritan-dark" type="image/svg+xml"></object>
  </div>
</div>

<h2>Logotype (logotype.svg)</h2>
<div class="grid">
  <div class="card light">
    <label>Default (light)</label>
    <object class="logotype-obj" data="logotype.svg" type="image/svg+xml"></object>
  </div>
  <div class="card dark">
    <label>?mode=dark</label>
    <object class="logotype-obj" data="logotype.svg?mode=dark" type="image/svg+xml"></object>
  </div>
  <div class="card light">
    <label>?mode=cb-deutan</label>
    <object class="logotype-obj" data="logotype.svg?mode=cb-deutan" type="image/svg+xml"></object>
  </div>
  <div class="card light">
    <label>?mode=cb-protan</label>
    <object class="logotype-obj" data="logotype.svg?mode=cb-protan" type="image/svg+xml"></object>
  </div>
  <div class="card light">
    <label>?mode=cb-tritan</label>
    <object class="logotype-obj" data="logotype.svg?mode=cb-tritan" type="image/svg+xml"></object>
  </div>
  <div class="card dark">
    <label>?mode=cb-deutan-dark</label>
    <object class="logotype-obj" data="logotype.svg?mode=cb-deutan-dark" type="image/svg+xml"></object>
  </div>
  <div class="card dark">
    <label>?mode=cb-protan-dark</label>
    <object class="logotype-obj" data="logotype.svg?mode=cb-protan-dark" type="image/svg+xml"></object>
  </div>
  <div class="card dark">
    <label>?mode=cb-tritan-dark</label>
    <object class="logotype-obj" data="logotype.svg?mode=cb-tritan-dark" type="image/svg+xml"></object>
  </div>
</div>

<h2>Icon (icon.svg)</h2>
<div class="grid">
  <div class="card light">
    <label>icon.svg</label>
    <object class="icon-obj" data="icon.svg" type="image/svg+xml"></object>
  </div>
  <div class="card dark">
    <label>icon.svg (dark bg)</label>
    <object class="icon-obj" data="icon.svg" type="image/svg+xml"></object>
  </div>
  <div class="card light">
    <label>icon.png (1024px)</label>
    <img class="icon-obj" src="icon.png" alt="icon.png">
  </div>
  <div class="card light">
    <label>Liquid Glass</label>
    <img class="icon-obj" src="icon-liquidglass.png" alt="Liquid Glass">
  </div>
  <div class="card dark">
    <label>Liquid Glass (dark bg)</label>
    <img class="icon-obj" src="icon-liquidglass.png" alt="Liquid Glass dark">
  </div>
  <div class="card light">
    <label>favicon.ico sizes</label>
    <img src="icon.png" width="48" height="48" alt="48px">
    <img src="icon.png" width="32" height="32" alt="32px" style="margin-left:8px">
    <img src="icon.png" width="16" height="16" alt="16px" style="margin-left:8px">
  </div>
</div>

</body>
</html>
