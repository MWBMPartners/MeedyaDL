<!--
  MeedyaDL Logo - Circular emblem with audio/video crossfade
  ============================================================

  A vinyl disc and film reel crossfade inside a circular emblem,
  flanked by cascading downward V chevrons indicating "download".
  Both disc and reel rotate. Fully responsive (no fixed width/height).

  Customisation (CSS custom properties):
    logo-primary, logo-secondary, logo-accent, logo-disc,
    logo-disc-highlight, logo-shadow, logo-glow,
    logo-animation-speed, logo-transition-speed

  Modes: ?mode=light|dark|cb-deutan|cb-protan|cb-tritan
         |cb-deutan-dark|cb-protan-dark|cb-tritan-dark
  Or CSS classes: .dark, .cb-deutan, .cb-protan, .cb-tritan
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     role="img" aria-label="MeedyaDL logo">
  <title>MeedyaDL Logo</title>
  <desc>Circular emblem with crossfading vinyl disc and film reel, flanked by download chevrons</desc>

  <defs>
    <style>
      /* ── Custom Properties ───────────────────────────────── */
      :root {
        --logo-primary: #475569;
        --logo-secondary: #94A3B8;
        --logo-accent: #64748B;
        --logo-disc: #334155;
        --logo-disc-highlight: #475569;
        --logo-shadow: rgba(0, 0, 0, 0.35);
        --logo-glow: rgba(148, 163, 184, 0.25);
        --logo-animation-speed: 2.5s;
        --logo-transition-speed: 8s;
      }

      /* ── Dark Mode ───────────────────────────────────────── */
      @media (prefers-color-scheme: dark) {
        :root {
          --logo-primary: #CBD5E1; --logo-secondary: #F1F5F9;
          --logo-accent: #94A3B8; --logo-disc: #1E293B;
          --logo-disc-highlight: #334155;
          --logo-shadow: rgba(0, 0, 0, 0.6);
          --logo-glow: rgba(203, 213, 225, 0.2);
        }
      }
      .dark {
        --logo-primary: #CBD5E1; --logo-secondary: #F1F5F9;
        --logo-accent: #94A3B8; --logo-disc: #1E293B;
        --logo-disc-highlight: #334155;
        --logo-shadow: rgba(0, 0, 0, 0.6);
        --logo-glow: rgba(203, 213, 225, 0.2);
      }

      /* ── Colour-blind (light) ────────────────────────────── */
      .cb-deutan {
        --logo-primary: #648FFF; --logo-secondary: #FFB000;
        --logo-accent: #785EF0; --logo-disc: #2D3748;
        --logo-disc-highlight: #4A5568;
      }
      .cb-protan {
        --logo-primary: #648FFF; --logo-secondary: #DC267F;
        --logo-accent: #FFB000; --logo-disc: #2D3748;
        --logo-disc-highlight: #4A5568;
      }
      .cb-tritan {
        --logo-primary: #D55E00; --logo-secondary: #CC79A7;
        --logo-accent: #D55E00; --logo-disc: #2D3748;
        --logo-disc-highlight: #4A5568;
      }

      /* ── Colour-blind (dark) ─────────────────────────────── */
      .dark.cb-deutan, .cb-deutan-dark {
        --logo-primary: #85AAFF; --logo-secondary: #FFC940;
        --logo-accent: #9B85FF; --logo-disc: #1A202C;
        --logo-disc-highlight: #2D3748;
        --logo-shadow: rgba(0,0,0,0.6);
      }
      .dark.cb-protan, .cb-protan-dark {
        --logo-primary: #85AAFF; --logo-secondary: #FF5CA1;
        --logo-accent: #FFC940; --logo-disc: #1A202C;
        --logo-disc-highlight: #2D3748;
        --logo-shadow: rgba(0,0,0,0.6);
      }
      .dark.cb-tritan, .cb-tritan-dark {
        --logo-primary: #FF8533; --logo-secondary: #E09DBF;
        --logo-accent: #FF8533; --logo-disc: #1A202C;
        --logo-disc-highlight: #2D3748;
        --logo-shadow: rgba(0,0,0,0.6);
      }

      /* ── Crossfade ───────────────────────────────────────── */
      @keyframes show-audio {
        0%, 40%  { opacity: 1; }
        50%, 90% { opacity: 0; }
        100%     { opacity: 1; }
      }
      @keyframes show-video {
        0%, 40%  { opacity: 0; }
        50%, 90% { opacity: 1; }
        100%     { opacity: 0; }
      }
      #vinyl-wrapper  { animation: show-audio var(--logo-transition-speed) ease-in-out infinite; }
      #reel-wrapper   { animation: show-video var(--logo-transition-speed) ease-in-out infinite; }

      /* ── Rotation ────────────────────────────────────────── */
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      #vinyl-spin {
        animation: spin calc(var(--logo-animation-speed) * 3.2) linear infinite;
        transform-origin: 256px 256px;
      }
      #reel-spin {
        animation: spin calc(var(--logo-animation-speed) * 2) linear infinite;
        transform-origin: 256px 256px;
      }

      /* ── Chevron cascade ─────────────────────────────────── */
      @keyframes chev-fall {
        0%   { opacity: 0; transform: translateY(-18px); }
        15%  { opacity: 0.75; }
        85%  { opacity: 0.75; }
        100% { opacity: 0; transform: translateY(18px); }
      }
      #cl1 { animation: chev-fall 1.8s ease-in-out infinite 0.00s; }
      #cl2 { animation: chev-fall 1.8s ease-in-out infinite 0.22s; }
      #cl3 { animation: chev-fall 1.8s ease-in-out infinite 0.44s; }
      #cl4 { animation: chev-fall 1.8s ease-in-out infinite 0.66s; }
      #cl5 { animation: chev-fall 1.8s ease-in-out infinite 0.88s; }
      #cl6 { animation: chev-fall 1.8s ease-in-out infinite 1.10s; }
      #cl7 { animation: chev-fall 1.8s ease-in-out infinite 1.32s; }
      #cr1 { animation: chev-fall 1.8s ease-in-out infinite 0.10s; }
      #cr2 { animation: chev-fall 1.8s ease-in-out infinite 0.32s; }
      #cr3 { animation: chev-fall 1.8s ease-in-out infinite 0.54s; }
      #cr4 { animation: chev-fall 1.8s ease-in-out infinite 0.76s; }
      #cr5 { animation: chev-fall 1.8s ease-in-out infinite 0.98s; }
      #cr6 { animation: chev-fall 1.8s ease-in-out infinite 1.20s; }
      #cr7 { animation: chev-fall 1.8s ease-in-out infinite 1.42s; }

      /* ── Reduced motion ──────────────────────────────────── */
      @media (prefers-reduced-motion: reduce) {
        #vinyl-wrapper { animation: none !important; opacity: 1 !important; }
        #reel-wrapper  { animation: none !important; opacity: 0 !important; }
        #vinyl-spin, #reel-spin { animation: none !important; }
        #cl1,#cl2,#cl3,#cl4,#cl5,#cl6,#cl7,
        #cr1,#cr2,#cr3,#cr4,#cr5,#cr6,#cr7 {
          animation: none !important; opacity: 0.5 !important; transform: none !important;
        }
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="grad-chev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="var(--logo-primary)" />
      <stop offset="100%" stop-color="var(--logo-secondary)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="disc-shadow" x="-15%" y="-12%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="10"
                    flood-color="var(--logo-shadow)" flood-opacity="0.5" />
    </filter>
    <filter id="outer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12"
                    flood-color="var(--logo-glow)" flood-opacity="1" />
    </filter>
    <filter id="chev-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="3"
                    flood-color="var(--logo-shadow)" flood-opacity="0.5" />
    </filter>

    <!-- Clip for disc content -->
    <clipPath id="disc-clip">
      <circle cx="256" cy="256" r="192" />
    </clipPath>
  </defs>

  <!-- ═══════════ LEFT CHEVRONS ═══════════ -->
  <g id="chevrons-left" filter="url(#chev-shadow)">
    <path id="cl1" d="M24,40  L36,58  L48,40"  fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cl2" d="M24,100 L36,118 L48,100" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cl3" d="M24,160 L36,178 L48,160" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cl4" d="M24,220 L36,238 L48,220" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cl5" d="M24,280 L36,298 L48,280" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cl6" d="M24,340 L36,358 L48,340" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cl7" d="M24,400 L36,418 L48,400" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
  </g>

  <!-- ═══════════ RIGHT CHEVRONS ═══════════ -->
  <g id="chevrons-right" filter="url(#chev-shadow)">
    <path id="cr1" d="M464,40  L476,58  L488,40"  fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cr2" d="M464,100 L476,118 L488,100" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cr3" d="M464,160 L476,178 L488,160" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cr4" d="M464,220 L476,238 L488,220" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cr5" d="M464,280 L476,298 L488,280" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cr6" d="M464,340 L476,358 L488,340" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
    <path id="cr7" d="M464,400 L476,418 L488,400" fill="none" stroke="url(#grad-chev)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
  </g>

  <!-- ═══════════ CENTRAL EMBLEM (with glow + shadow) ═══════════ -->
  <g id="emblem" filter="url(#outer-glow)">

    <!-- Outer ring -->
    <circle cx="256" cy="256" r="195" fill="var(--logo-disc)" filter="url(#disc-shadow)" />

    <!-- ── VINYL RECORD (audio) ─────────────────────────────── -->
    <g id="vinyl-wrapper" clip-path="url(#disc-clip)">
      <g id="vinyl-spin">
        <circle cx="256" cy="256" r="190" fill="#0F172A" />

        <!-- Dense grooves -->
        <circle cx="256" cy="256" r="195" fill="none" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="0.4" opacity="0.6" />
        <circle cx="256" cy="256" r="185" fill="none" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="0.4" opacity="0.6" />
        <circle cx="256" cy="256" r="175" fill="none" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="0.4" opacity="0.6" />
        <circle cx="256" cy="256" r="165" fill="none" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="0.4" opacity="0.6" />
        <circle cx="256" cy="256" r="155" fill="none" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="256" cy="256" r="150" fill="none" stroke="#334155" stroke-width="0.4" opacity="0.6" />
        <circle cx="256" cy="256" r="145" fill="none" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="0.4" opacity="0.6" />
        <circle cx="256" cy="256" r="135" fill="none" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="0.4" opacity="0.6" />
        <circle cx="256" cy="256" r="125" fill="none" stroke="#1E293B" stroke-width="1.2" />

        <!-- Surface sheen -->
        <ellipse cx="200" cy="200" rx="110" ry="36" fill="white" opacity="0.04" transform="rotate(-38,200,200)" />
        <ellipse cx="320" cy="320" rx="55" ry="18" fill="white" opacity="0.025" transform="rotate(-38,320,320)" />

        <!-- Label -->
        <circle cx="256" cy="256" r="70" fill="var(--logo-disc-highlight)" />
        <circle cx="256" cy="256" r="68" fill="none" stroke="var(--logo-accent)" stroke-width="0.8" />
        <line x1="216" y1="238" x2="296" y2="238" stroke="var(--logo-accent)" stroke-width="1.5" opacity="0.4" />
        <line x1="224" y1="250" x2="288" y2="250" stroke="var(--logo-accent)" stroke-width="1" opacity="0.3" />
        <line x1="232" y1="275" x2="280" y2="275" stroke="var(--logo-accent)" stroke-width="1" opacity="0.3" />
        <!-- Music note -->
        <ellipse cx="248" cy="267" rx="7" ry="5" fill="var(--logo-secondary)" opacity="0.45" transform="rotate(-15,248,267)" />
        <rect x="254" y="250" width="2.5" height="18" rx="1" fill="var(--logo-secondary)" opacity="0.45" />
        <path d="M256.5,250 Q265,253 262,260" fill="none" stroke="var(--logo-secondary)" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
      </g>

      <!-- Spindle (static) -->
      <circle cx="256" cy="256" r="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <circle cx="254" cy="254" r="2" fill="white" opacity="0.07" />

      <!-- Rim bevel -->
      <circle cx="256" cy="256" r="190" fill="none" stroke="white" stroke-width="0.8" opacity="0.05" />
    </g>

    <!-- ── FILM REEL (video) ────────────────────────────────── -->
    <g id="reel-wrapper" opacity="0" clip-path="url(#disc-clip)">
      <g id="reel-spin">
        <circle cx="256" cy="256" r="190" fill="#1E293B" />

        <!-- Outer ring -->
        <circle cx="256" cy="256" r="197" fill="none" stroke="var(--logo-disc-highlight)" stroke-width="2.5" />

        <!-- Film strip channel -->
        <circle cx="256" cy="256" r="186" fill="none" stroke="var(--logo-disc-highlight)" stroke-width="18"
                stroke-dasharray="16 12" opacity="0.35" />

        <!-- 4 kidney windows -->
        <path d="M222,90 Q256,65 290,90 Q298,130 256,148 Q214,130 222,90 Z"
              fill="#334155" stroke="var(--logo-disc-highlight)" stroke-width="1.5" />
        <path d="M422,222 Q447,256 422,290 Q382,298 364,256 Q382,214 422,222 Z"
              fill="#334155" stroke="var(--logo-disc-highlight)" stroke-width="1.5" />
        <path d="M290,422 Q256,447 222,422 Q214,382 256,364 Q298,382 290,422 Z"
              fill="#334155" stroke="var(--logo-disc-highlight)" stroke-width="1.5" />
        <path d="M90,290 Q65,256 90,222 Q130,214 148,256 Q130,298 90,290 Z"
              fill="#334155" stroke="var(--logo-disc-highlight)" stroke-width="1.5" />

        <!-- Ribs -->
        <line x1="256" y1="70" x2="256" y2="160" stroke="var(--logo-disc-highlight)" stroke-width="4" opacity="0.5" />
        <line x1="442" y1="256" x2="352" y2="256" stroke="var(--logo-disc-highlight)" stroke-width="4" opacity="0.5" />
        <line x1="256" y1="442" x2="256" y2="352" stroke="var(--logo-disc-highlight)" stroke-width="4" opacity="0.5" />
        <line x1="70" y1="256" x2="160" y2="256" stroke="var(--logo-disc-highlight)" stroke-width="4" opacity="0.5" />

        <!-- Hub -->
        <circle cx="256" cy="256" r="62" fill="#1E293B" stroke="var(--logo-disc-highlight)" stroke-width="2.5" />
        <!-- 6 spokes -->
        <line x1="256" y1="198" x2="256" y2="232" stroke="var(--logo-disc-highlight)" stroke-width="5" stroke-linecap="round" opacity="0.55" />
        <line x1="206" y1="227" x2="232" y2="244" stroke="var(--logo-disc-highlight)" stroke-width="5" stroke-linecap="round" opacity="0.55" />
        <line x1="206" y1="285" x2="232" y2="268" stroke="var(--logo-disc-highlight)" stroke-width="5" stroke-linecap="round" opacity="0.55" />
        <line x1="256" y1="314" x2="256" y2="280" stroke="var(--logo-disc-highlight)" stroke-width="5" stroke-linecap="round" opacity="0.55" />
        <line x1="306" y1="285" x2="280" y2="268" stroke="var(--logo-disc-highlight)" stroke-width="5" stroke-linecap="round" opacity="0.55" />
        <line x1="306" y1="227" x2="280" y2="244" stroke="var(--logo-disc-highlight)" stroke-width="5" stroke-linecap="round" opacity="0.55" />
        <circle cx="256" cy="256" r="26" fill="var(--logo-disc-highlight)" opacity="0.5" />
      </g>

      <!-- Window shadows -->
      <path d="M224,92 Q256,70 288,92" fill="none" stroke="black" stroke-width="1.5" opacity="0.12" />
      <path d="M420,224 Q442,256 420,288" fill="none" stroke="black" stroke-width="1.5" opacity="0.12" />
      <path d="M288,420 Q256,442 224,420" fill="none" stroke="black" stroke-width="1.5" opacity="0.12" />
      <path d="M92,288 Q70,256 92,224" fill="none" stroke="black" stroke-width="1.5" opacity="0.12" />

      <!-- Metallic sheen -->
      <ellipse cx="210" cy="210" rx="80" ry="28" fill="white" opacity="0.04" transform="rotate(-35,210,210)" />
      <!-- Rim highlight -->
      <circle cx="256" cy="256" r="199" fill="none" stroke="white" stroke-width="1" opacity="0.06" />
      <!-- Hub highlight -->
      <ellipse cx="248" cy="250" rx="14" ry="8" fill="white" opacity="0.05" transform="rotate(-25,248,250)" />

      <!-- Centre pin (static) -->
      <circle cx="256" cy="256" r="9" fill="#1E293B" stroke="var(--logo-disc-highlight)" stroke-width="1.5" />
      <circle cx="254" cy="254" r="2.5" fill="white" opacity="0.08" />
      <circle cx="256" cy="256" r="3" fill="var(--logo-disc-highlight)" opacity="0.5" />
    </g>

  </g>

  <!-- ═══════════ MODE SWITCH ═══════════ -->
  <script type="text/javascript">
    // <![CDATA[
    (function () {
      try {
        var svg = document.querySelector('svg');
        var params = new URLSearchParams(window.location.search);
        var mode = params.get('mode');
        if (mode && mode !== 'light') {
          if (mode.indexOf('-dark') > 0 && mode.indexOf('cb-') === 0) {
            svg.classList.add('dark');
            svg.classList.add(mode.replace('-dark', ''));
          } else {
            svg.classList.add(mode);
          }
        }
      } catch (e) {}
    })();
    // ]]>
  </script>
</svg>
