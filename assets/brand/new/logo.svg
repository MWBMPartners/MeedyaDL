<!--
  MeedyaDL Logo (Icon) - Audio/Video transitioning
  ==================================================

  A media downloader icon featuring a download arrow landing into
  two alternating media symbols that crossfade on a loop:
    - Vinyl disc (audio) with rotating grooves
    - Film projector (video) with flickering beam

  The transition communicates "all media types" without cluttering
  the icon with multiple simultaneous elements.

  Customisation via CSS custom properties (same system as logotype.svg):
    logo-primary         Arrow gradient start     (default: #475569)
    logo-secondary       Arrow gradient end        (default: #94A3B8)
    logo-accent          Base tray / highlights    (default: #64748B)
    logo-disc            Disc/projector body       (default: #334155)
    logo-disc-highlight  Grooves / projector detail (default: #475569)
    logo-beam            Projector beam colour     (default: #94A3B8)
    logo-shadow          Drop shadow colour        (default: rgba(0,0,0,0.3))
    logo-animation-speed Base animation duration   (default: 2.5s)
    logo-transition-speed Crossfade cycle duration (default: 8s)

  Colour modes: ?mode=light|dark|cb-deutan|cb-protan|cb-tritan
                |cb-deutan-dark|cb-protan-dark|cb-tritan-dark
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="MeedyaDL logo">
  <title>MeedyaDL Logo</title>
  <desc>A download arrow with alternating vinyl disc and film projector symbols</desc>

  <defs>
    <style>
      /* ── Custom Properties ───────────────────────────────── */
      :root {
        --logo-primary: #475569;
        --logo-secondary: #94A3B8;
        --logo-accent: #64748B;
        --logo-disc: #334155;
        --logo-disc-highlight: #475569;
        --logo-beam: #94A3B8;
        --logo-shadow: rgba(0, 0, 0, 0.3);
        --logo-animation-speed: 2.5s;
        --logo-transition-speed: 8s;
      }

      /* ── Dark Mode ───────────────────────────────────────── */
      @media (prefers-color-scheme: dark) {
        :root {
          --logo-primary: #CBD5E1;
          --logo-secondary: #F1F5F9;
          --logo-accent: #94A3B8;
          --logo-disc: #1E293B;
          --logo-disc-highlight: #334155;
          --logo-beam: #CBD5E1;
          --logo-shadow: rgba(0, 0, 0, 0.6);
        }
      }
      .dark {
        --logo-primary: #CBD5E1;
        --logo-secondary: #F1F5F9;
        --logo-accent: #94A3B8;
        --logo-disc: #1E293B;
        --logo-disc-highlight: #334155;
        --logo-beam: #CBD5E1;
        --logo-shadow: rgba(0, 0, 0, 0.6);
      }

      /* ── Colour-blind (light) ────────────────────────────── */
      .cb-deutan {
        --logo-primary: #648FFF; --logo-secondary: #FFB000;
        --logo-accent: #785EF0; --logo-disc: #2D3748;
        --logo-disc-highlight: #4A5568; --logo-beam: #FFB000;
      }
      .cb-protan {
        --logo-primary: #648FFF; --logo-secondary: #DC267F;
        --logo-accent: #FFB000; --logo-disc: #2D3748;
        --logo-disc-highlight: #4A5568; --logo-beam: #DC267F;
      }
      .cb-tritan {
        --logo-primary: #D55E00; --logo-secondary: #CC79A7;
        --logo-accent: #D55E00; --logo-disc: #2D3748;
        --logo-disc-highlight: #4A5568; --logo-beam: #CC79A7;
      }

      /* ── Colour-blind (dark) ─────────────────────────────── */
      .dark.cb-deutan, .cb-deutan-dark {
        --logo-primary: #85AAFF; --logo-secondary: #FFC940;
        --logo-accent: #9B85FF; --logo-disc: #1A202C;
        --logo-beam: #FFC940; --logo-shadow: rgba(0,0,0,0.6);
      }
      .dark.cb-protan, .cb-protan-dark {
        --logo-primary: #85AAFF; --logo-secondary: #FF5CA1;
        --logo-accent: #FFC940; --logo-disc: #1A202C;
        --logo-beam: #FF5CA1; --logo-shadow: rgba(0,0,0,0.6);
      }
      .dark.cb-tritan, .cb-tritan-dark {
        --logo-primary: #FF8533; --logo-secondary: #E09DBF;
        --logo-accent: #FF8533; --logo-disc: #1A202C;
        --logo-beam: #E09DBF; --logo-shadow: rgba(0,0,0,0.6);
      }

      /* ── Crossfade transition ────────────────────────────── */
      /* Each symbol is visible for ~40% of the cycle, with a
         ~10% crossfade overlap at each transition point. */
      @keyframes show-vinyl {
        0%, 40%  { opacity: 1; }
        50%, 90% { opacity: 0; }
        100%     { opacity: 1; }
      }
      @keyframes show-projector {
        0%, 40%  { opacity: 0; }
        50%, 90% { opacity: 1; }
        100%     { opacity: 0; }
      }

      #vinyl-group {
        animation: show-vinyl var(--logo-transition-speed) ease-in-out infinite;
      }
      #projector-group {
        animation: show-projector var(--logo-transition-speed) ease-in-out infinite;
      }

      /* ── Vinyl disc rotation ─────────────────────────────── */
      @keyframes disc-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      #disc-grooves {
        animation: disc-spin calc(var(--logo-animation-speed) * 5) linear infinite;
        transform-origin: 256px 290px;
      }

      /* ── Arrow bounce ────────────────────────────────────── */
      @keyframes arrow-bounce {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(10px); }
      }
      #download-arrow-group {
        animation: arrow-bounce var(--logo-animation-speed) ease-in-out infinite;
      }

      /* ── Projector beam flicker ──────────────────────────── */
      @keyframes beam-flicker {
        0%, 100% { opacity: 0.12; }
        10%      { opacity: 0.18; }
        20%      { opacity: 0.10; }
        35%      { opacity: 0.20; }
        50%      { opacity: 0.08; }
        65%      { opacity: 0.22; }
        75%      { opacity: 0.14; }
        90%      { opacity: 0.19; }
      }
      #projector-beam {
        animation: beam-flicker calc(var(--logo-animation-speed) * 0.4) steps(1) infinite;
      }

      /* ── Projector reel spin ─────────────────────────────── */
      @keyframes reel-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      #reel-spokes-top {
        animation: reel-spin calc(var(--logo-animation-speed) * 2) linear infinite;
        transform-origin: 230px 230px;
      }
      #reel-spokes-bottom {
        animation: reel-spin calc(var(--logo-animation-speed) * 2.5) linear infinite reverse;
        transform-origin: 290px 330px;
      }

      /* ── Reduced Motion ──────────────────────────────────── */
      @media (prefers-reduced-motion: reduce) {
        #vinyl-group, #projector-group {
          animation: none !important;
        }
        /* Show vinyl by default when animations disabled */
        #vinyl-group { opacity: 1 !important; }
        #projector-group { opacity: 0 !important; }
        #disc-grooves, #download-arrow-group,
        #projector-beam, #reel-spokes-top, #reel-spokes-bottom {
          animation: none !important;
        }
      }
    </style>

    <!-- Arrow gradient -->
    <linearGradient id="grad-arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="var(--logo-primary)" />
      <stop offset="100%" stop-color="var(--logo-secondary)" />
    </linearGradient>

    <!-- Base tray gradient -->
    <linearGradient id="grad-tray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="var(--logo-accent)" />
      <stop offset="100%" stop-color="var(--logo-secondary)" />
    </linearGradient>

    <!-- Projector beam cone gradient (fades out) -->
    <linearGradient id="grad-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="var(--logo-beam)" stop-opacity="0.25" />
      <stop offset="100%" stop-color="var(--logo-beam)" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="arrow-shadow" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6"
                    flood-color="var(--logo-shadow)" flood-opacity="0.5" />
    </filter>
    <filter id="disc-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="var(--logo-shadow)" flood-opacity="0.35" />
    </filter>
    <filter id="tray-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4"
                    flood-color="var(--logo-shadow)" flood-opacity="0.3" />
    </filter>

    <!-- Disc groove clip -->
    <clipPath id="disc-ring-clip">
      <path d="M256,160 a130,130 0 1,0 0.001,0 Z M256,250 a40,40 0 1,1 -0.001,0 Z"
            clip-rule="evenodd" />
    </clipPath>
  </defs>

  <!-- ═══════════ MEDIA SYMBOL: VINYL DISC (audio) ═══════════ -->
  <g id="vinyl-group" filter="url(#disc-shadow)">
    <!-- Outer disc body -->
    <circle id="disc-body" cx="256" cy="290" r="130"
            fill="var(--logo-disc)" />

    <!-- Grooves (rotating) -->
    <g id="disc-grooves" clip-path="url(#disc-ring-clip)">
      <circle cx="256" cy="290" r="115" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="1" opacity="0.4" />
      <circle cx="256" cy="290" r="100" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.3" />
      <circle cx="256" cy="290" r="85" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="1" opacity="0.4" />
      <circle cx="256" cy="290" r="70" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.3" />
      <circle cx="256" cy="290" r="55" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="1" opacity="0.35" />
    </g>

    <!-- Label area -->
    <circle id="disc-label" cx="256" cy="290" r="40"
            fill="var(--logo-disc-highlight)" opacity="0.6" />

    <!-- Centre hole -->
    <circle id="disc-hole" cx="256" cy="290" r="10"
            fill="var(--logo-disc)" stroke="var(--logo-disc-highlight)"
            stroke-width="1.5" opacity="0.8" />

    <!-- Highlight -->
    <ellipse id="disc-reflection" cx="220" cy="250" rx="50" ry="18"
             fill="white" opacity="0.04" transform="rotate(-25,220,250)" />
  </g>

  <!-- ═══════════ MEDIA SYMBOL: FILM PROJECTOR (video) ═══════════ -->
  <g id="projector-group" opacity="0" filter="url(#disc-shadow)">

    <!-- Projector body (rounded rectangle) -->
    <rect id="projector-body" x="195" y="275" width="122" height="90"
          rx="12" fill="var(--logo-disc)" />

    <!-- Lens barrel -->
    <rect id="projector-lens-barrel" x="317" y="300" width="40" height="30"
          rx="6" fill="var(--logo-disc-highlight)" />
    <!-- Lens glass -->
    <circle id="projector-lens" cx="362" cy="315" r="12"
            fill="var(--logo-disc)" stroke="var(--logo-accent)"
            stroke-width="2.5" />
    <circle cx="362" cy="315" r="6"
            fill="var(--logo-accent)" opacity="0.5" />

    <!-- Top reel (larger) -->
    <circle id="reel-top" cx="230" cy="260" r="36"
            fill="var(--logo-disc)" stroke="var(--logo-disc-highlight)"
            stroke-width="2" />
    <circle cx="230" cy="260" r="8"
            fill="var(--logo-disc-highlight)" opacity="0.6" />
    <!-- Reel spokes (rotating) -->
    <g id="reel-spokes-top">
      <line x1="230" y1="230" x2="230" y2="250" stroke="var(--logo-disc-highlight)"
            stroke-width="2" opacity="0.5" />
      <line x1="206" y1="247" x2="218" y2="255" stroke="var(--logo-disc-highlight)"
            stroke-width="2" opacity="0.5" />
      <line x1="254" y1="247" x2="242" y2="255" stroke="var(--logo-disc-highlight)"
            stroke-width="2" opacity="0.5" />
      <line x1="212" y1="278" x2="222" y2="268" stroke="var(--logo-disc-highlight)"
            stroke-width="2" opacity="0.5" />
      <line x1="248" y1="278" x2="238" y2="268" stroke="var(--logo-disc-highlight)"
            stroke-width="2" opacity="0.5" />
    </g>

    <!-- Bottom reel (smaller) -->
    <circle id="reel-bottom" cx="290" cy="330" r="26"
            fill="var(--logo-disc)" stroke="var(--logo-disc-highlight)"
            stroke-width="2" />
    <circle cx="290" cy="330" r="6"
            fill="var(--logo-disc-highlight)" opacity="0.6" />
    <!-- Reel spokes (rotating, reverse) -->
    <g id="reel-spokes-bottom">
      <line x1="290" y1="308" x2="290" y2="320" stroke="var(--logo-disc-highlight)"
            stroke-width="1.5" opacity="0.5" />
      <line x1="272" y1="320" x2="280" y2="326" stroke="var(--logo-disc-highlight)"
            stroke-width="1.5" opacity="0.5" />
      <line x1="308" y1="320" x2="300" y2="326" stroke="var(--logo-disc-highlight)"
            stroke-width="1.5" opacity="0.5" />
      <line x1="276" y1="344" x2="282" y2="336" stroke="var(--logo-disc-highlight)"
            stroke-width="1.5" opacity="0.5" />
      <line x1="304" y1="344" x2="298" y2="336" stroke="var(--logo-disc-highlight)"
            stroke-width="1.5" opacity="0.5" />
    </g>

    <!-- Film strip connecting reels -->
    <path id="film-strip"
          d="M230,296 Q210,310 210,330 Q210,356 230,356 L260,356 Q280,356 290,356"
          fill="none" stroke="var(--logo-disc-highlight)" stroke-width="3"
          stroke-dasharray="8 4" opacity="0.4" />

    <!-- Projector beam (flickering light cone) -->
    <path id="projector-beam"
          d="M374,305 L460,260 L460,370 Z"
          fill="url(#grad-beam)" opacity="0.15" />

    <!-- Body detail lines -->
    <line x1="205" y1="345" x2="307" y2="345"
          stroke="var(--logo-disc-highlight)" stroke-width="1" opacity="0.3" />
    <line x1="205" y1="352" x2="307" y2="352"
          stroke="var(--logo-disc-highlight)" stroke-width="1" opacity="0.2" />
  </g>

  <!-- ═══════════ BASE TRAY ═══════════ -->
  <g id="download-base" filter="url(#tray-shadow)">
    <path id="base-tray"
          d="M145,400 L145,425 Q145,445 165,445 L347,445 Q367,445 367,425 L367,400"
          fill="none" stroke="url(#grad-tray)" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ═══════════ DOWNLOAD ARROW ═══════════ -->
  <g id="download-arrow-group" filter="url(#arrow-shadow)">
    <rect id="arrow-shaft" x="230" y="50" width="52" height="150"
          rx="10" fill="url(#grad-arrow)" />
    <path id="arrow-head"
          d="M190,195 L256,268 L322,195"
          fill="none" stroke="url(#grad-arrow)" stroke-width="52"
          stroke-linecap="round" stroke-linejoin="round" />
    <rect id="arrow-shine" x="244" y="62" width="10" height="80"
          rx="5" fill="white" opacity="0.2" />
  </g>

  <!-- ═══════════ MODE SWITCH ═══════════ -->
  <script type="text/javascript">
    // <![CDATA[
    (function () {
      try {
        var svg = document.querySelector('svg');
        var params = new URLSearchParams(window.location.search);
        var mode = params.get('mode');
        if (mode && mode !== 'light') {
          if (mode.indexOf('-dark') > 0 && mode.indexOf('cb-') === 0) {
            svg.classList.add('dark');
            svg.classList.add(mode.replace('-dark', ''));
          } else {
            svg.classList.add(mode);
          }
        }
      } catch (e) { /* no window / URLSearchParams */ }
    })();
    // ]]>
  </script>
</svg>
