<!--
  MeedyaDL Logo - Audio/Video crossfade with subtle download indicator
  =====================================================================

  Two media symbols crossfade on an 8s cycle (configurable):
    - Vinyl disc (audio): full-size, rotating grooves, realistic detail
    - Film projector (video): full-size, dual reels, lens, flickering beam

  A subtle download arrow sits behind the media symbols as a watermark,
  reinforcing the "download" concept without competing for attention.

  Customisation (CSS custom properties):
    logo-primary, logo-secondary, logo-accent, logo-disc,
    logo-disc-highlight, logo-beam, logo-shadow,
    logo-animation-speed, logo-transition-speed

  Modes: ?mode=light|dark|cb-deutan|cb-protan|cb-tritan
         |cb-deutan-dark|cb-protan-dark|cb-tritan-dark
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="MeedyaDL logo">
  <title>MeedyaDL Logo</title>
  <desc>Crossfading vinyl disc and film projector with download arrow watermark</desc>

  <defs>
    <style>
      :root {
        --logo-primary: #475569;
        --logo-secondary: #94A3B8;
        --logo-accent: #64748B;
        --logo-disc: #334155;
        --logo-disc-highlight: #475569;
        --logo-beam: #94A3B8;
        --logo-shadow: rgba(0, 0, 0, 0.3);
        --logo-animation-speed: 2.5s;
        --logo-transition-speed: 8s;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --logo-primary: #CBD5E1; --logo-secondary: #F1F5F9;
          --logo-accent: #94A3B8; --logo-disc: #1E293B;
          --logo-disc-highlight: #334155; --logo-beam: #CBD5E1;
          --logo-shadow: rgba(0, 0, 0, 0.6);
        }
      }
      .dark {
        --logo-primary: #CBD5E1; --logo-secondary: #F1F5F9;
        --logo-accent: #94A3B8; --logo-disc: #1E293B;
        --logo-disc-highlight: #334155; --logo-beam: #CBD5E1;
        --logo-shadow: rgba(0, 0, 0, 0.6);
      }

      .cb-deutan {
        --logo-primary: #648FFF; --logo-secondary: #FFB000;
        --logo-accent: #785EF0; --logo-disc: #2D3748;
        --logo-disc-highlight: #4A5568; --logo-beam: #FFB000;
      }
      .cb-protan {
        --logo-primary: #648FFF; --logo-secondary: #DC267F;
        --logo-accent: #FFB000; --logo-disc: #2D3748;
        --logo-disc-highlight: #4A5568; --logo-beam: #DC267F;
      }
      .cb-tritan {
        --logo-primary: #D55E00; --logo-secondary: #CC79A7;
        --logo-accent: #D55E00; --logo-disc: #2D3748;
        --logo-disc-highlight: #4A5568; --logo-beam: #CC79A7;
      }
      .dark.cb-deutan, .cb-deutan-dark {
        --logo-primary: #85AAFF; --logo-secondary: #FFC940;
        --logo-accent: #9B85FF; --logo-disc: #1A202C;
        --logo-beam: #FFC940; --logo-shadow: rgba(0,0,0,0.6);
      }
      .dark.cb-protan, .cb-protan-dark {
        --logo-primary: #85AAFF; --logo-secondary: #FF5CA1;
        --logo-accent: #FFC940; --logo-disc: #1A202C;
        --logo-beam: #FF5CA1; --logo-shadow: rgba(0,0,0,0.6);
      }
      .dark.cb-tritan, .cb-tritan-dark {
        --logo-primary: #FF8533; --logo-secondary: #E09DBF;
        --logo-accent: #FF8533; --logo-disc: #1A202C;
        --logo-beam: #E09DBF; --logo-shadow: rgba(0,0,0,0.6);
      }

      /* ── Crossfade ───────────────────────────────────────── */
      @keyframes show-vinyl {
        0%, 40%  { opacity: 1; }
        50%, 90% { opacity: 0; }
        100%     { opacity: 1; }
      }
      @keyframes show-projector {
        0%, 40%  { opacity: 0; }
        50%, 90% { opacity: 1; }
        100%     { opacity: 0; }
      }
      #vinyl-group {
        animation: show-vinyl var(--logo-transition-speed) ease-in-out infinite;
      }
      #projector-group {
        animation: show-projector var(--logo-transition-speed) ease-in-out infinite;
      }

      /* ── Vinyl spin ──────────────────────────────────────── */
      @keyframes disc-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      #disc-grooves {
        animation: disc-spin calc(var(--logo-animation-speed) * 5) linear infinite;
        transform-origin: 256px 256px;
      }

      /* ── Projector reels ─────────────────────────────────── */
      @keyframes reel-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      #reel-spokes-left {
        animation: reel-spin calc(var(--logo-animation-speed) * 1.8) linear infinite;
        transform-origin: 175px 175px;
      }
      #reel-spokes-right {
        animation: reel-spin calc(var(--logo-animation-speed) * 2.2) linear infinite reverse;
        transform-origin: 337px 175px;
      }

      /* ── Beam flicker ────────────────────────────────────── */
      @keyframes beam-flicker {
        0%   { opacity: 0.10; }
        8%   { opacity: 0.18; }
        15%  { opacity: 0.06; }
        25%  { opacity: 0.20; }
        35%  { opacity: 0.12; }
        45%  { opacity: 0.22; }
        55%  { opacity: 0.08; }
        65%  { opacity: 0.19; }
        75%  { opacity: 0.14; }
        85%  { opacity: 0.21; }
        95%  { opacity: 0.10; }
        100% { opacity: 0.15; }
      }
      @keyframes beam-glow-pulse {
        0%, 100% { opacity: 0.06; }
        50%      { opacity: 0.12; }
      }
      #projector-beam {
        animation: beam-flicker calc(var(--logo-animation-speed) * 0.3) steps(1) infinite;
      }
      #beam-glow {
        animation: beam-glow-pulse calc(var(--logo-animation-speed) * 0.6) ease-in-out infinite;
      }

      /* ── Reduced motion ──────────────────────────────────── */
      @media (prefers-reduced-motion: reduce) {
        #vinyl-group { animation: none !important; opacity: 1 !important; }
        #projector-group { animation: none !important; opacity: 0 !important; }
        #disc-grooves, #reel-spokes-left, #reel-spokes-right,
        #projector-beam, #beam-glow {
          animation: none !important;
        }
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="grad-arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="var(--logo-primary)" />
      <stop offset="100%" stop-color="var(--logo-secondary)" />
    </linearGradient>
    <linearGradient id="grad-tray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="var(--logo-accent)" />
      <stop offset="100%" stop-color="var(--logo-secondary)" />
    </linearGradient>
    <radialGradient id="grad-beam" cx="0%" cy="50%" r="100%" fx="0%" fy="50%">
      <stop offset="0%"   stop-color="var(--logo-beam)" stop-opacity="0.35" />
      <stop offset="40%"  stop-color="var(--logo-beam)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="var(--logo-beam)" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad-lens-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="var(--logo-beam)" stop-opacity="0.4" />
      <stop offset="100%" stop-color="var(--logo-beam)" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="media-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8"
                    flood-color="var(--logo-shadow)" flood-opacity="0.4" />
    </filter>
    <filter id="tray-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4"
                    flood-color="var(--logo-shadow)" flood-opacity="0.3" />
    </filter>

    <!-- Disc groove clip (ring between outer and inner) -->
    <clipPath id="disc-ring-clip">
      <path d="M256,96 a160,160 0 1,0 0.001,0 Z M256,210 a46,46 0 1,1 -0.001,0 Z"
            clip-rule="evenodd" />
    </clipPath>
  </defs>

  <!-- ═══════════ LAYER 0: DOWNLOAD ARROW WATERMARK ═══════════ -->
  <!-- Sits behind everything as a subtle background indicator.
       Low opacity so the media symbols are the hero. -->
  <g id="download-watermark" opacity="0.08">
    <rect x="232" y="30" width="48" height="160" rx="10"
          fill="var(--logo-primary)" />
    <path d="M196,185 L256,250 L316,185"
          fill="none" stroke="var(--logo-primary)" stroke-width="48"
          stroke-linecap="round" stroke-linejoin="round" />
    <!-- Small down-tray at bottom of watermark -->
    <path d="M180,420 L180,445 Q180,460 196,460 L316,460 Q332,460 332,445 L332,420"
          fill="none" stroke="var(--logo-primary)" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ═══════════ LAYER 1a: VINYL DISC (audio) ═══════════ -->
  <g id="vinyl-group" filter="url(#media-shadow)">
    <!-- Outer disc -->
    <circle id="disc-body" cx="256" cy="256" r="160"
            fill="var(--logo-disc)" />

    <!-- Rotating grooves -->
    <g id="disc-grooves" clip-path="url(#disc-ring-clip)">
      <circle cx="256" cy="256" r="150" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.35" />
      <circle cx="256" cy="256" r="140" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.5" opacity="0.25" />
      <circle cx="256" cy="256" r="130" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.35" />
      <circle cx="256" cy="256" r="120" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.5" opacity="0.25" />
      <circle cx="256" cy="256" r="110" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.35" />
      <circle cx="256" cy="256" r="100" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.5" opacity="0.25" />
      <circle cx="256" cy="256" r="90" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.3" />
      <circle cx="256" cy="256" r="80" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.5" opacity="0.2" />
      <circle cx="256" cy="256" r="70" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.3" />
      <circle cx="256" cy="256" r="60" fill="none"
              stroke="var(--logo-disc-highlight)" stroke-width="0.5" opacity="0.2" />
      <!-- Light reflections across the surface -->
      <line x1="256" y1="96" x2="190" y2="416"
            stroke="white" stroke-width="40" opacity="0.02" />
      <line x1="280" y1="96" x2="340" y2="416"
            stroke="white" stroke-width="25" opacity="0.015" />
    </g>

    <!-- Label area (inner circle) -->
    <circle id="disc-label" cx="256" cy="256" r="46"
            fill="var(--logo-disc-highlight)" opacity="0.7" />
    <!-- Label detail -->
    <circle cx="256" cy="256" r="38"
            fill="none" stroke="var(--logo-disc)" stroke-width="0.5" opacity="0.4" />

    <!-- Centre spindle hole -->
    <circle id="disc-hole" cx="256" cy="256" r="8"
            fill="var(--logo-disc)" />
    <circle cx="256" cy="256" r="8"
            fill="none" stroke="var(--logo-disc-highlight)" stroke-width="1.5" opacity="0.5" />
    <!-- Spindle pin highlight -->
    <circle cx="256" cy="256" r="3"
            fill="var(--logo-disc-highlight)" opacity="0.3" />

    <!-- Surface reflection (realistic sheen) -->
    <ellipse id="disc-sheen" cx="215" cy="210" rx="70" ry="25"
             fill="white" opacity="0.035" transform="rotate(-30,215,210)" />
  </g>

  <!-- ═══════════ LAYER 1b: FILM PROJECTOR (video) ═══════════ -->
  <g id="projector-group" opacity="0" filter="url(#media-shadow)">

    <!-- ── Projector Body ──────────────────────────────────── -->
    <rect id="projector-body" x="125" y="265" width="200" height="110"
          rx="14" fill="var(--logo-disc)" />
    <!-- Body top edge detail -->
    <line x1="140" y1="275" x2="310" y2="275"
          stroke="var(--logo-disc-highlight)" stroke-width="1" opacity="0.3" />
    <!-- Ventilation slots -->
    <line x1="145" y1="350" x2="310" y2="350"
          stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.25" />
    <line x1="145" y1="356" x2="310" y2="356"
          stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.2" />
    <line x1="145" y1="362" x2="310" y2="362"
          stroke="var(--logo-disc-highlight)" stroke-width="0.8" opacity="0.15" />

    <!-- ── Left Reel (supply, larger) ──────────────────────── -->
    <circle id="reel-housing-left" cx="175" cy="175" r="72"
            fill="var(--logo-disc)" stroke="var(--logo-disc-highlight)"
            stroke-width="2.5" />
    <!-- Reel inner rings -->
    <circle cx="175" cy="175" r="55"
            fill="none" stroke="var(--logo-disc-highlight)"
            stroke-width="1" opacity="0.3" />
    <circle cx="175" cy="175" r="20"
            fill="var(--logo-disc-highlight)" opacity="0.4" />
    <circle cx="175" cy="175" r="8"
            fill="var(--logo-disc)" />
    <!-- Spokes (rotating) -->
    <g id="reel-spokes-left">
      <line x1="175" y1="110" x2="175" y2="155" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="119" y1="143" x2="155" y2="165" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="231" y1="143" x2="195" y2="165" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="119" y1="207" x2="155" y2="185" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="231" y1="207" x2="195" y2="185" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="175" y1="240" x2="175" y2="195" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
    </g>

    <!-- ── Right Reel (take-up, larger) ────────────────────── -->
    <circle id="reel-housing-right" cx="337" cy="175" r="72"
            fill="var(--logo-disc)" stroke="var(--logo-disc-highlight)"
            stroke-width="2.5" />
    <circle cx="337" cy="175" r="55"
            fill="none" stroke="var(--logo-disc-highlight)"
            stroke-width="1" opacity="0.3" />
    <circle cx="337" cy="175" r="20"
            fill="var(--logo-disc-highlight)" opacity="0.4" />
    <circle cx="337" cy="175" r="8"
            fill="var(--logo-disc)" />
    <!-- Spokes (rotating, reverse) -->
    <g id="reel-spokes-right">
      <line x1="337" y1="110" x2="337" y2="155" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="281" y1="143" x2="317" y2="165" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="393" y1="143" x2="357" y2="165" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="281" y1="207" x2="317" y2="185" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="393" y1="207" x2="357" y2="185" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
      <line x1="337" y1="240" x2="337" y2="195" stroke="var(--logo-disc-highlight)"
            stroke-width="3" opacity="0.4" stroke-linecap="round" />
    </g>

    <!-- ── Film gate (between reels, above body) ───────────── -->
    <rect x="225" y="220" width="62" height="45" rx="4"
          fill="var(--logo-disc)" stroke="var(--logo-disc-highlight)"
          stroke-width="1.5" />
    <!-- Film frame aperture -->
    <rect x="233" y="226" width="46" height="33" rx="2"
          fill="var(--logo-disc-highlight)" opacity="0.3" />

    <!-- ── Film path (threading between reels and gate) ────── -->
    <path d="M175,247 Q175,260 200,262 L225,262"
          fill="none" stroke="var(--logo-disc-highlight)" stroke-width="2" opacity="0.35" />
    <path d="M287,262 L312,262 Q337,260 337,247"
          fill="none" stroke="var(--logo-disc-highlight)" stroke-width="2" opacity="0.35" />

    <!-- ── Lens Assembly (front, right side) ───────────────── -->
    <rect id="lens-barrel" x="325" y="292" width="55" height="46"
          rx="8" fill="var(--logo-disc-highlight)" />
    <!-- Lens mount ring -->
    <circle id="lens-outer" cx="385" cy="315" r="22"
            fill="var(--logo-disc)" stroke="var(--logo-accent)"
            stroke-width="3" />
    <!-- Lens glass (concentric rings for realism) -->
    <circle cx="385" cy="315" r="16"
            fill="var(--logo-disc-highlight)" opacity="0.5" />
    <circle cx="385" cy="315" r="10"
            fill="var(--logo-accent)" opacity="0.4" />
    <circle cx="385" cy="315" r="5"
            fill="var(--logo-beam)" opacity="0.6" />
    <!-- Lens highlight -->
    <ellipse cx="380" cy="310" rx="6" ry="4"
             fill="white" opacity="0.15" transform="rotate(-20,380,310)" />

    <!-- ── Projector Beam (flickering light cone, right side) ─ -->
    <path id="projector-beam"
          d="M407,300 L500,230 L500,400 Z"
          fill="url(#grad-beam)" opacity="0.15" />
    <!-- Beam glow (softer, wider) -->
    <ellipse id="beam-glow" cx="460" cy="315" rx="50" ry="80"
             fill="url(#grad-lens-glow)" opacity="0.08" />

    <!-- ── Feet / Stand ────────────────────────────────────── -->
    <rect x="155" y="375" width="30" height="8" rx="3"
          fill="var(--logo-disc-highlight)" opacity="0.5" />
    <rect x="265" y="375" width="30" height="8" rx="3"
          fill="var(--logo-disc-highlight)" opacity="0.5" />
  </g>

  <!-- ═══════════ MODE SWITCH ═══════════ -->
  <script type="text/javascript">
    // <![CDATA[
    (function () {
      try {
        var svg = document.querySelector('svg');
        var params = new URLSearchParams(window.location.search);
        var mode = params.get('mode');
        if (mode && mode !== 'light') {
          if (mode.indexOf('-dark') > 0 && mode.indexOf('cb-') === 0) {
            svg.classList.add('dark');
            svg.classList.add(mode.replace('-dark', ''));
          } else {
            svg.classList.add(mode);
          }
        }
      } catch (e) {}
    })();
    // ]]>
  </script>
</svg>
