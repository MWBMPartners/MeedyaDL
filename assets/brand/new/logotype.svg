<!--
  MeedyaSuite Logotype — Text-only wordmark
  ==========================================

  Designed for use across the MeedyaSuite product family:
    - MeedyaDL      (Media Downloader)
    - MeedyaManager (Media Manager)
    - MeedyaDB      (Media Database)

  The "Meedya" prefix is the brand constant. The product suffix
  (id="product-suffix") is swappable per product.

  Font: Poppins Black (900) — a geometric sans-serif with rounded
  terminals that gives a modern, distinctive feel. The font is
  referenced via @font-face with a Google Fonts import for web use.
  For offline/print, convert text to outlines (paths) in a vector
  editor (Illustrator: Type > Create Outlines; Inkscape: Path >
  Object to Path).

  Customisation via CSS custom properties:
    - -\-logotype-primary:    Brand gradient start (default: #3B82F6)
    - -\-logotype-secondary:  Brand gradient end   (default: #8B5CF6)
    - -\-logotype-accent:     Suffix/highlight      (default: #06B6D4)
    - -\-logotype-text:       Fallback text colour   (default: #1E293B)
    - -\-logotype-animation-speed: Shimmer duration  (default: 4s)
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 680 120" width="680" height="120"
     role="img" aria-label="MeedyaDL logotype">
  <title>MeedyaDL Logotype</title>
  <desc>MeedyaSuite horizontal wordmark — text only</desc>

  <defs>
    <style>
      /* ── Font Import ─────────────────────────────────────── */
      /* Poppins Black (900) + Bold (700) from Google Fonts.
         For environments without network access, install the
         Poppins font family locally or convert to outlines. */
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&amp;display=swap');

      /* ── Custom Properties ───────────────────────────────── */
      :root {
        --logotype-primary: #3B82F6;
        --logotype-secondary: #8B5CF6;
        --logotype-accent: #06B6D4;
        --logotype-text: #1E293B;
        --logotype-animation-speed: 4s;
      }

      /* ── Gradient Stops ──────────────────────────────────── */
      #logotype-grad-brand stop:first-child {
        stop-color: var(--logotype-primary);
      }
      #logotype-grad-brand stop:last-child {
        stop-color: var(--logotype-secondary);
      }

      #logotype-grad-suffix stop:first-child {
        stop-color: var(--logotype-accent);
      }
      #logotype-grad-suffix stop:last-child {
        stop-color: var(--logotype-primary);
      }

      /* ── Typography ──────────────────────────────────────── */
      #brand-prefix {
        font-family: 'Poppins', 'Montserrat', 'Nunito Sans', 'SF Pro Rounded', system-ui, sans-serif;
        font-weight: 900;
        font-size: 84px;
        letter-spacing: -2px;
        fill: url(#logotype-grad-brand);
      }

      #product-suffix {
        font-family: 'Poppins', 'Montserrat', 'Nunito Sans', 'SF Pro Rounded', system-ui, sans-serif;
        font-weight: 700;
        font-size: 84px;
        letter-spacing: -1px;
        fill: url(#logotype-grad-suffix);
      }

      /* ── Decorative Accent Bar ───────────────────────────── */
      #accent-bar {
        opacity: 0.5;
      }

      /* ── Dot Separator ───────────────────────────────────── */
      #brand-dot {
        fill: var(--logotype-accent);
        opacity: 0.8;
      }

      /* ── Animation: Gradient Shimmer ─────────────────────── */
      @keyframes logotype-shimmer {
        0%   { stop-color: var(--logotype-primary); }
        33%  { stop-color: var(--logotype-secondary); }
        66%  { stop-color: var(--logotype-accent); }
        100% { stop-color: var(--logotype-primary); }
      }

      @keyframes accent-pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.65; }
      }

      @keyframes dot-breathe {
        0%, 100% { r: 5; opacity: 0.7; }
        50%      { r: 6; opacity: 1; }
      }

      #logotype-grad-brand-anim stop:nth-child(1) {
        animation: logotype-shimmer var(--logotype-animation-speed) ease-in-out infinite;
      }
      #logotype-grad-brand-anim stop:nth-child(2) {
        animation: logotype-shimmer var(--logotype-animation-speed) ease-in-out infinite;
        animation-delay: calc(var(--logotype-animation-speed) * 0.33);
      }
      #logotype-grad-brand-anim stop:nth-child(3) {
        animation: logotype-shimmer var(--logotype-animation-speed) ease-in-out infinite;
        animation-delay: calc(var(--logotype-animation-speed) * 0.66);
      }

      #accent-bar {
        animation: accent-pulse calc(var(--logotype-animation-speed) * 0.75) ease-in-out infinite;
      }

      #brand-dot {
        animation: dot-breathe calc(var(--logotype-animation-speed) * 0.5) ease-in-out infinite;
      }

      /* ── Reduced Motion ──────────────────────────────────── */
      @media (prefers-reduced-motion: reduce) {
        #logotype-grad-brand-anim stop,
        #accent-bar,
        #brand-dot {
          animation: none !important;
        }
      }
    </style>

    <!-- Static gradient (fallback / no-animation contexts) -->
    <linearGradient id="logotype-grad-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" />
      <stop offset="100%" />
    </linearGradient>

    <!-- Animated gradient for the brand prefix -->
    <linearGradient id="logotype-grad-brand-anim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3B82F6" />
      <stop offset="50%"  stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Gradient for the product suffix -->
    <linearGradient id="logotype-grad-suffix" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" />
      <stop offset="100%" />
    </linearGradient>

    <!-- Gradient for the accent bar -->
    <linearGradient id="logotype-grad-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="var(--logotype-accent)" stop-opacity="0" />
      <stop offset="20%"  stop-color="var(--logotype-accent)" stop-opacity="0.6" />
      <stop offset="80%"  stop-color="var(--logotype-primary)" stop-opacity="0.6" />
      <stop offset="100%" stop-color="var(--logotype-primary)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ════════════════ WORDMARK ════════════════ -->
  <g id="wordmark-group">

    <!-- Brand prefix: "Meedya" — constant across all MeedyaSuite products -->
    <text id="brand-prefix"
          x="0" y="86"
          fill="url(#logotype-grad-brand-anim)">Meedya</text>

    <!-- Decorative dot separator between brand and product name.
         Visually connects the two parts while keeping them distinct.
         Positioned dynamically — adjust cx if suffix length changes. -->
    <circle id="brand-dot" cx="410" cy="74" r="5" />

    <!-- Product suffix: swap this text per product.
           MeedyaDL       → "DL"
           MeedyaManager  → "Manager"  (increase viewBox width to ~920)
           MeedyaDB       → "DB"
         The suffix uses a lighter weight and accent gradient to
         visually subordinate it to the brand prefix. -->
    <text id="product-suffix"
          x="425" y="86"
          fill="url(#logotype-grad-suffix)">DL</text>

    <!-- Accent bar — subtle underline spanning the full wordmark -->
    <line id="accent-bar"
          x1="4" y1="102" x2="500" y2="102"
          stroke="url(#logotype-grad-bar)"
          stroke-width="2.5"
          stroke-linecap="round" />
  </g>
</svg>
