<!--
  MeedyaDL Document Icon : "levels" play-triangle (whitespace-cropped, tight viewBox).
  STATIC. One file, every
  colour variant; scales to fill its container; all switches/animation intact.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="92 70 328 392" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mdl-title mdl-desc">
  <title id="mdl-title">MeedyaDL Document Icon</title>
  <desc id="mdl-desc">Downward play triangle with media equalizer levels on a save bar; light, dark and colour-blind-safe palettes in one file.</desc>
  <defs id="mdl-defs">
    <style id="mdl-theme">
      /* ==================================================================
         MeedyaDL : MODE / THEME SYSTEM (one file, every variant). Switches
         identical to MeedyaDL: --logo-primary / --logo-secondary / --logo-shadow
         (legacy --logo-vinyl / --logo-disc / --logo-disc-highlight as fallbacks);
         ?mode=dark / #dark; class="dark" or cb-deutan|cb-protan|cb-tritan (+dark);
         setProperty; html.theme-dark / html.theme-light when inlined.
         Self-sufficient: Graphite default, auto OS light/dark. CVD opt-in.
         ================================================================== */
      svg{ --logo-primary:#2B323A; --logo-secondary:#5E6770; --logo-shadow:rgba(16,20,26,.45); }
      svg.dark{ --logo-primary:#5E6770; --logo-secondary:#A7AEB6; --logo-shadow:rgba(0,0,0,.7); }
      svg.cb-deutan{ --logo-primary:#648FFF; --logo-secondary:#FFB000; }
      svg.cb-protan{ --logo-primary:#648FFF; --logo-secondary:#DC267F; }
      svg.cb-tritan{ --logo-primary:#D55E00; --logo-secondary:#CC79A7; }
      svg.cb-deutan.dark, svg.cb-deutan-dark{ --logo-primary:#85AAFF; --logo-secondary:#FFC940; --logo-shadow:rgba(0,0,0,.7); }
      svg.cb-protan.dark, svg.cb-protan-dark{ --logo-primary:#85AAFF; --logo-secondary:#FF5CA1; --logo-shadow:rgba(0,0,0,.7); }
      svg.cb-tritan.dark, svg.cb-tritan-dark{ --logo-primary:#FF8533; --logo-secondary:#E09DBF; --logo-shadow:rgba(0,0,0,.7); }
      html.theme-dark svg:not(.cb-deutan):not(.cb-protan):not(.cb-tritan){ --logo-primary:#5E6770; --logo-secondary:#A7AEB6; --logo-shadow:rgba(0,0,0,.7); }
      html.theme-dark svg.cb-deutan{ --logo-primary:#85AAFF; --logo-secondary:#FFC940; --logo-shadow:rgba(0,0,0,.7); }
      html.theme-dark svg.cb-protan{ --logo-primary:#85AAFF; --logo-secondary:#FF5CA1; --logo-shadow:rgba(0,0,0,.7); }
      html.theme-dark svg.cb-tritan{ --logo-primary:#FF8533; --logo-secondary:#E09DBF; --logo-shadow:rgba(0,0,0,.7); }
      html.theme-light svg:not(.cb-deutan):not(.cb-protan):not(.cb-tritan){ --logo-primary:#2B323A; --logo-secondary:#5E6770; --logo-shadow:rgba(16,20,26,.45); }
      html.theme-light svg.cb-deutan{ --logo-primary:#648FFF; --logo-secondary:#FFB000; }
      html.theme-light svg.cb-protan{ --logo-primary:#648FFF; --logo-secondary:#DC267F; }
      html.theme-light svg.cb-tritan{ --logo-primary:#D55E00; --logo-secondary:#CC79A7; }
      @media (prefers-color-scheme: dark){
        svg:root:not(.cb-deutan):not(.cb-protan):not(.cb-tritan):not(.dark){ --logo-primary:#5E6770; --logo-secondary:#A7AEB6; --logo-shadow:rgba(0,0,0,.7); }
        svg:root.cb-deutan{ --logo-primary:#85AAFF; --logo-secondary:#FFC940; --logo-shadow:rgba(0,0,0,.7); }
        svg:root.cb-protan{ --logo-primary:#85AAFF; --logo-secondary:#FF5CA1; --logo-shadow:rgba(0,0,0,.7); }
        svg:root.cb-tritan{ --logo-primary:#FF8533; --logo-secondary:#E09DBF; --logo-shadow:rgba(0,0,0,.7); }
        :root:not(.theme-dark):not(.theme-light) svg:not(.cb-deutan):not(.cb-protan):not(.cb-tritan):not(.dark){ --logo-primary:#5E6770; --logo-secondary:#A7AEB6; --logo-shadow:rgba(0,0,0,.7); }
        :root:not(.theme-dark):not(.theme-light) svg.cb-deutan{ --logo-primary:#85AAFF; --logo-secondary:#FFC940; --logo-shadow:rgba(0,0,0,.7); }
        :root:not(.theme-dark):not(.theme-light) svg.cb-protan{ --logo-primary:#85AAFF; --logo-secondary:#FF5CA1; --logo-shadow:rgba(0,0,0,.7); }
        :root:not(.theme-dark):not(.theme-light) svg.cb-tritan{ --logo-primary:#FF8533; --logo-secondary:#E09DBF; --logo-shadow:rgba(0,0,0,.7); }
      }
    </style>
    <linearGradient id="mdl-grad-brand" gradientUnits="userSpaceOnUse" x1="120" y1="100" x2="392" y2="420">
      <stop id="mdl-grad-brand-a" offset="0" stop-color="#5E6770" style="stop-color:var(--logo-secondary, var(--logo-disc-highlight, #5E6770))"/>
      <stop id="mdl-grad-brand-b" offset="1" stop-color="#2B323A" style="stop-color:var(--logo-primary, var(--logo-vinyl, var(--logo-disc, #2B323A)))"/>
    </linearGradient>
    <linearGradient id="mdl-grad-sheen" gradientUnits="userSpaceOnUse" x1="256" y1="86" x2="256" y2="430">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/><stop offset="0.16" stop-color="#ffffff" stop-opacity="0.34"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mdl-mask-levels">
      <rect x="80" y="80" width="352" height="352" fill="#ffffff"/>
      <rect id="lvl-1" x="197" y="182" width="118" height="18" rx="9" fill="#000000"/>
      <rect id="lvl-2" x="210" y="220" width="92" height="18" rx="9" fill="#000000"/>
      <rect id="lvl-3" x="229" y="258" width="54" height="18" rx="9" fill="#000000"/>
    </mask>
    <filter id="mdl-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow id="mdl-shadow-drop" dx="0" dy="9" stdDeviation="13" flood-color="#26303a" style="flood-color:var(--logo-shadow, rgba(16,20,26,.45))" flood-opacity="1"/>
    </filter>
  </defs>
  <g id="layer-glyph" inkscape:groupmode="layer" inkscape:label="Glyph" filter="url(#mdl-shadow)">
    <g id="glyph-body" mask="url(#mdl-mask-levels)"><path id="shape-triangle" d="M 156,98 L 356,98 Q 392,98 373.79,129.06 L 264.09,316.2 Q 256,330 247.91,316.2 L 138.21,129.06 Q 120,98 156,98 Z" fill="url(#mdl-grad-brand)"/></g>
    <rect id="shape-save-bar" x="156" y="372" width="200" height="44" rx="22" fill="url(#mdl-grad-brand)"/>
  </g>
  <g id="layer-highlight" inkscape:groupmode="layer" inkscape:label="Highlight (gloss)">
    <g id="highlight-body" mask="url(#mdl-mask-levels)"><path id="shape-triangle-gloss" d="M 156,98 L 356,98 Q 392,98 373.79,129.06 L 264.09,316.2 Q 256,330 247.91,316.2 L 138.21,129.06 Q 120,98 156,98 Z" fill="url(#mdl-grad-sheen)"/></g>
    <rect id="shape-save-bar-gloss" x="156" y="372" width="200" height="44" rx="22" fill="url(#mdl-grad-sheen)"/>
  </g>
  <script type="text/javascript">
    // <![CDATA[
    (function(){var svg=(document.currentScript&&document.currentScript.ownerSVGElement)?document.currentScript.ownerSVGElement:document.querySelector('svg');if(!svg)return;try{var m=(new URLSearchParams(window.location.search||'')).get('mode')||(window.location.hash||'').replace('#','')||'';if(!m||m==='light')return;m.split(/[ +]/).forEach(function(c){if(c)svg.classList.add(c);});}catch(e){}})();
    // ]]>
  </script>
</svg>