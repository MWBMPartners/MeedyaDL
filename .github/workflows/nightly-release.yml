#
# Nightly Release Workflow for MeedyaDL
# =====================================
#
# Scheduled daily at 00:00 UTC. Merges all `feat/*` branches into `nightly`,
# bumps the version to `X.Y.Z-nightly.YYYYMMDD`, creates a tag, and pushes it
# to trigger the existing `release.yml` build pipeline.
#
# Pipeline:
#   1. Reset `nightly` to `main`
#   2. Merge every `feat/*` branch (skip conflicting ones, open an issue)
#   3. Compute version suffix from current base version + UTC date
#   4. Patch package.json, tauri.conf.json, Cargo.toml, regenerate Cargo.lock
#   5. Commit the version bump on `nightly`
#   6. Push `nightly` (force-with-lease) and the new tag
#
# The tag push is what triggers release.yml; the branch push keeps `nightly`
# tracking the integrated state so contributors can check out what was built.

name: Nightly Release

on:
  schedule:
    # 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build merge + version locally but skip tag/push'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  # Change-detection gate (added 2026-05-10).
  #
  # Before the cron-driven daily build kicks off, check whether
  # anything has actually changed since the last nightly tag. If
  # `main` AND every `origin/feat/*` branch are unchanged at HEAD
  # since the previous nightly's commit, skip the whole pipeline —
  # there's no point publishing a byte-identical rebuild.
  #
  # The manual `workflow_dispatch` trigger always bypasses this gate
  # so a maintainer can force a build via the GitHub UI / CLI even
  # on a quiet day (useful for re-running after a transient build
  # failure or testing the workflow itself).
  check:
    name: Check for new commits since last nightly
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout main with full history + tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Detect changes since last nightly
        id: detect
        run: |
          set -euo pipefail

          # Manual triggers always proceed — change-detection is for
          # the cron path only. Maintainers running `gh workflow run
          # "Nightly Release"` mean it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — bypassing change-detection"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual trigger" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the most recent nightly tag (lexically sorted by
          # version — `git tag --sort=-v:refname` handles the
          # `vX.Y.Z-nightly.YYYYMMDD` suffix correctly).
          PREV_TAG=$(git tag --list 'v*-nightly.*' --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous nightly tag found — first nightly will build"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=first nightly (no previous tag)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Previous nightly tag: $PREV_TAG"

          # Did `main` advance since the previous nightly?
          MAIN_NEW=$(git rev-list "$PREV_TAG..origin/main" --count)
          echo "New commits on main since $PREV_TAG: $MAIN_NEW"

          # Did any `feat/*` branch advance since the previous nightly?
          # (The nightly build merges every feat/* branch, so a new
          # commit on any of them is also a reason to rebuild.)
          FEAT_NEW=0
          FEAT_DETAILS=""
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/feat/*'); do
            n=$(git rev-list "$PREV_TAG..$ref" --count)
            if [ "$n" -gt 0 ]; then
              FEAT_NEW=$((FEAT_NEW + n))
              FEAT_DETAILS="$FEAT_DETAILS $ref(+$n)"
            fi
          done
          echo "New commits on feat/* branches since $PREV_TAG: $FEAT_NEW ($FEAT_DETAILS)"

          if [ "$MAIN_NEW" -eq 0 ] && [ "$FEAT_NEW" -eq 0 ]; then
            echo "::notice::No new commits since $PREV_TAG — skipping nightly build"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no new commits since $PREV_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=main+$MAIN_NEW feat+$FEAT_NEW since $PREV_TAG" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    name: Build nightly tag
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          # RELEASE_PAT is required so the tag push later triggers release.yml.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reset nightly branch to main
        run: |
          # Start fresh from main every run so merged/dropped feat branches
          # don't accumulate stale conflicts on nightly.
          git checkout -B nightly origin/main

      - name: Merge feat/* branches
        id: merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          # List remote feat/* branches, newest commit first.
          mapfile -t FEAT_REFS < <(
            git for-each-ref \
              --sort=-committerdate \
              --format='%(refname:short)' \
              'refs/remotes/origin/feat/*'
          )

          MERGED=()
          CONFLICTED=()

          for REF in "${FEAT_REFS[@]}"; do
            BRANCH="${REF#origin/}"
            echo "::group::Merging $BRANCH"
            if git merge --no-ff --no-edit "$REF" -m "chore(nightly): merge $BRANCH"; then
              MERGED+=("$BRANCH")
              echo "Merged $BRANCH"
            else
              echo "::warning::Conflict while merging $BRANCH — aborting merge"
              git merge --abort || true
              CONFLICTED+=("$BRANCH")
            fi
            echo "::endgroup::"
          done

          {
            echo "merged<<EOF"
            printf '%s\n' "${MERGED[@]}"
            echo "EOF"
            echo "conflicted<<EOF"
            printf '%s\n' "${CONFLICTED[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue for conflicting branches
        if: steps.merge.outputs.conflicted != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          TITLE="Nightly $DATE: merge conflicts on feat/* branches"
          BODY=$(cat <<'MD'
          One or more `feat/*` branches could not be merged cleanly into `nightly` during the automated nightly build.
          These branches were skipped for this run and will be retried on the next nightly.

          **Conflicting branches:**
          MD
          )
          BODY="$BODY"$'\n\n'"$(printf -- '- %s\n' $CONFLICTED)"
          # Only open one issue per day
          EXISTING=$(gh issue list --state open --search "in:title \"Nightly $DATE\"" --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY" --label nightly-conflict || true
          fi

      - name: Compute nightly version
        id: version
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version")
          # Strip any pre-release suffix from the base version so we always
          # anchor to the last stable X.Y.Z before appending -nightly.DATE.
          BASE="${BASE%%-*}"
          DATE=$(date -u +%Y%m%d)
          VERSION="${BASE}-nightly.${DATE}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=nightly" >> "$GITHUB_OUTPUT"

      - name: Patch version in manifests
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const v = process.env.NEW_VERSION;
            for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(readFileSync(p, 'utf8'));
              j.version = v;
              writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "
          # Cargo.toml — single-line version bump in [package]
          python3 - <<PY
          import re, pathlib
          p = pathlib.Path('src-tauri/Cargo.toml')
          t = p.read_text()
          t = re.sub(r'(?m)^version\s*=\s*"[^"]*"', f'version = "{"${NEW_VERSION}"}"', t, count=1)
          p.write_text(t)
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Regenerate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit version bump
        run: |
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(nightly): ${{ steps.version.outputs.version }}"

      - name: Push nightly branch and tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git push --force-with-lease origin nightly
          git tag -a "${{ steps.version.outputs.tag }}" -m "Nightly ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Nightly Build"
            echo ""
            echo "- **Tag:** \`${{ steps.version.outputs.tag }}\`"
            echo "- **Channel:** nightly"
            echo "- **Merged feat branches:**"
            echo '```'
            echo "${{ steps.merge.outputs.merged }}"
            echo '```'
            if [ -n "${{ steps.merge.outputs.conflicted }}" ]; then
              echo "- **Skipped (conflicts):**"
              echo '```'
              echo "${{ steps.merge.outputs.conflicted }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
