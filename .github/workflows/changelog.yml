# Automated Changelog Generation Workflow for MeedyaDL
# =======================================================
#
# This GitHub Actions workflow automatically generates and commits an up-to-date
# CHANGELOG.md file whenever changes are pushed to the main branch. It uses
# git-cliff to parse conventional commit messages and produce a well-formatted,
# grouped changelog.
#
# How it works:
#   1. Triggered on push to main (excluding CHANGELOG.md changes to avoid infinite loops)
#   2. Checks out the FULL git history (fetch-depth: 0) so git-cliff can see all commits
#   3. Runs git-cliff with the cliff.toml configuration to regenerate CHANGELOG.md
#   4. If CHANGELOG.md changed, commits and pushes the update with "[skip ci]" to prevent loops
#
# Infinite loop prevention:
#   Two mechanisms prevent this workflow from triggering itself:
#   1. paths-ignore: ['CHANGELOG.md'] -- Ignores pushes that only modify CHANGELOG.md
#   2. "[skip ci]" in the commit message -- GitHub Actions skips workflows for [skip ci] commits
#
# The generated CHANGELOG.md is committed by the github-actions[bot] user,
# which is GitHub's official bot account for Actions-generated commits.
#
# Authentication:
#   Uses RELEASE_PAT (not GITHUB_TOKEN) so the changelog commit can push directly
#   to main, bypassing repository rulesets that require pull requests and status checks.
#   The PAT must belong to a repository admin who is a bypass actor in the rulesets.
#
# Related config files:
#   - cliff.toml                -- git-cliff configuration (template, commit parsers, sorting)
#   - commitlint.config.js      -- Ensures commits follow the conventional format that git-cliff expects
#   - .github/workflows/release.yml -- Release notes reference the generated CHANGELOG.md
#
# @see https://github.com/orhun/git-cliff-action -- git-cliff GitHub Action
# @see https://git-cliff.org/docs/ -- git-cliff documentation
# @see https://docs.github.com/en/actions -- GitHub Actions documentation

# Workflow display name in the GitHub Actions UI
name: Changelog

# ============================================================
# Trigger: Run on pushes to main, excluding CHANGELOG.md changes
# ============================================================
on:
  push:
    branches: [main]
    # paths-ignore prevents this workflow from triggering when ONLY CHANGELOG.md is modified.
    # This is the primary mechanism for preventing an infinite loop:
    #   1. Developer pushes code to main --> this workflow runs
    #   2. Workflow regenerates CHANGELOG.md and pushes it
    #   3. The push in step 2 only changes CHANGELOG.md --> paths-ignore prevents re-trigger
    #
    # @see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
    paths-ignore:
      - 'CHANGELOG.md'
  # Allow manual trigger from GitHub UI or CLI (gh workflow run "Changelog")
  # Useful for conserving Actions minutes during rapid development:
  #   1. Push commits with "[skip ci]" in the message to skip auto-triggers
  #   2. When ready to validate, manually trigger this workflow
  workflow_dispatch:

# permissions: contents: write allows the workflow to push commits back to the repository.
# Required for the "Commit changelog" step which runs git push.
# @see https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
permissions:
  contents: write

# Concurrency control (#703).
#
# Without a concurrency group, two pushes to main spawn two parallel
# changelog jobs that race on CHANGELOG.md — both check out the same SHA,
# both regenerate against slightly different histories, and the second
# push is rejected non-fast-forward. Earlier patches (#544, #700) bolted
# bash-level retry loops onto the symptom; this group fixes the root
# cause by serialising runs.
#
# `cancel-in-progress: false` so we don't drop changelog updates when a
# fast-follow merge arrives — the second job waits for the first to
# complete, then runs against the new origin/main, then short-circuits
# (no diff) if the first job's regeneration already covered it.
#
# Group keyed by ref so workflow_dispatch from a feature branch doesn't
# block the main-branch push handler (and vice versa).
concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Generate and Commit CHANGELOG.md
  # ============================================================
  changelog:
    name: Generate Changelog
    # Runs on ubuntu-latest (cheapest and fastest runner for this simple job).
    # No platform-specific dependencies are needed -- git-cliff is a single binary.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the full git history.
      # fetch-depth: 0 clones ALL commits (not just the latest) because git-cliff
      # needs the complete history to:
      #   - Parse conventional commit messages from all commits since the last tag
      #   - Group commits by version tags (v0.1.0, v0.2.0, etc.)
      #   - Generate a complete changelog spanning all releases
      #
      # Default fetch-depth: 1 (shallow clone) would only give the latest commit,
      # resulting in an incomplete changelog.
      #
      # The RELEASE_PAT token is used instead of GITHUB_TOKEN so that the
      # git push in the "Commit changelog" step can bypass repository rulesets
      # (branch protection) on main. The default GITHUB_TOKEN is blocked by
      # rulesets that require PRs and status checks for pushes to main.
      # RELEASE_PAT belongs to a repository admin who is a bypass actor.
      #
      # @see https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      # Step 2: Install the git-cliff binary on the runner's $PATH.
      #
      # We previously used orhun/git-cliff-action@v4 here, but that runs
      # git-cliff as a Docker action — the binary lives inside the
      # container that the action uses, not on the host. The retry loop
      # in the Commit step (#700) needs to invoke `git-cliff` directly
      # to regenerate against a freshly-reset working tree, so the
      # binary must be on $PATH (#703 — Run #530 failed with
      # `git-cliff: command not found`).
      #
      # Pinning the version explicitly here also gives us hermetic,
      # reproducible regeneration: both the initial regeneration and
      # any retry-loop regenerations use the same binary, so they can
      # never produce different outputs against the same history.
      #
      # Bump GIT_CLIFF_VERSION when a new git-cliff release introduces
      # changelog formatting we want; otherwise leave pinned for stable
      # CHANGELOG.md output across runs.
      - name: Install git-cliff
        run: |
          set -euo pipefail
          GIT_CLIFF_VERSION=2.10.1
          GIT_CLIFF_DIR="git-cliff-${GIT_CLIFF_VERSION}"
          GIT_CLIFF_TARBALL="${GIT_CLIFF_DIR}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${GIT_CLIFF_TARBALL}" \
            -o /tmp/git-cliff.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install -m 755 "/tmp/${GIT_CLIFF_DIR}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      # Step 3: Generate CHANGELOG.md using the locally-installed binary.
      # Same effective invocation as the orhun action, but uses the binary
      # we just installed so the version is consistent with the retry
      # loop's regenerations below (#703).
      - name: Generate changelog
        run: git-cliff --config cliff.toml --verbose --output CHANGELOG.md

      # Step 3: Commit and push the updated CHANGELOG.md.
      # This step:
      #   1. Configures git with the GitHub Actions bot identity
      #   2. Stages CHANGELOG.md
      #   3. Checks if there are actual changes (git diff --staged --quiet)
      #   4. If changes exist, creates a commit with "[skip ci]" to prevent loops
      #   5. Pushes the commit to the main branch
      #
      # The "docs: update CHANGELOG.md" commit message follows the conventional
      # commits format (type: description) and will appear in the next changelog
      # generation under the "Documentation" section -- unless we add a skip rule
      # for it in cliff.toml's commit_parsers.
      #
      # "[skip ci]" in the commit message tells GitHub Actions to NOT trigger
      # any workflows for this push, providing a second layer of infinite loop prevention.
      #
      # @see https://docs.github.com/en/actions/managing-workflow-runs/skipping-workflow-runs
      # Push is wrapped in a regenerate-from-scratch + bounded retry loop to
      # survive the race where another workflow (e.g. release-please, or a
      # concurrent changelog run from a fast-follow merge) lands on main
      # between our checkout and our push.
      #
      # The earlier retry strategy (#544) used `git pull --rebase` to resolve
      # the non-fast-forward case, but did not handle a CHANGELOG.md conflict
      # produced *during* that rebase. When two changelog runs both
      # regenerated the file from slightly different histories, the rebase
      # left an unmerged tree, and the next iteration of the loop tripped
      # on `Pulling is not possible because you have unmerged files` until
      # the budget was exhausted (#700).
      #
      # The fix: every retry iteration starts from a hermetically-clean
      # state — abort any pending rebase, hard-reset to the latest
      # origin/main, regenerate CHANGELOG.md from the new history, then
      # commit and push. Because `git-cliff` is a deterministic function
      # of `git log`, regenerating against the merged base produces the
      # correct file content; there is no semantic conflict to resolve.
      #
      # `git-cliff` is on $PATH because orhun/git-cliff-action@v4 (the
      # previous step) installs it and exports the directory via
      # $GITHUB_PATH. Cargo install fallback isn't needed for this
      # workflow's invocation pattern.
      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Probe once: if the action's first regeneration produced no
          # diff against the checkout, we can short-circuit before the
          # loop spends an iteration.
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git reset HEAD -- CHANGELOG.md > /dev/null

          for attempt in 1 2 3 4; do
            # Clean slate: abort any rebase the previous iteration left
            # behind, then fast-forward the working tree to the current
            # tip of origin/main. Discards our local CHANGELOG.md edits;
            # we'll regenerate them in a moment.
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            # Regenerate against the new history. `git-cliff` is
            # deterministic, so the output is the canonical CHANGELOG.md
            # for whatever HEAD now points at — no conflict to resolve.
            git-cliff --config cliff.toml --output CHANGELOG.md

            git add CHANGELOG.md
            if git diff --staged --quiet; then
              echo "No changelog changes to commit (attempt ${attempt}) — \
            another run already pushed an equivalent regeneration."
              exit 0
            fi

            git commit -m "docs: update CHANGELOG.md [skip ci]"

            if git push; then
              echo "Changelog pushed on attempt ${attempt}."
              exit 0
            fi

            sleep_seconds=$((attempt * 2))
            echo "Push attempt ${attempt} failed (likely non-fast-forward — \
          another push landed); retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done
          echo "Push failed after 4 attempts." >&2
          exit 1
