# Release Please Workflow for MeedyaDL
# =======================================
#
# This workflow uses Google's release-please to automate versioning and releases.
# When conventional commits land on main (directly or via PR merge), release-please
# either creates or updates a "Release PR" that bumps versions across all source files.
#
# When the Release PR is merged, release-please:
#   1. Creates an annotated git tag (e.g., v0.1.2)
#   2. The tag push triggers the existing release.yml workflow
#   3. release.yml builds all 7 platform targets and creates a draft GitHub Release
#
# Conventional commit mapping:
#   feat:     → patch bump (while < v1.0.0, configured via bump-minor-pre-major)
#   fix:      → patch bump
#   feat!:    → minor bump (while < v1.0.0; would be major after v1.0.0)
#   BREAKING CHANGE: → minor bump (while < v1.0.0)
#
# Version files updated by release-please:
#   - package.json              -- Native (node release-type)
#   - src-tauri/tauri.conf.json -- Via extra-files (JSON jsonpath)
#   - src-tauri/Cargo.toml      -- Via extra-files (TOML jsonpath)
#   - src-tauri/Cargo.lock      -- Via `cargo update --package meedyadl --precise`
#                                  (workflow step; #995 -- NOT `cargo generate-lockfile`,
#                                  which would re-resolve the entire dependency tree)
#
# IMPORTANT:
#   - Uses RELEASE_PAT (not GITHUB_TOKEN) so the tag push triggers release.yml
#   - git-cliff owns CHANGELOG.md -- release-please has skip-changelog: true
#   - Cargo.lock cannot use release-please annotations (cargo strips comments),
#     so a separate workflow step syncs just the `meedyadl` entry from the
#     already-bumped Cargo.toml -- matching the same fix alpha-release.yml
#     applies for its own version bumps (#995)
#
# For non-standard releases (explicit version, hotfix), use the manual override:
#   gh workflow run "Version Bump" -f bump=<major|minor|patch|X.Y.Z>
#
# @see release-please-config.json -- Release-please configuration
# @see .release-please-manifest.json -- Version tracking manifest
# @see .github/workflows/release.yml -- Build workflow triggered by the tag
# @see .github/workflows/version-bump.yml -- Manual override for non-standard releases
# @see cliff.toml -- Changelog config (independent of release-please)
# @see https://github.com/googleapis/release-please-action -- Action documentation

name: Release Please

# ============================================================
# Trigger: Run on every push to main
# ============================================================
# release-please scans new commits for conventional commit messages and
# determines whether a version bump is needed. If so, it creates or updates
# a Release PR. When that PR is merged, it creates the version tag.
on:
  push:
    branches: [main]
  # Allow manual trigger from GitHub UI or CLI (gh workflow run "Release Please")
  # Useful for conserving Actions minutes during rapid development:
  #   1. Push commits with "[skip ci]" in the message to skip auto-triggers
  #   2. When ready to validate, manually trigger this workflow
  workflow_dispatch:

# permissions: contents: write is needed for creating tags and releases.
# permissions: pull-requests: write is needed for creating and updating the Release PR.
permissions:
  contents: write
  pull-requests: write

# Concurrency control (#703 — hardening).
#
# release-please-action coalesces internally on its own release-PR
# branch, so this group is belt-and-braces — but every other long-
# running workflow that mutates `main` in this repo (alpha/beta/rc/
# nightly/weekly/monthly/realign-alpha/update-security-policy) has a
# concurrency group, and missing it here was a foot-gun for the
# future. `cancel-in-progress: false` matches the pattern used by
# those workflows so a late-arriving push doesn't drop a release-PR
# update mid-flight.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      # Step 1: Run release-please.
      # On regular pushes: analyzes conventional commits since the last release
      # and creates or updates a Release PR with version bumps.
      # When the Release PR is merged: creates a git tag and GitHub Release object.
      #
      # The RELEASE_PAT token is critical here. GitHub's default GITHUB_TOKEN
      # does not trigger other workflows when it pushes tags (infinite-loop prevention).
      # The PAT allows the tag push to trigger release.yml.
      #
      # @see https://github.com/googleapis/release-please-action
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Step 2: If a Release PR was just created, update Cargo.lock.
      # release-please updates Cargo.toml via TOML jsonpath, but cannot reliably
      # update Cargo.lock (cargo strips TOML comments, and lock file jsonpath
      # filters are unreliable for multi-package lock files).
      #
      # Instead, we check out the Release PR branch, read the version
      # release-please already bumped into package.json there, use
      # `cargo update --package meedyadl --precise` to sync just that one
      # lockfile entry (#995 -- see the Sync step below for why this is
      # NOT `cargo generate-lockfile`), and push the change back to the PR
      # branch.
      #
      # This step only runs when release-please has created/updated a PR
      # (prs_created is true). It does NOT run when a release was just created
      # (the PR was merged and the tag was pushed).
      - name: Checkout Release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # release-please branch naming: release-please--branches--{target}--components--{component}
          # Component name comes from package.json "name" field (meedyadl).
          # Previously this was hardcoded as "release-please--branches--main" which
          # doesn't match the actual branch and caused checkout failures.
          ref: release-please--branches--main--components--meedyadl
          token: ${{ secrets.RELEASE_PAT }}

      # Step 3: Set up Rust toolchain for Cargo.lock alignment.
      # Only the stable toolchain is needed — no specific target required since
      # we're only touching the lock file's own `meedyadl` entry, not compiling.
      - name: Setup Rust
        if: steps.release.outputs.prs_created == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      # Step 4: Read the version release-please already bumped into
      # package.json on the checked-out Release PR branch (Step 2 above).
      # release-please-action's own commit on that branch already patched
      # package.json / tauri.conf.json / Cargo.toml via the `extra-files`
      # config in release-please-config.json BEFORE this workflow runs --
      # we're just reading back the value it wrote, the same way
      # alpha-release.yml reads its own already-patched package.json
      # (`node -p "require('./package.json').version"`) rather than
      # recomputing or guessing it.
      - name: Read bumped version
        if: steps.release.outputs.prs_created == 'true'
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Step 5: Sync Cargo.lock to the bumped version WITHOUT re-resolving
      # the rest of the dependency tree (#995 residual).
      #
      # `cargo generate-lockfile` (the previous approach here) fully
      # re-resolves EVERY dependency to the newest semver-compatible
      # version on the registry, including the unpinned
      # `meedya-fingerprint`/`meedya-lyrics` git deps (branch = "main").
      # That means the tag eventually built from this Release PR could
      # ship crate versions that never ran through CI's `cargo test` /
      # `cargo clippy` / `cargo-deny` gates on this exact combination --
      # supply-chain drift introduced solely by the version-bump step.
      # `alpha-release.yml` hit this exact problem first and fixed it
      # (#995); this step matches that fix verbatim instead of maintaining
      # a second, drifting implementation of the same idea.
      #
      # `cargo update --package meedyadl` re-resolves ONLY the local
      # `meedyadl` package's own lockfile entry (its version, matching the
      # Cargo.toml release-please already patched) and leaves every other
      # dependency -- including the git deps -- exactly as CI validated
      # them. No network access is required: the local package's manifest
      # is read from disk, so this works even if a runner has no route to
      # crates.io or the git remotes.
      - name: Sync Cargo.lock to bumped version (#995)
        if: steps.release.outputs.prs_created == 'true'
        working-directory: src-tauri
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: cargo update --package meedyadl --precise "$NEW_VERSION"

      # Step 6: Commit and push the updated Cargo.lock back to the Release PR branch.
      # The `git diff --staged --quiet` check ensures we only commit if there are
      # actual changes (avoids empty commits if Cargo.lock was already correct).
      - name: Commit Cargo.lock update
        if: steps.release.outputs.prs_created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git diff --staged --quiet || git commit -m "chore(release): update Cargo.lock"
          git push

      # Step 6: Print a summary of what release-please did in this run.
      # This appears in the GitHub Actions UI under the workflow run summary.
      - name: Summary
        run: |
          echo "### Release Please Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.release.outputs.release_created }}" = "true" ]; then
            echo "- **Release created**: v${{ steps.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tag**: ${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release workflow**: Should be triggered by the tag push" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.release.outputs.prs_created }}" = "true" ]; then
            echo "- **Release PR created/updated**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cargo.lock has been synced to the bumped version on the PR branch" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No release actions taken (no releasable commits since last release)" >> "$GITHUB_STEP_SUMMARY"
          fi
