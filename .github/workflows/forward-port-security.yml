#
# Forward-port Security Fixes
# ===========================
#
# WHY THIS EXISTS
# ---------------
# Dependabot *security* updates ALWAYS open against the repository's default
# branch (`main`) and IGNORE the `target-branch` set in `.github/dependabot.yml`.
# Every `target-branch` entry in that file only routes Dependabot *version*
# (routine) updates; none of them has any effect on security updates. GitHub
# provides no configuration to redirect security updates to a non-default
# branch — this is true no matter how many `target-branch` entries exist.
#
# The consequence: without this workflow, security fixes — the higher-stakes
# updates — would land ONLY on `main` and never reach the long-lived channel
# branches where active development and most prerelease builds live. Those
# channels would be left exposed to the very vulnerability that was just fixed.
#
# WHAT THIS DOES
# --------------
# When a Dependabot PR merges to `main`, this workflow cherry-picks the fix
# onto each channel branch (alpha, beta, release-candidate) and opens a PR on
# each so the channel's own CI validates the change before it merges. If the
# cherry-pick conflicts (the channel's lockfile has diverged), it opens a
# tracking issue with copy-paste manual-forward-port instructions instead.
#
# TELLING A SECURITY FIX APART FROM A ROUTINE UPDATE ON `main`
# --------------------------------------------------------------
# `.github/dependabot.yml` now also opens ROUTINE (weekly, grouped) update
# PRs directly against `main`, alongside the security PRs GitHub always sends
# there. So a Dependabot PR on `main` is no longer automatically a security
# fix — it could be either kind, and forward-porting a routine update here
# would be redundant (it already has its own direct `main` entry) as well as
# wrong to label "security" in the tracking PR/issue this workflow opens.
# The gate below tells them apart by branch name: Dependabot names a routine
# grouped-update branch with `/npm-minor-patch-` or `/cargo-minor-patch-`
# (see the `npm-minor-patch` / `cargo-minor-patch` group names in
# dependabot.yml); a security-update branch never contains that substring.
# Only branches WITHOUT that marker are forward-ported here.
#
# TRIGGER: a push to `main`. When a Dependabot security PR merges (including via
# auto-merge), its squash commit lands on `main` and fires this workflow in the
# base-repo trust context, where `RELEASE_PAT` is available. Because the trigger
# is a push to the default branch — NOT `pull_request_target` — no untrusted PR
# head is ever in scope: by the time we run, the fix is already merged, reviewed,
# and on `main`, and we only cherry-pick that commit by SHA onto the channels.
#
# This also fixes the failure mode of the previous `pull_request_target: closed`
# design: a close event whose actor is `dependabot[bot]` (which is what an
# AUTO-merged Dependabot PR produces) gets a read-only token under GitHub's
# Dependabot hardening, so the forward-port could not push. A push to `main` is
# always full-trust, so auto-merged security fixes forward-port correctly.
#
# WIDENING THE AUTHOR GATE (issue #1165)
# ----------------------------------------
# This repo also has a "combine pull requests instead of stacking them" rule
# (see CLAUDE.md) — when two Dependabot PRs target the same branch, they get
# merged into one human-authored PR instead of racing each other to a stale
# base. That rule is correct on its own, but it collided with the plain
# "author must be dependabot[bot]" check this workflow used to have: the
# combined PR has a person's name on it, so the fix inside it silently never
# left `main`. This really happened — PR #1128 combined Dependabot's #1122
# and #1123, merged clean, and was never forward-ported until this was fixed.
#
# So a PR that merges to `main` and isn't authored by dependabot[bot] can
# still qualify for forward-porting two other ways:
#   (a) it carries the `security` label, or
#   (b) its description names another pull request (a plain "#1122") that
#       it really superseded and carries. The "combine, don't stack"
#       convention already requires saying what a combined PR closes —
#       #1128's body literally says "Supersedes and closes: #1122, #1123" —
#       so this reads information the convention was already producing.
#       But a description is ordinary text anybody can write, so naming a
#       pull request is not enough on its own (Codex's review of #1275 showed
#       "See #42 for an unrelated dependency fix" qualifying an unrelated
#       code change). The named pull request must be Dependabot's, closed
#       without being merged, and not a routine grouped update; this PR must
#       have changed nothing but the lockfiles and the two manifests; and
#       every lockfile version change the named pull request made must be in
#       this PR's merge commit. The `gate` job checks each of these, and
#       anything it cannot check means "does not qualify".
# Whichever reason applies is written to the run's log in plain words (see
# the `gate` job below) so nobody has to guess why a given PR was or wasn't
# forward-ported.
#
# Never forwarded, whatever else would qualify them (a manual run
# included): release-please's own release PRs (`release-please--branches--`
# branches), which bump version numbers in the lockfiles on every release
# and must never be copied onto the channel branches, and routine grouped
# dependency updates (see "TELLING A SECURITY FIX APART..." above).
#
# This widening is secondary, not the main fix for #1165 — it only helps
# when SOME pull request, however it was later combined, carried the fix.
# One of the two real cases behind #1165 had no Dependabot PR anywhere in
# its history at all (`h2` 0.4.15 -> 0.4.18, fixed by hand after
# `cargo deny check advisories` turned `main` red at 2am) — no author check,
# however clever, can key on a PR that never existed. That case is instead
# caught by `.github/workflows/channel-security-audit.yml`, which checks
# each channel branch directly against the advisory databases regardless of
# how any fix for it might arrive.
#
# WHEN NOTHING FORWARD-PORTS AUTOMATICALLY
# --------------------------------------------
# If a PR merges to `main` and changes a lockfile, but is neither from
# Dependabot nor qualifies via (a) or (b) above, the `flag-unported-lockfile-
# change` job below leaves one plain-English comment on it noting that it
# wasn't forward-ported and how to do it by hand — a low-key notice, not an
# alarm, since most such PRs are perfectly ordinary and don't need to go
# anywhere else. Two kinds of PR are excluded outright because they are
# KNOWN, not just likely, to be uninteresting here: release-please's own
# version-bump PRs (they touch both lockfiles' version fields on every
# release but are never a security fix) and routine grouped dependency
# updates (`dependabot.yml` is explicit that security updates are "always
# created immediately, not batched", so a grouped PR cannot structurally be
# one — and it would otherwise fire weekly, per ecosystem, forever).
#
# CHECKING "ALREADY HAS IT" BEFORE ATTEMPTING THE CHERRY-PICK
# ----------------------------------------------------------------
# The one time this workflow ran end to end for real, it conflicted while
# cherry-picking onto all three channels and opened three "please forward-
# port this by hand" tracking issues (#1143, #1144, #1145) — and all three
# were false alarms; every channel already had the fix. That is not bad
# luck. A lockfile is one huge machine-generated block of text, so the same
# one-line dependency bump can sit somewhere completely different in the
# file on a branch that has otherwise drifted, and a plain textual cherry-
# pick conflicts easily even when the branch is already fine. Conflicts are
# the ordinary outcome for a lockfile, not the exception — so the OLD "did
# it apply cleanly?" check (which only ran AFTER attempting the cherry-pick)
# was checking the wrong thing at the wrong time.
#
# `.github/scripts/check_lockfile_already_fixed.py` runs BEFORE the cherry-
# pick is attempted and asks the real question instead: does the target
# branch already have everything the fix commit changed? That's a version
# comparison, not a text diff, so branch drift elsewhere in the file can't
# produce a false conflict. A wrong "yes" skips a branch silently, so the
# helper only says "yes" when ALL of these hold (its own header explains
# each one in full):
#   - every file the commit changed is a lockfile or one of the two
#     manifests (`package.json`, `src-tauri/Cargo.toml`) — a code change
#     riding along with a bump is never skipped;
#   - every manifest line the commit added is already on the branch, and
#     every line it removed is gone (ignoring indentation and one trailing
#     comma);
#   - every copy of every package whose versions the commit changed — at
#     any nesting depth in npm, every locked version in Cargo — is at or
#     above the version the commit moved it to; a package it added is
#     present at or above the added version; a package it removed is gone,
#     every copy. A copy on a release line the commit did not touch (another
#     major version, or another 0.x) means "cannot tell".
# Anything it cannot read or cannot be sure of is "needs the fix". What it
# cannot know: whether any version is actually vulnerable (it compares with
# what main moved to, never with an advisory database — that is
# `channel-security-audit.yml`'s job), and anything about files other than
# those four. Only when it can't confirm the branch already has the fix does
# this fall back to the cherry-pick attempt (which keeps its own existing
# post-cherry-pick "did this actually change anything?" check as a second,
# cheap safety net).

name: Forward-port Security Fixes

on:
  # A Dependabot security fix reaches this repo by merging to `main`, which is a
  # push on the default branch. So does a routine Dependabot update now that
  # `dependabot.yml` targets `main` too, and so does a combined/hand-written PR
  # that closes a Dependabot fix — the gate job below resolves the merged PR
  # once and decides, for every push, whether it should be forward-ported
  # (dependabot[bot], OR the widened `security`-label/superseded-PR checks —
  # see "WIDENING THE AUTHOR GATE" above), whether it's a release-please PR or
  # a routine grouped update to skip (by branch name, see "TELLING A SECURITY
  # FIX APART..." above), and — for anything that qualifies for neither —
  # whether it touched
  # a lockfile and deserves the plain-English "this wasn't forward-ported"
  # comment from the `flag-unported-lockfile-change` job. Non-PR pushes exit
  # fast at the gate as before.
  push:
    branches: [main]
  # Manual entry point: backfill a fix, or re-run after resolving a conflict,
  # or run when the automatic trigger could not access secrets.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged Dependabot PR number on main to forward-port'
        required: true
        type: string

# Privileged git pushes and PR/issue creation use RELEASE_PAT, not the
# workflow GITHUB_TOKEN, so the default token stays read-only. Using a PAT also
# ensures the forward-port PRs trigger channel CI (PRs opened by GITHUB_TOKEN do
# not trigger other workflows).
permissions:
  contents: read

concurrency:
  group: forward-port-security-${{ inputs.pr_number || github.sha }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether to proceed and resolve the source PR's metadata once, so the
  # per-branch matrix jobs share a single consistent view.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      # true whenever a real merged-to-main PR was resolved at all — this is
      # deliberately NOT the same thing as "should be forward-ported"; see
      # `should_forward_port` below. Both downstream jobs check this first.
      proceed: ${{ steps.decide.outputs.proceed }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      merge_sha: ${{ steps.decide.outputs.merge_sha }}
      pr_title: ${{ steps.decide.outputs.pr_title }}
      author: ${{ steps.decide.outputs.author }}
      # Whether the `forward-port` job below should act on this PR at all —
      # true for dependabot[bot], for the widened `security`-label /
      # description-names-a-superseded-Dependabot-fix-it-carries cases, and
      # (author check bypassed) for a manual workflow_dispatch — false for a
      # release-please PR or a routine grouped update (whatever else would
      # qualify them, a manual run included) and for an ordinary PR that
      # qualifies none of those ways.
      should_forward_port: ${{ steps.decide.outputs.should_forward_port }}
      # Plain-English reason for the should_forward_port verdict, logged and
      # also used by the miss-comment job so the comment can say why.
      forward_port_reason: ${{ steps.decide.outputs.forward_port_reason }}
      # true if the merge commit touched package-lock.json or
      # src-tauri/Cargo.lock — the `flag-unported-lockfile-change` job only
      # ever needs to say anything when this is true.
      touched_lockfile: ${{ steps.decide.outputs.touched_lockfile }}
      # true if the PR's head branch is a release-please version-bump branch
      # (`release-please--branches--...`) — never forward-ported, and
      # excluded from the miss-comment job too, because those PRs touch both
      # lockfiles' version fields on every release and are never a security
      # fix.
      is_release_please: ${{ steps.decide.outputs.is_release_please }}
      # true if the PR's head branch is a routine grouped dependency update
      # (`.../npm-minor-patch-...` or `.../cargo-minor-patch-...`) — also
      # excluded from the miss-comment job. `dependabot.yml`'s own header
      # comment is explicit that security updates are "always created
      # immediately (not batched)", so a grouped PR is not merely unlikely
      # to be a security fix, it structurally cannot be one — commenting on
      # every one of these (they land on `main` weekly, per ecosystem) would
      # be pure noise with zero signal, which is exactly what "a notice, not
      # an alarm" is not supposed to become.
      is_routine_grouped: ${{ steps.decide.outputs.is_routine_grouped }}
    steps:
      # The "description names a Dependabot pull request it superseded"
      # check in the next step compares lockfiles with git and the helper
      # script, so the gate needs the repository and its history. This only
      # reads: it uses the default token, which this workflow limits to
      # reading (`permissions: contents: read` above), and nothing is
      # pushed. `filter: blob:none` fetches every commit and folder listing
      # but fetches a file's contents only when something reads it (here,
      # the files of the commit being checked out and a few lockfiles), so
      # this stays cheap on every push to main.
      - name: Checkout (history; file contents fetched only when read)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Resolve source PR and decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # Push tip: the merge commit already on `main`. Used ONLY to look up the
          # associated PR number via the API — it is never fetched or checked out
          # as a ref here (the forward-port job fetches the API-resolved merge SHA).
          PUSH_SHA: ${{ github.sha }}
          # workflow_dispatch input (empty on push).
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          skip() { echo "proceed=false" >> "$GITHUB_OUTPUT"; echo "::notice::$1"; exit 0; }

          # Resolve the PR number. On push, find the merged PR whose merge commit
          # is the pushed SHA (a trusted commit already on `main`). On dispatch,
          # the operator supplies it. Both paths then read the PR's authoritative
          # metadata from the API — no workflow event payload is ever trusted.
          IS_MANUAL=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$INPUT_PR"
            IS_MANUAL=1
          else
            PR=$(gh api "repos/$REPO/commits/$PUSH_SHA/pulls" \
              --jq 'map(select(.merged_at != null)) | (.[0].number // empty)')
            [ -n "$PR" ] || skip "Push $PUSH_SHA is not a merged PR — nothing to do."
          fi

          data=$(gh pr view "$PR" --repo "$REPO" \
            --json number,state,baseRefName,author,mergeCommit,title,headRefName,body,labels,files)
          [ "$(jq -r .state <<<"$data")" = "MERGED" ]     || skip "PR #$PR is not merged — nothing to do."
          [ "$(jq -r .baseRefName <<<"$data")" = "main" ] || skip "PR #$PR did not target main — skipping."

          AUTHOR=$(jq -r '.author.login' <<<"$data")
          HEAD_REF=$(jq -r '.headRefName' <<<"$data")
          # Read the merge commit before deciding anything: the "description
          # names a superseded Dependabot fix" check below compares it.
          MERGE_SHA=$(jq -r '.mergeCommit.oid // empty' <<<"$data")
          TITLE=$(jq -r '.title' <<<"$data")
          [ -n "$MERGE_SHA" ] || skip "No merge commit SHA for PR #$PR — skipping."

          # GitHub's REST API reports Dependabot's login as "dependabot[bot]",
          # but `gh pr view --json author` goes through the GraphQL API,
          # which reports the exact same actor as "app/dependabot" instead —
          # confirmed live against this repo's own real Dependabot PRs (every
          # one checked, e.g. #1122, #1123, #1150, #1152-#1154, came back
          # "app/dependabot" here, never "dependabot[bot]"). Before this fix,
          # this check only ever recognised the REST-style spelling, which
          # this GraphQL call never produces — meaning a genuine, un-combined
          # Dependabot security PR merging straight to `main` silently never
          # matched here either, on top of the "combining hides the author"
          # problem #1165 is otherwise about. (dependency-canary.yml's own
          # search-API query already independently uses the "app/dependabot"
          # form, for the same underlying reason.) Both spellings are
          # accepted so this can't quietly break again if a future GitHub or
          # `gh` CLI change flips which form either endpoint returns.
          is_dependabot_login() {
            case "$1" in
              "dependabot[bot]"|"app/dependabot") return 0 ;;
              *) return 1 ;;
            esac
          }

          IS_DEPENDABOT=false
          is_dependabot_login "$AUTHOR" && IS_DEPENDABOT=true

          # `dependabot.yml` now also opens ROUTINE (weekly, grouped) update
          # PRs directly against `main`, so a Dependabot PR on `main` is no
          # longer automatically a security fix. Dependabot names a routine
          # grouped-update branch with `/npm-minor-patch-` or
          # `/cargo-minor-patch-` (the group names configured in
          # dependabot.yml) — a real security-update branch never contains
          # that substring. This applies regardless of how the PR was
          # triggered (push or manual dispatch) — a routine update already
          # has its own direct `target-branch: main` entry and never needs
          # forward-porting anywhere else, even if someone dispatches this
          # workflow against its PR number by mistake.
          IS_ROUTINE_GROUPED=false
          case "$HEAD_REF" in
            */npm-minor-patch-*|*/cargo-minor-patch-*) IS_ROUTINE_GROUPED=true ;;
          esac

          # release-please's own version-bump PRs use this exact branch name
          # shape (see CLAUDE.md's "Release Please Branch Naming"). They touch
          # both lockfiles' version fields on every release but are never a
          # security fix, so they are never forward-ported — whatever else
          # might qualify them, even a manual run (copying a release's version
          # bumps onto the channel branches would be wrong in itself) — and
          # the miss-comment job skips them too.
          IS_RELEASE_PLEASE=false
          case "$HEAD_REF" in
            release-please--branches--*) IS_RELEASE_PLEASE=true ;;
          esac

          HAS_SECURITY_LABEL=false
          if jq -e '.labels[]? | select(.name=="security")' <<<"$data" >/dev/null 2>&1; then
            HAS_SECURITY_LABEL=true
          fi

          # Does the description name a Dependabot pull request that this one
          # superseded AND carries? This repo's "combine instead of stacking"
          # rule (CLAUDE.md) requires a combining PR to say what it closes —
          # PR #1128 really does say "Supersedes and closes: #1122, #1123" —
          # so this reads a fact the convention already produces.
          #
          # Merely naming a Dependabot pull request is not enough. A
          # description is ordinary text anybody can write ("See #42 for an
          # unrelated dependency fix"), and a pass here copies this pull
          # request's whole merge commit onto three branches using
          # RELEASE_PAT. So a named pull request only qualifies this one if
          # ALL of these hold, and every one is checked rather than assumed:
          #   - the named pull request was opened by Dependabot (either
          #     spelling, see is_dependabot_login) and closed WITHOUT being
          #     merged — a merged one was not superseded, and if it was a
          #     security fix it was forwarded on its own;
          #   - its branch is not a routine grouped update;
          #   - this pull request changed nothing but the lockfiles and the
          #     two manifests (package.json, src-tauri/Cargo.toml) — the
          #     forward-port copies the WHOLE merge commit, so anything else
          #     in it would ride along on the strength of somebody else's
          #     fix;
          #   - every lockfile version change the named pull request made is
          #     contained in this pull request's merge commit, checked with
          #     the same helper the forward-port uses
          #     (`--lockfile-changes-only`): the named pull request's own
          #     commit is the "fix" and this merge commit is the "target".
          #     GitHub keeps serving that commit at refs/pull/<n>/head even
          #     after Dependabot deletes its branch.
          # Anything that cannot be checked — the lookup fails, the commit
          # cannot be fetched, the helper cannot tell — means it does not
          # qualify, and the reason is written to this step's log. That errs
          # toward "not forwarded", the direction that can lose a fix, so it
          # is never silent: a pull request that changed a lockfile and was
          # not forwarded gets the plain-English notice from the
          # `flag-unported-lockfile-change` job below.
          #
          # What this cannot know: whether the named pull request was a
          # security fix at all (Dependabot's routine single-package updates
          # look the same), and, because the helper insists on every copy
          # of a package, a lockfile that also holds a second copy of the
          # same package on another release line makes the check say "cannot
          # tell", so such a pull request does not qualify this way.
          explain() { echo "  $1" >&2; }  # to the log, never into a captured result
          HELPER="$GITHUB_WORKSPACE/.github/scripts/check_lockfile_already_fixed.py"

          merged_commit_is_dependency_only() {
            local files others
            if ! files=$(git diff --no-renames --name-only "${MERGE_SHA}^" "$MERGE_SHA"); then
              explain "could not list the files this pull request's merge commit changed — cannot check, so no named pull request can qualify it"
              return 1
            fi
            if [ -z "$files" ]; then
              explain "this pull request's merge commit changed no files — no named pull request can qualify it"
              return 1
            fi
            others=$(grep -vE '^(package-lock\.json|package\.json|src-tauri/Cargo\.lock|src-tauri/Cargo\.toml)$' <<<"$files" || true)
            if [ -n "$others" ]; then
              explain "this pull request changed files other than the lockfiles and manifests, so a pull request named in its description cannot qualify it: $(tr '\n' ' ' <<<"$others")"
              return 1
            fi
          }

          named_pr_is_a_carried_dependabot_fix() {
            local ref="$1" ref_data ref_author ref_state ref_head ref_commit fork_point result line
            if ! ref_data=$(gh pr view "$ref" --repo "$REPO" --json author,state,headRefName 2>/dev/null); then
              explain "#$ref: could not be looked up as a pull request — passed over"
              return 1
            fi
            ref_author=$(jq -r '.author.login // empty' <<<"$ref_data")
            ref_state=$(jq -r '.state // empty' <<<"$ref_data")
            ref_head=$(jq -r '.headRefName // empty' <<<"$ref_data")
            if ! is_dependabot_login "$ref_author"; then
              explain "#$ref: opened by '$ref_author', not Dependabot — does not qualify"
              return 1
            fi
            if [ "$ref_state" != "CLOSED" ]; then
              explain "#$ref: its state is '$ref_state', not closed without being merged — does not qualify"
              return 1
            fi
            case "$ref_head" in
              */npm-minor-patch-*|*/cargo-minor-patch-*)
                explain "#$ref: '$ref_head' is a routine grouped update — does not qualify"
                return 1 ;;
            esac
            if ! git fetch --no-tags --quiet origin "refs/pull/$ref/head"; then
              explain "#$ref: could not fetch its commit (refs/pull/$ref/head) — cannot check, so it does not qualify"
              return 1
            fi
            ref_commit=$(git rev-parse FETCH_HEAD)
            if ! fork_point=$(git merge-base "$ref_commit" "$MERGE_SHA"); then
              explain "#$ref: its commit shares no history with this merge commit — cannot check, so it does not qualify"
              return 1
            fi
            # The helper only reads git; it never needs this step's
            # write-capable GH_TOKEN, so it does not get it.
            if result=$(env -u GH_TOKEN python3 "$HELPER" --repo-root "$GITHUB_WORKSPACE" \
                  --old "$fork_point" --new "$ref_commit" --target "$MERGE_SHA" \
                  --lockfile-changes-only package-lock.json src-tauri/Cargo.lock) \
               && grep -qx 'RESULT=ALREADY_FIXED' <<<"$result"; then
              while IFS= read -r line; do explain "#$ref: $line"; done <<<"$result"
              return 0
            fi
            explain "#$ref: its lockfile changes are not all in this pull request's merge commit, or that could not be checked — does not qualify:"
            while IFS= read -r line; do explain "#$ref: $line"; done <<<"$result"
            return 1
          }

          find_qualifying_dependabot_reference() {
            local body="$1" ref
            echo "Checking whether the description names a Dependabot pull request this one superseded and carries:" >&2
            merged_commit_is_dependency_only || return 1
            for ref in $(grep -oE '#[0-9]+' <<<"$body" | tr -d '#' | sort -un); do
              [ "$ref" != "$PR" ] || continue
              if named_pr_is_a_carried_dependabot_fix "$ref"; then
                echo "$ref"
                return 0
              fi
            done
            return 1
          }

          # Order matters: a release-please PR and a routine grouped update
          # are disqualified no matter how they got here, a manual run
          # included; a manual dispatch bypasses only the author check
          # (matching the pre-existing, documented behaviour); everything
          # else is the widened gate from issue #1165.
          SHOULD_FORWARD_PORT=false
          if [ "$IS_RELEASE_PLEASE" = "true" ]; then
            REASON="PR #$PR head branch '$HEAD_REF' is a release-please release pull request, which is never forward-ported"
          elif [ "$IS_ROUTINE_GROUPED" = "true" ]; then
            REASON="PR #$PR head branch '$HEAD_REF' is a routine grouped dependency update, not a security fix"
          elif [ "$IS_MANUAL" = "1" ]; then
            SHOULD_FORWARD_PORT=true
            REASON="requested manually via workflow_dispatch — author check bypassed"
          elif [ "$IS_DEPENDABOT" = "true" ]; then
            SHOULD_FORWARD_PORT=true
            REASON="authored by dependabot[bot]"
          elif [ "$HAS_SECURITY_LABEL" = "true" ]; then
            SHOULD_FORWARD_PORT=true
            REASON="carries the 'security' label"
          elif QUALIFYING_REF=$(find_qualifying_dependabot_reference "$(jq -r '.body // empty' <<<"$data")"); then
            SHOULD_FORWARD_PORT=true
            REASON="its description names #$QUALIFYING_REF, a Dependabot pull request closed without being merged, and this pull request's merge commit contains every lockfile change it made"
          else
            REASON="author is not Dependabot, it has no 'security' label, and its description names no closed Dependabot pull request whose lockfile changes it carries (the gate job's log says what was checked)"
          fi

          if [ "$SHOULD_FORWARD_PORT" = "true" ] && [ "$IS_DEPENDABOT" = "false" ] && [ "$IS_MANUAL" != "1" ]; then
            echo "::notice::Forward-porting a non-Dependabot PR #$PR: ${REASON}."
          fi

          TOUCHED_LOCKFILE=false
          if jq -e '.files[]? | select(.path=="package-lock.json" or .path=="src-tauri/Cargo.lock")' <<<"$data" >/dev/null 2>&1; then
            TOUCHED_LOCKFILE=true
          fi

          {
            echo "proceed=true"
            echo "pr_number=$PR"
            echo "merge_sha=$MERGE_SHA"
            # Title may contain arbitrary text; write it as a single line.
            echo "pr_title=${TITLE//$'\n'/ }"
            echo "author=$AUTHOR"
            echo "should_forward_port=$SHOULD_FORWARD_PORT"
            echo "forward_port_reason=${REASON}"
            echo "touched_lockfile=$TOUCHED_LOCKFILE"
            echo "is_release_please=$IS_RELEASE_PLEASE"
            echo "is_routine_grouped=$IS_ROUTINE_GROUPED"
          } >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_FORWARD_PORT" = "true" ]; then
            echo "::notice::Will forward-port PR #$PR ($MERGE_SHA) — ${REASON}."
          else
            echo "::notice::PR #$PR will not be forward-ported — ${REASON}."
          fi

  # ---------------------------------------------------------------------------
  # One leg per channel branch. fail-fast: false so a conflict on one channel
  # never blocks the others.
  # ---------------------------------------------------------------------------
  forward-port:
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.should_forward_port == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [alpha, beta, release-candidate]
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Cherry-pick onto ${{ matrix.target }} and open PR (or issue on conflict)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          MERGE_SHA: ${{ needs.gate.outputs.merge_sha }}
          PR_TITLE: ${{ needs.gate.outputs.pr_title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure the labels we apply exist (idempotent; dependabot creates
          # "dependencies", but "security" may not exist yet).
          gh label create security --repo "$REPO" --color "d73a4a" \
            --description "Security-relevant change" 2>/dev/null || true
          gh label create dependencies --repo "$REPO" --color "0366d6" \
            --description "Dependency updates" 2>/dev/null || true

          # Channel branch may not exist in every repo state — skip cleanly.
          if ! git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
            echo "::notice::Branch '$TARGET' does not exist — skipping."
            exit 0
          fi
          git fetch --no-tags origin "$TARGET" "$MERGE_SHA"

          # Ask the real question BEFORE attempting a cherry-pick at all: does
          # $TARGET already have everything this fix commit changed? See
          # "CHECKING 'ALREADY HAS IT'..." at the top of this file for why a
          # textual cherry-pick conflict is the wrong signal for a lockfile,
          # and for exactly what the helper counts as "already has it". Only
          # a confident "yes" skips the cherry-pick: every file the commit
          # changed is a lockfile or one of the two manifests named here,
          # every manifest line it added is already on $TARGET and every line
          # it removed is gone, and every copy of every package it changed is
          # fixed there. Anything else — a code change riding along with a
          # bump, a version behind, a crash — falls through to the cherry-
          # pick unchanged.
          #
          # This used to be split in two: a shell check here that only
          # stopped the shortcut for files OTHER than lockfiles and
          # manifests, and a helper that only compared lockfile versions. So
          # a manifest change nobody compared (Codex's case: turning off an
          # unsafe Cargo feature alongside a bump the channel already had)
          # could be skipped. The whole decision now lives in the helper,
          # where its tests can reach it, and the helper treats any file it
          # was not told about as one it cannot check.
          LOCKFILE_CHECK=$(python3 "$GITHUB_WORKSPACE/.github/scripts/check_lockfile_already_fixed.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --old "${MERGE_SHA}^" \
            --new "$MERGE_SHA" \
            --target "origin/$TARGET" \
            --manifest package.json \
            --manifest src-tauri/Cargo.toml \
            package-lock.json src-tauri/Cargo.lock) && LOCKFILE_RC=0 || LOCKFILE_RC=$?
          while IFS= read -r line; do echo "  $line"; done <<<"$LOCKFILE_CHECK"
          if [ "$LOCKFILE_RC" = "0" ] && grep -qx 'RESULT=ALREADY_FIXED' <<<"$LOCKFILE_CHECK"; then
            echo "::notice::'$TARGET' already has everything this fix changed — nothing to forward-port. See the DETAIL lines above."
            exit 0
          fi

          WORK="forward-port/security/pr-${PR_NUMBER}-to-${TARGET}"

          # Idempotency: don't stack duplicate PRs on re-run.
          if [ "$(gh pr list --repo "$REPO" --head "$WORK" --state open --json number --jq 'length')" != "0" ]; then
            echo "::notice::Forward-port PR for #$PR_NUMBER -> $TARGET already open — skipping."
            exit 0
          fi

          git checkout -B "$WORK" "origin/$TARGET"

          # A squash/rebase merge leaves a single-parent commit; a merge commit
          # has two parents and needs -m 1 to pick the mainline diff.
          PARENTS=$(git rev-list --parents -n 1 "$MERGE_SHA" | wc -w)
          if [ "$PARENTS" -ge 3 ]; then MFLAG=(-m 1); else MFLAG=(); fi

          if git cherry-pick -x "${MFLAG[@]}" "$MERGE_SHA"; then
            if git diff --quiet "origin/$TARGET" HEAD; then
              echo "::notice::'$TARGET' already contains this fix — nothing to forward-port."
              exit 0
            fi
            git push -u origin "$WORK"
            BODY=$(printf '%s\n' \
              "Automated forward-port of the security fix merged to \`main\` in #${PR_NUMBER} onto the \`${TARGET}\` channel branch." \
              "" \
              "Dependabot always raises **security** updates against the default branch (\`main\`) and GitHub offers no way to redirect them — \`dependabot.yml\`'s \`target-branch\` settings only steer *routine* updates. This PR carries the same fix to \`${TARGET}\` so the channel isn't left exposed. The channel's own CI validates it here before merge." \
              "" \
              "- Source PR: #${PR_NUMBER}" \
              "- Cherry-picked commit: \`${MERGE_SHA}\`" \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")
            gh pr create --repo "$REPO" --base "$TARGET" --head "$WORK" \
              --title "chore(security): forward-port #${PR_NUMBER} to ${TARGET} — ${PR_TITLE}" \
              --label "dependencies" --label "security" \
              --body "$BODY"
            echo "::notice::Opened forward-port PR: #$PR_NUMBER -> $TARGET"
          else
            git cherry-pick --abort || true
            # Idempotency: one tracking issue per (PR, target).
            MARKER="[forward-port] #${PR_NUMBER} -> ${TARGET}"
            if [ "$(gh issue list --repo "$REPO" --state open --search "in:title \"$MARKER\"" --json number --jq 'length')" != "0" ]; then
              echo "::notice::Tracking issue for $MARKER already open — skipping."
              exit 0
            fi
            BODY=$(printf '%s\n' \
              "The security fix merged to \`main\` in #${PR_NUMBER} could not be cleanly cherry-picked onto \`${TARGET}\` — the channel's lockfile/manifest has diverged and the cherry-pick conflicts." \
              "" \
              "Please forward-port it manually:" \
              "" \
              '```bash' \
              "git fetch origin ${TARGET} ${MERGE_SHA}" \
              "git checkout -B forward-port/security/pr-${PR_NUMBER}-to-${TARGET} origin/${TARGET}" \
              "git cherry-pick -x ${MERGE_SHA}" \
              "# resolve conflicts, then:" \
              "git push -u origin forward-port/security/pr-${PR_NUMBER}-to-${TARGET}" \
              "gh pr create --base ${TARGET} --label dependencies --label security --title \"chore(security): forward-port #${PR_NUMBER} to ${TARGET}\"" \
              '```' \
              "" \
              "- Source PR: #${PR_NUMBER}" \
              "- Commit: \`${MERGE_SHA}\`" \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")
            gh issue create --repo "$REPO" \
              --title "$MARKER: security fix needs manual forward-port" \
              --label "dependencies" --label "security" \
              --body "$BODY"
            echo "::warning::Conflict forward-porting #$PR_NUMBER to $TARGET — opened tracking issue."
          fi

  # ---------------------------------------------------------------------------
  # "Make a miss loud": a PR merged to `main`, changed a lockfile, and didn't
  # qualify for automatic forward-porting above (not Dependabot, no
  # `security` label, and no description naming a closed Dependabot pull
  # request whose lockfile changes it carries — or one of those could not be
  # checked, which the gate's log explains). Release-please PRs and routine
  # grouped updates are left out, because they cannot be security fixes;
  # see "WHEN NOTHING FORWARD-PORTS AUTOMATICALLY". That's usually fine
  # — most such PRs are ordinary dependency bumps with nothing security-
  # relevant about them — but if this one WAS a security fix, the channel
  # branches are exposed right now and nobody would otherwise be told. One
  # plain-English, idempotent comment on the PR itself is the notice; see
  # "WHEN NOTHING FORWARD-PORTS AUTOMATICALLY" at the top of this file.
  # ---------------------------------------------------------------------------
  flag-unported-lockfile-change:
    needs: gate
    if: >-
      github.event_name == 'push' &&
      needs.gate.outputs.proceed == 'true' &&
      needs.gate.outputs.should_forward_port == 'false' &&
      needs.gate.outputs.touched_lockfile == 'true' &&
      needs.gate.outputs.is_release_please == 'false' &&
      needs.gate.outputs.is_routine_grouped == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on the PR noting it wasn't forward-ported
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          MERGE_SHA: ${{ needs.gate.outputs.merge_sha }}
          REASON: ${{ needs.gate.outputs.forward_port_reason }}
        run: |
          set -euo pipefail

          # Idempotency: a marker HTML comment (invisible when rendered)
          # identifies our own past comments, so a re-run of this workflow
          # against the same PR — from a retry, or a manual workflow_dispatch
          # that happens to land here — never leaves a second copy.
          MARKER="<!-- forward-port-security: not-forward-ported notice -->"
          EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | length")
          if [ "$EXISTING" != "0" ]; then
            echo "::notice::Already left the not-forward-ported notice on #$PR_NUMBER — skipping."
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "$MARKER" \
            "This pull request changed \`package-lock.json\` and/or \`src-tauri/Cargo.lock\`, but it wasn't automatically copied onto the \`alpha\`, \`beta\`, or \`release-candidate\` branches." \
            "" \
            "That's fine for an ordinary dependency bump — most of them don't need to go anywhere else. This is just a heads-up in case this one was actually fixing a security advisory: if so, the channel branches are still exposed to it right now, and nobody would otherwise be told." \
            "" \
            "Why it wasn't forward-ported automatically: ${REASON}." \
            "" \
            "**If this was a security fix**, forward-port it by hand onto whichever of \`alpha\`/\`beta\`/\`release-candidate\` need it:" \
            "" \
            '```bash' \
            "git fetch origin <target> ${MERGE_SHA}" \
            "git checkout -B forward-port/security/pr-${PR_NUMBER}-to-<target> origin/<target>" \
            "git cherry-pick -x ${MERGE_SHA}" \
            "# resolve any conflicts, then:" \
            "git push -u origin forward-port/security/pr-${PR_NUMBER}-to-<target>" \
            "gh pr create --base <target> --label dependencies --label security --title \"chore(security): forward-port #${PR_NUMBER} to <target>\"" \
            '```' \
            "" \
            "(replace \`<target>\` with \`alpha\`, \`beta\`, or \`release-candidate\` as needed) — or let this workflow do it: \`gh workflow run \"Forward-port Security Fixes\" -f pr_number=${PR_NUMBER}\` (a manual run bypasses the author check)." \
            "" \
            "**If this wasn't a security fix**, there's nothing to do — this comment is informational only." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_")

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          echo "::notice::Left a not-forward-ported notice on #$PR_NUMBER."
