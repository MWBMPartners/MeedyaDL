# Alpha Release Workflow for MeedyaDL
# ===================================
#
# Triggered on every push to the `alpha` branch. Computes the next
# monotonic alpha counter, patches version manifests with
# `X.Y.Z-alpha.N`, commits the bump on `alpha`, then pushes a
# `vX.Y.Z-alpha.N` tag. The tag push triggers `release.yml`, which
# builds and publishes a pre-release.
#
# Counter semantics:
#   The `N` value never resets across base-version bumps. The workflow
#   queries every existing `v*-alpha.*` tag in the repository, extracts
#   the highest `N`, and uses `N+1`. Example progression:
#     v0.48.0-alpha.1  (first alpha for 0.48.0)
#     v0.48.0-alpha.2
#     v0.49.0-alpha.3  (base version bumps; counter does NOT reset)
#
# Concurrency: per-branch lock prevents two pushes from racing into
# the same counter value.
#
# Triggering: `push` events from human commits land here. The `alpha`
# branch is force-push-protected with no bypass actor — pushes are
# fast-forward only, just like `main`. Use a normal `git push origin alpha`
# from a maintainer's local checkout.

name: Alpha Release

on:
  push:
    branches: [alpha]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run version bump locally but skip the tag push'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  alpha:
    name: Build alpha tag
    runs-on: ubuntu-latest
    # Anti-recursion guard: skip the workflow when the head commit is the
    # `chore(alpha): X.Y.Z-alpha.N` version-bump that this very job pushed
    # in the final step — otherwise the workflow would loop on its own push.
    #
    # We guard on the commit *subject* (not on `github.actor`) because the
    # push uses `RELEASE_PAT`, which attributes the bot's push to the PAT
    # owner (a human account). An actor-based check would let the recursion
    # through. A subject-prefix check is reliable because the bump commit's
    # message is generated by this workflow and always starts with the same
    # `chore(alpha):` prefix.
    #
    # `workflow_dispatch` always proceeds so maintainers can force a build
    # via the GitHub UI / CLI regardless of what the head commit looks like.
    #
    # The previous mechanism — `[skip ci]` in the bump commit message —
    # successfully suppressed self-recursion BUT also silently suppressed
    # `release.yml` from auto-triggering on the resulting tag push
    # (GitHub's skip-ci rule applies to every workflow whose dispatch
    # event has `[skip ci]` in the head commit, including the tag push).
    # The job-level `if:` here only gates *this* workflow, leaving every
    # other workflow free to receive the tag push event as normal.
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(alpha):')
    steps:
      - name: Checkout alpha
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: alpha
          fetch-depth: 0
          # RELEASE_PAT is required so the tag push triggers release.yml.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next alpha version
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Strip any pre-release suffix so the base version is canonical.
          BASE=$(node -p "require('./package.json').version")
          BASE="${BASE%%-*}"
          # Query every alpha tag across all base versions and pick max+1.
          # Falls back to 0 if no alpha tags exist yet.
          MAX=$(gh api "repos/$REPO/tags" --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$' \
            | sed -E 's/.*-alpha\.([0-9]+)$/\1/' \
            | sort -n | tail -1 || echo 0)
          MAX="${MAX:-0}"
          NEXT=$((MAX + 1))
          VERSION="${BASE}-alpha.${NEXT}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "counter=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch version in manifests
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const v = process.env.NEW_VERSION;
            for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(readFileSync(p, 'utf8'));
              j.version = v;
              writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "
          python3 - <<PY
          import re, pathlib, os
          p = pathlib.Path('src-tauri/Cargo.toml')
          t = p.read_text()
          t = re.sub(r'(?m)^version\s*=\s*"[^"]*"', f'version = "{os.environ["NEW_VERSION"]}"', t, count=1)
          p.write_text(t)
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Regenerate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit version bump
        run: |
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          # No `[skip ci]` — the anti-recursion guard for the bump push lives
          # at the job's `if:` (commit-subject prefix check). The bump must
          # NOT carry `[skip ci]` because the tag we push immediately after
          # points at this commit, and GitHub's skip-ci rule applies to ALL
          # workflows triggered by an event whose head commit contains the
          # marker — including `release.yml` on the tag push. See the
          # job-level `if:` comment above for the full incident write-up.
          git commit -m "chore(alpha): ${{ steps.version.outputs.version }}"

      - name: Push alpha branch and tag (with rebase-on-conflict retry)
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # Fast-forward push of the version-bump commit. The branch
          # ruleset blocks non-fast-forward pushes; we never overwrite
          # history here.
          #
          # Rebase-retry loop (added after the 2026-06-07 incident
          # where two PRs merged 9 seconds apart and the second
          # workflow run won the race for `alpha`; the first run's
          # push was rejected as "failed to push some refs" against
          # a tip that had moved). The concurrency group at the top
          # of the file SHOULD queue same-group runs, but in practice
          # GitHub Actions occasionally schedules both rather than
          # serialising. The defence here is per-push: refetch alpha,
          # rebase the bump commit onto its new tip, and retry the
          # push. The tag annotation already encodes the version
          # number from `steps.version`, so the tag itself doesn't
          # move — only the commit it points at gets rebased.
          MAX_RETRIES=5
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            if git push origin alpha; then
              echo "::notice::Pushed alpha branch on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "::error::git push origin alpha failed after $MAX_RETRIES attempts; another concurrent merge keeps winning the race"
              exit 1
            fi
            # Random 0–4 second jitter so two contending runs don't
            # both retry at the same instant.
            JITTER=$((RANDOM % 5))
            echo "::warning::git push origin alpha rejected on attempt $attempt; refetching + rebasing + retrying in ${JITTER}s"
            sleep "$JITTER"
            git fetch origin alpha
            # The bump commit is the single commit we authored; rebase
            # it onto the now-current tip. The rebase is autostash-safe
            # because we have no uncommitted changes at this point.
            git rebase --rebase-merges FETCH_HEAD
          done
          # Re-create the tag against the (possibly rebased) HEAD so
          # it points at the actually-pushed commit, then push it.
          # If a previous attempt created the tag locally against the
          # old HEAD, drop it first.
          git tag -d "${{ steps.version.outputs.tag }}" 2>/dev/null || true
          git tag -a "${{ steps.version.outputs.tag }}" -m "Alpha ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Alpha Build"
            echo ""
            echo "- **Tag:** \`${{ steps.version.outputs.tag }}\`"
            echo "- **Channel:** alpha"
            echo "- **Counter:** ${{ steps.version.outputs.counter }}"
            echo "- **Base version:** ${{ steps.version.outputs.base }}"
          } >> "$GITHUB_STEP_SUMMARY"
