# Monthly Release Workflow for MeedyaDL
# =====================================
#
# Scheduled monthly at 00:00 UTC on the 1st of each month. Merges all `feat/*` branches into `monthly`,
# bumps the version to `X.Y.Z-monthly.YYYYMMDD`, creates a tag, and pushes it
# to trigger the existing `release.yml` build pipeline.
#
# Pipeline:
#   1. Reset `monthly` to `main`
#   2. Merge every `feat/*` branch (skip conflicting ones, open an issue)
#   3. Compute version suffix from current base version + UTC date
#   4. Patch package.json, tauri.conf.json, Cargo.toml, regenerate Cargo.lock
#   5. Commit the version bump on `monthly`
#   6. Push `monthly` (force-with-lease) and the new tag
#
# The tag push is what triggers release.yml; the branch push keeps `monthly`
# tracking the integrated state so contributors can check out what was built.

name: Monthly Release

on:
  # Cron schedule disabled 2026-05-10 per project decision — see the
  # weekly-release.yml note for rationale. Workflow remains available
  # for `workflow_dispatch` if a one-off monthly cut is wanted.
  # To re-enable the cron, uncomment the schedule block below.
  #
  # schedule:
  #   # 00:00 UTC on the 1st of each month
  #   - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build merge + version locally but skip tag/push'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: monthly-release
  cancel-in-progress: false

jobs:
  monthly:
    name: Build monthly tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          # RELEASE_PAT is required so the tag push later triggers release.yml.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reset monthly branch to main
        run: |
          # Start fresh from main every run so merged/dropped feat branches
          # don't accumulate stale conflicts on monthly.
          git checkout -B monthly origin/main

      - name: Merge feat/* branches
        id: merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          # List remote feat/* branches, newest commit first.
          mapfile -t FEAT_REFS < <(
            git for-each-ref \
              --sort=-committerdate \
              --format='%(refname:short)' \
              'refs/remotes/origin/feat/*'
          )

          MERGED=()
          CONFLICTED=()

          for REF in "${FEAT_REFS[@]}"; do
            BRANCH="${REF#origin/}"
            echo "::group::Merging $BRANCH"
            if git merge --no-ff --no-edit "$REF" -m "chore(monthly): merge $BRANCH"; then
              MERGED+=("$BRANCH")
              echo "Merged $BRANCH"
            else
              echo "::warning::Conflict while merging $BRANCH — aborting merge"
              git merge --abort || true
              CONFLICTED+=("$BRANCH")
            fi
            echo "::endgroup::"
          done

          {
            echo "merged<<EOF"
            printf '%s\n' "${MERGED[@]}"
            echo "EOF"
            echo "conflicted<<EOF"
            printf '%s\n' "${CONFLICTED[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue for conflicting branches
        if: steps.merge.outputs.conflicted != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          TITLE="Monthly $DATE: merge conflicts on feat/* branches"
          BODY=$(cat <<'MD'
          One or more `feat/*` branches could not be merged cleanly into `monthly` during the automated monthly build.
          These branches were skipped for this run and will be retried on the next monthly.

          **Conflicting branches:**
          MD
          )
          BODY="$BODY"$'\n\n'"$(printf -- '- %s\n' $CONFLICTED)"
          # Only open one issue per day
          EXISTING=$(gh issue list --state open --search "in:title \"Monthly $DATE\"" --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY" --label monthly-conflict || true
          fi

      - name: Compute monthly version
        id: version
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version")
          # Strip any pre-release suffix from the base version so we always
          # anchor to the last stable X.Y.Z before appending -monthly.DATE.
          BASE="${BASE%%-*}"
          DATE=$(date -u +%Y%m%d)
          VERSION="${BASE}-monthly.${DATE}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=monthly" >> "$GITHUB_OUTPUT"

      - name: Patch version in manifests
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const v = process.env.NEW_VERSION;
            for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(readFileSync(p, 'utf8'));
              j.version = v;
              writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "
          # Cargo.toml — single-line version bump in [package]
          python3 - <<PY
          import re, pathlib
          p = pathlib.Path('src-tauri/Cargo.toml')
          t = p.read_text()
          t = re.sub(r'(?m)^version\s*=\s*"[^"]*"', f'version = "{"${NEW_VERSION}"}"', t, count=1)
          p.write_text(t)
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Regenerate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit version bump
        run: |
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(monthly): ${{ steps.version.outputs.version }}"

      - name: Push monthly branch and tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git push --force-with-lease origin monthly
          git tag -a "${{ steps.version.outputs.tag }}" -m "Monthly ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Monthly Build"
            echo ""
            echo "- **Tag:** \`${{ steps.version.outputs.tag }}\`"
            echo "- **Channel:** monthly"
            echo "- **Merged feat branches:**"
            echo '```'
            echo "${{ steps.merge.outputs.merged }}"
            echo '```'
            if [ -n "${{ steps.merge.outputs.conflicted }}" ]; then
              echo "- **Skipped (conflicts):**"
              echo '```'
              echo "${{ steps.merge.outputs.conflicted }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
