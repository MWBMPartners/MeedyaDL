#
# Auto-Delete Merged Branches
# ===========================
#
# Deletes the head branch of a merged pull request, unless that branch is in
# the protected-channel allowlist. This is a complement to the repo setting
# "Automatically delete head branches": the setting deletes every merged PR
# head branch unconditionally, which is usually what we want for `feat/*`
# and `fix/*` branches but is wrong for cross-channel merges (e.g., merging
# `release-candidate` into `beta` should NOT delete `release-candidate`).
#
# Note: the cron-driven nightly/weekly/monthly channels were removed in
# v1.11.0 along with their branches. The remaining protected channel set
# is just the active long-lived branches (main / alpha / beta / rc).
#
# The `protected-stable-branches` ruleset (applied via
# apply-branch-rulesets.yml) provides the hard guarantee — GitHub will
# reject the DELETE call on protected branches. This workflow's allowlist
# is the soft guardrail that avoids even attempting the delete and keeps
# the Actions log clean.
#
# Keep this workflow aligned with .github/rulesets/protected-stable-branches.json
# -- the same file the "Delete head branch unless protected" step's case
# statement names further down. Pointed at by NAME, not by line number, on
# purpose: a line number in a comment goes stale the moment anyone edits a
# line above it, which is exactly how this comment went wrong before (it
# used to say "line 56 below" -- correct when it was written, wrong the
# first time a line was inserted above it, and nothing would ever have
# flagged that drift).
#
# This comment used to name a different file, protected-release-branches.json.
# That file DID exist once -- added in 4419efb8 and removed in 5d80f8d0,
# when the branch rules were split and renamed -- so the old wording was
# out of date, not invented. Fixed 2026-09-23, after check_comment_paths.py
# was extended to read workflow files.
#
# Corrected again 2026-09-24: the first fix said the old name "was never
# the real name", and its commit message (c3dee4e7) said "no such file has
# ever existed". Both of those claims were wrong, found by the batch-4
# review. A pushed commit message cannot be edited, so the correction lives
# here instead.

name: Auto-Delete Merged Branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch unless protected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          # Skip cross-repo PRs (forks) — we can't delete branches we don't own.
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Skipping: head branch is on a fork ($HEAD_REPO)"
            exit 0
          fi

          # Protected branches that must never be auto-deleted. Keep in sync
          # with .github/rulesets/protected-stable-branches.json (no bypass).
          # The cron channels (nightly/weekly/monthly) were removed in
          # v1.11.0; their ruleset file (protected-cron-channels.json) is
          # also deleted in that PR.
          case "$HEAD_REF" in
            main|release-candidate|beta|alpha)
              echo "Skipping: '$HEAD_REF' is a protected release channel"
              exit 0
              ;;
          esac

          echo "Deleting merged branch: $HEAD_REF"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" || {
            # A 422 here usually means the branch was already deleted
            # (e.g., the repo-wide auto-delete setting beat us to it).
            echo "Branch may already be deleted — continuing"
          }
