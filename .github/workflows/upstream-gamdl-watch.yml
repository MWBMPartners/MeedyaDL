#
# Upstream GAMDL release watcher
# ================================
#
# Daily cron job that compares the latest GAMDL release on PyPI against the
# `maximum_tested_version` declared in `src-tauri/tool-versions.toml`. When
# PyPI ships a release beyond our validated ceiling, the workflow opens (or
# updates) a GitHub Issue labelled `upstream-bump` so we can triage the
# change before users hit it.
#
# The support window is intentionally client-side (see #518):
#
#   * `install_gamdl()` pins to `gamdl>=min,<=max`, so first-time setup
#     never pulls an untested release.
#   * `update_checker::is_gamdl_compatible` suppresses the update banner
#     when PyPI advertises a version above the ceiling.
#
# Both of those protect users, but without this watcher we have no signal
# that upstream moved — the first indicator would be a crash-report ticket
# weeks later. That's exactly what bit us on 2026-04-21 when GAMDL v3.0
# shipped with a breaking CLI change (see #516).
#
# To run manually: `gh workflow run "Upstream GAMDL Watch" --ref main`
# Related issues: #516, #518, #520

name: Upstream GAMDL Watch

on:
  schedule:
    # Run daily at 06:00 UTC. Daily cadence catches GAMDL same-day point
    # releases (the project has shipped multiple within 24 h of each other
    # — see the 2026-04 v3.4 + v3.5 same-day pair, the 2026-05 v3.7.2 +
    # v3.7.3 same-day pair, etc.). The earlier weekly cadence let those
    # collapse into one ticket, but a daily run means each release gets
    # its own audit window before the next one lands and the open ticket
    # is harder to triage.
    #
    # 06:00 UTC = 06:00 GMT / 07:00 BST / 02:00 EST / 23:00 PST previous
    # day / 15:00 JST. Chosen as a quiet window across global maintainer
    # time zones, far from typical CI rush hours.
    #
    # Same cadence is mirrored to the votify upstream watcher landing in
    # PR M9-1 (#101) and every future engine watcher — one daily window,
    # all engines polled.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print diagnostics without creating/updating issues'
        required: false
        default: 'false'
        type: boolean

permissions:
  # `contents: read` for the checkout, `issues: write` to create / update the
  # triage ticket. No other scopes needed — we deliberately avoid `pull-requests`
  # so a compromised workflow run can't open unreviewed PRs.
  contents: read
  issues: write

jobs:
  watch:
    name: Poll PyPI for GAMDL ceiling breaches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          # 3.11+ ships `tomllib` in the stdlib — no extra install step needed.
          python-version: '3.12'

      - name: Detect PyPI drift
        id: detect
        # Environment-based inputs prevent shell injection from workflow
        # dispatch parameters — the `dry_run` flag is passed via `env:` rather
        # than interpolated into the shell.
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python <<'PY'
          """Compare PyPI's latest GAMDL release against our support ceiling.

          Writes three outputs to $GITHUB_OUTPUT for the downstream step:
            * `ceiling` — the maximum_tested_version from tool-versions.toml
            * `latest`  — the info.version from PyPI
            * `breach`  — "true" if latest > ceiling, else "false"

          Additionally writes a markdown summary to $GITHUB_STEP_SUMMARY so
          the workflow page is useful even when no issue is opened.
          """
          import json
          import os
          import pathlib
          import sys
          import tomllib
          import urllib.request


          def parse_semver(value: str) -> tuple[int, int, int]:
              """Parse "X.Y" or "X.Y.Z" into a comparable (major, minor, patch)
              tuple. Unparseable components default to 0 so the comparison
              fails safely (every real release beats a garbage ceiling).
              """
              parts = value.split(".")
              def _part(i: int) -> int:
                  try:
                      return int(parts[i])
                  except (IndexError, ValueError):
                      return 0
              return _part(0), _part(1), _part(2)


          def emit(name: str, value: str) -> None:
              """Append a key=value pair to $GITHUB_OUTPUT so subsequent
              workflow steps can read it via `steps.<id>.outputs.<name>`.
              """
              output_path = os.environ.get("GITHUB_OUTPUT")
              if output_path:
                  with open(output_path, "a", encoding="utf-8") as fh:
                      fh.write(f"{name}={value}\n")


          def summary(markdown: str) -> None:
              """Append to the job summary. Used for the 'this job ran but
              didn't need to do anything' path so the workflow page is
              still informative when ceiling == latest.
              """
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as fh:
                      fh.write(markdown + "\n")


          # ── 1. Read the ceiling from tool-versions.toml ─────────────
          toml_path = pathlib.Path("src-tauri/tool-versions.toml")
          try:
              with toml_path.open("rb") as fh:
                  config = tomllib.load(fh)
              ceiling = config["gamdl"]["maximum_tested_version"]
              minimum = config["gamdl"]["minimum_version"]
              recommended = config["gamdl"]["recommended_version"]
          except (FileNotFoundError, KeyError) as exc:
              # Fail loud — this file is the single source of truth and a
              # parse error here means CI is misconfigured, not that we
              # should silently skip the check.
              print(f"::error::Failed to read tool-versions.toml [gamdl]: {exc}")
              sys.exit(1)

          # ── 2. Query PyPI for the latest GAMDL release ──────────────
          pypi_url = "https://pypi.org/pypi/gamdl/json"
          try:
              with urllib.request.urlopen(pypi_url, timeout=15) as resp:
                  payload = json.load(resp)
              latest = payload["info"]["version"]
          except Exception as exc:  # noqa: BLE001 — any failure here is fatal
              # Deliberately broad: PyPI flakes, TLS issues, malformed JSON.
              # A missed week is cheap; a silent hang is expensive.
              print(f"::error::Failed to query PyPI for gamdl: {exc}")
              sys.exit(1)

          breach = parse_semver(latest) > parse_semver(ceiling)

          print(f"Ceiling (from tool-versions.toml): {ceiling}")
          print(f"Minimum (from tool-versions.toml): {minimum}")
          print(f"Recommended (from tool-versions.toml): {recommended}")
          print(f"Latest (from PyPI): {latest}")
          print(f"Breach: {breach}")

          emit("ceiling", ceiling)
          emit("minimum", minimum)
          emit("recommended", recommended)
          emit("latest", latest)
          emit("breach", "true" if breach else "false")

          # Step summary — runs every time, not just on breach.
          summary(
              "## GAMDL support window\n"
              f"- Minimum supported: `{minimum}`\n"
              f"- Maximum tested: `{ceiling}`\n"
              f"- Recommended: `{recommended}`\n"
              f"- Latest on PyPI: `{latest}`\n"
              f"- **Breach**: {'YES' if breach else 'no'}\n"
          )
          PY

      - name: Report breach status
        if: steps.detect.outputs.breach == 'false'
        run: |
          echo "::notice::GAMDL ${{ steps.detect.outputs.latest }} is within the supported ceiling (${{ steps.detect.outputs.ceiling }}) — no action required."

      - name: Open or update tracking issue
        if: steps.detect.outputs.breach == 'true' && github.event.inputs.dry_run != 'true'
        # Using the REST API via the pre-installed `gh` CLI. We search for an
        # existing open issue with a well-known title pattern and update it
        # rather than spamming fresh issues every day — the daily cron
        # would otherwise create 365 duplicates in a year where upstream
        # sits above the ceiling. The "update existing" path is now
        # load-bearing rather than belt-and-braces: with the post-#919
        # daily cadence, a stale audit ticket would be touched 7× more
        # often than under the previous weekly schedule.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CEILING: ${{ steps.detect.outputs.ceiling }}
          MINIMUM: ${{ steps.detect.outputs.minimum }}
          RECOMMENDED: ${{ steps.detect.outputs.recommended }}
          LATEST: ${{ steps.detect.outputs.latest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TITLE="upstream: GAMDL ${LATEST} is beyond MeedyaDL's tested ceiling (${CEILING})"

          # Ensure the `upstream-bump` label exists. Creating labels is
          # idempotent enough via `gh label create --force`, which updates
          # colour/description rather than erroring when the label is
          # already present. Without this step, fresh forks / repos that
          # don't ship the label would fail the issue-create call below.
          gh label create "upstream-bump" \
            --repo "$REPO" \
            --color "fbca04" \
            --description "Upstream dependency has shipped a release outside MeedyaDL's tested range" \
            --force

          # Find an existing open ticket for this exact (LATEST, CEILING)
          # pair. We fetch all open upstream-bump tickets and filter by
          # title client-side to avoid escaping issues with the search
          # API's quoting rules (titles contain parens, colons, and
          # semver dots — all of which confuse the query parser).
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --label "upstream-bump" \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -n1)

          # Template body — quoted heredoc so $VARS are not expanded by the
          # shell; we use envsubst below to do the substitution safely.
          BODY=$(cat <<'EOF'
          PyPI has advertised a newer GAMDL release than the `maximum_tested_version` baked into this MeedyaDL build.

          | Field | Value |
          | --- | --- |
          | PyPI latest | `${LATEST}` |
          | MeedyaDL ceiling | `${CEILING}` |
          | MeedyaDL recommended | `${RECOMMENDED}` |
          | MeedyaDL floor | `${MINIMUM}` |

          Users are already protected: `install_gamdl()` pins the installer to `gamdl>=${MINIMUM},<=${CEILING}` and the in-app update banner filters by `is_gamdl_compatible` (see #518). This ticket exists so we can decide whether to validate the new release and bump the ceiling, or ship a fix first.

          ## Triage checklist

          - [ ] Review the [GAMDL ${LATEST} release notes](https://github.com/glomatico/gamdl/releases/tag/${LATEST}) — are any CLI flags removed, renamed, or defaults changed?
          - [ ] Check [upstream commits since v${CEILING}](https://github.com/glomatico/gamdl/compare/${CEILING}...main) for structural refactors (logging, output format, downloader module).
          - [ ] Install GAMDL ${LATEST} locally via `pip install --upgrade 'gamdl==${LATEST}'` and run MeedyaDL's test suite plus a live download smoke test.
          - [ ] If safe: bump `maximum_tested_version` (and `recommended_version`) in `src-tauri/tool-versions.toml` and ship a new MeedyaDL release.
          - [ ] If not safe: add capability gates for any new breaking changes (see `services/gamdl_capabilities.rs` for the pattern) before bumping.

          ## Context

          - Part of the long-running tracking issue #516.
          - Support window design: #518.
          - This workflow: `.github/workflows/upstream-gamdl-watch.yml`. Runs daily at 06:00 UTC.

          ---

          _This ticket is opened and updated automatically by the upstream watcher. When you close it (manually or by merging a ceiling bump), the workflow will open a fresh ticket next time PyPI advertises yet another release above the new ceiling._
          EOF
          )
          # Expand ${VARS} against the explicit allowlist — envsubst without
          # an arg list would also expand any dollar sign inside the body.
          BODY_RENDERED=$(printf "%s" "$BODY" | envsubst '${LATEST} ${CEILING} ${RECOMMENDED} ${MINIMUM}')

          if [ -n "${EXISTING:-}" ]; then
            echo "Updating existing issue #${EXISTING}"
            gh issue edit "$EXISTING" \
              --repo "$REPO" \
              --body "$BODY_RENDERED"
            gh issue comment "$EXISTING" \
              --repo "$REPO" \
              --body "Re-checked at $(date -u +"%Y-%m-%dT%H:%M:%SZ") — still open because GAMDL ${LATEST} is above the ceiling (${CEILING})."
          else
            echo "No existing ticket for ${TITLE} — creating one"
            gh issue create \
              --repo "$REPO" \
              --title "$TITLE" \
              --label "upstream-bump" \
              --body "$BODY_RENDERED"
          fi

      - name: Dry-run summary
        if: steps.detect.outputs.breach == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run: would open/update issue for GAMDL ${{ steps.detect.outputs.latest }} vs ceiling ${{ steps.detect.outputs.ceiling }}"
