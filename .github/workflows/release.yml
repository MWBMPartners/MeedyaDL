# Release Build Workflow for MeedyaDL
# ======================================
#
# This GitHub Actions workflow builds platform-specific installers and publishes
# them as a draft GitHub Release. It is triggered when a version tag is pushed.
#
# Trigger: Push a tag matching 'v*' (e.g., git tag v0.1.0 && git push --tags)
#   - Semver tags:    v0.1.0, v1.0.0, v2.3.4
#   - Pre-release:    v1.0.0-alpha.1, v1.0.0-beta.2, v1.0.0-rc.1
#
# Build matrix (7 platform builds run in parallel):
#   Tier 1 — Stable (native or straightforward cross-compilation):
#     1. macOS Apple Silicon (aarch64-apple-darwin)
#        --> Produces: .dmg (disk image), .app (app bundle)
#     2. Windows x64 (x86_64-pc-windows-msvc)
#        --> Produces: .exe (NSIS installer)
#     3. Windows ARM64 (aarch64-pc-windows-msvc) — cross-compiled from x64
#        --> Produces: .exe (NSIS installer)
#     4. Linux x64 (native architecture)
#        --> Produces: .deb (Debian package), .AppImage (portable)
#
#   Note: Windows x86 (32-bit) is no longer built because Windows 11 is 64-bit
#   only and Windows 10 32-bit usage is under 1%. The x64 installer also works
#   on ARM64 devices via Windows' built-in x64 emulation layer, so ARM64 users
#   who prefer the emulated version can use the x64 installer directly.
#   WiX .msi installers are not produced because NSIS .exe is more capable,
#   is the only format that supports ARM64, and reduces artifact clutter.
#
#   Tier 2 — Experimental (Linux ARM cross-compilation):
#     6. Linux ARM64 (aarch64-unknown-linux-gnu) — for ARM servers and Pi 4/5 (64-bit)
#        --> Produces: .deb
#     7. Linux ARMv7 (armv7-unknown-linux-gnueabihf) — for Raspberry Pi (32-bit)
#        --> Produces: .deb
#
# For most platforms, tauri-apps/tauri-action handles the entire build and upload pipeline:
#   1. Builds the frontend (npm run build --> vite build)
#   2. Compiles the Rust backend in release mode (cargo build --release --target ...)
#   3. Packages the binary into platform-specific installers
#   4. Creates a GitHub Release (or updates an existing draft) and uploads the artifacts
#
# For ARMv7, tauri-action is skipped entirely because it cannot handle Debian's
# 'armhf' naming convention. Instead, `npx tauri build` runs directly and a
# manual upload step renames and publishes the artifacts.
#
# The release is created as a DRAFT so maintainers can review release notes
# and artifacts before making it public.
#
# Related config files:
#   - src-tauri/tauri.conf.json -- Bundle configuration (icon, copyright, description, platform settings)
#   - src-tauri/Cargo.toml      -- Rust dependencies and package metadata
#   - cliff.toml                -- Changelog config (referenced in release notes)
#   - .github/workflows/changelog.yml -- Keeps CHANGELOG.md up to date
#   - .github/workflows/version-bump.yml -- Automated version bump that triggers this workflow
#
# @see https://docs.github.com/en/actions -- GitHub Actions documentation
# @see https://github.com/tauri-apps/tauri-action -- Tauri GitHub Action (handles build + release upload)
# @see https://v2.tauri.app/distribute/ -- Tauri distribution guide

# Workflow display name in the GitHub Actions UI
name: Release

# ============================================================
# Trigger: Run only when a version tag is pushed
# ============================================================
# The 'v*' pattern matches tags like v0.1.0, v1.0.0-beta.1, etc.
# This workflow does NOT run on regular pushes or pull requests.
# @see https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#push
on:
  push:
    tags:
      - 'v*'
  # Allow manual trigger for re-running builds when tag push events are missed
  # (e.g., after billing blocks or tag re-pushes). Usage:
  #   gh workflow run "Release" -f tag=v0.3.1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and release (e.g., v0.3.1)'
        required: true
      bundle_engines:
        description: 'Bundle engines (offline installer) — include Python, GAMDL, votify, and all tools (~300MB). Default: false (tiny installer, engines downloaded on first launch).'
        type: boolean
        default: false

# Concurrency guard — #944.
#
# `release.yml` is the only long-running workflow without a concurrency
# group, leaving tag-push + workflow_dispatch recovery dispatches free
# to race for the same tag. When that happens, both runs upload to the
# same artifact name (one fails), both call the per-platform
# "Release in progress…" placeholder (the wrong one wins the final
# Release body), and both race to flip the prerelease flag. The
# downstream symptom is the half-built release object documented in
# CLAUDE.md's "Release pipeline gotchas" section.
#
# `inputs.tag` covers the workflow_dispatch case (explicit tag input);
# `github.ref` covers the normal push-trigger case (the tag ref). They
# never collide because the tag ref and the dispatch input always
# resolve to the same logical tag when both target the same tag.
#
# `cancel-in-progress: false` is intentional — we want a second
# invocation for the SAME tag to QUEUE behind the first rather than
# cancel it. A half-built release object is strictly worse than waiting
# the ~10 minutes for the in-flight run to settle.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Ensure the GitHub Release exists with proper notes (#857)
  # ============================================================
  #
  # Runs ONCE before the build matrix. Resolves the tag + derives
  # the prerelease flag, then either:
  #   (a) confirms a release already exists for this tag (no-op),
  #   or
  #   (b) creates the release with proper notes content.
  #
  # By centralising the `gh release create` call here, the matrix
  # jobs never have to race to create the release object — they
  # just upload assets against the already-created release.
  #
  # The notes content is sourced via a 3-tier fallback:
  #
  #   1. **Pre-staged file** at `.github/release-notes/<tag>.md`.
  #      Used when the maintainer wants full control of what the
  #      end-user sees (e.g., a manual stable cut or a release
  #      that needs a specific narrative).
  #
  #   2. **git-cliff diff** between the previous tag of the same
  #      channel and this tag. Auto-generates a Markdown changelog
  #      from conventional-commit subjects. Falls back gracefully
  #      if git-cliff isn't installable on the runner.
  #
  #   3. **"See CHANGELOG.md"** stub linking to the repo's
  #      maintained CHANGELOG.md. Always works, never empty.
  #
  # NEVER emits the legacy "Release in progress…" placeholder —
  # the verification step in `finalize-release` already catches
  # that string in the body, but consolidating creation here means
  # the verification has nothing to flag.
  ensure-release:
    name: Ensure Release Exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      is_prerelease: ${{ steps.derive.outputs.is_prerelease }}
      gh_flag: ${{ steps.derive.outputs.gh_flag }}
    steps:
      - name: Checkout (full history for git-cliff)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Derive tag + prerelease flag
        id: derive
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Resolve the tag the same way the publish matrix does
          # below — `inputs.tag` wins on workflow_dispatch, else the
          # tag-push ref name.
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          # Shape-validate before the tag flows into the ~9 downstream
          # expression-interpolated run: shells (#977). A workflow_dispatch
          # actor could otherwise inject shell metacharacters via inputs.tag
          # and exfiltrate the code-signing secrets. Accept only vX.Y.Z with an
          # optional semver-legal pre-release suffix — no spaces/semicolons/etc.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag format: '$TAG' (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Prerelease flag derives from the tag suffix.
          STRIPPED="${TAG#v}"
          if [[ "$STRIPPED" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "gh_flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "gh_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install git-cliff (best-effort)
        shell: bash
        continue-on-error: true
        run: |
          # git-cliff is the secondary release-notes source (#857
          # item 3 tier 2). Install via cargo binstall for speed;
          # if binstall isn't on the runner, fall back to a plain
          # cargo install. continue-on-error so a binstall outage
          # doesn't block the release — the tier-3 fallback covers
          # the no-git-cliff case.
          if ! command -v git-cliff &>/dev/null; then
            # Pinned versions (#988) — no `releases/latest` / unversioned
            # installs in a contents:write job that holds release secrets.
            # Bump these deliberately when upgrading the toolchain.
            BINSTALL_VERSION="1.21.0"
            GITCLIFF_VERSION="2.13.1"
            curl -fsSL "https://github.com/cargo-bins/cargo-binstall/releases/download/v${BINSTALL_VERSION}/cargo-binstall-x86_64-unknown-linux-musl.tgz" \
              | tar -xz -C /usr/local/bin/ 2>/dev/null || true
            if command -v cargo-binstall &>/dev/null; then
              cargo-binstall --no-confirm "git-cliff@${GITCLIFF_VERSION}" || true
            else
              cargo install --locked git-cliff --version "${GITCLIFF_VERSION}" || true
            fi
          fi
          git-cliff --version 2>/dev/null || echo "::warning::git-cliff unavailable; release notes will use the static fallback"

      - name: Create release if missing (with proper notes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.derive.outputs.tag }}"
          GH_FLAG="${{ steps.derive.outputs.gh_flag }}"
          STRIPPED="${TAG#v}"
          NOTES_FILE=".github/release-notes/${TAG}.md"

          # SELF_HEAL=1 means: the release already exists, has no tier-1
          # curated file, and its live body looks like commit-speak /
          # bare version-bump noise (#1046). We fall through to the same
          # tier-2 generation used for a brand-new release, then splice
          # the regenerated notes onto the existing body at the very end
          # (preserving the "Choose your download" footer if the platform
          # builds already appended it) instead of `gh release create`.
          SELF_HEAL=0
          LIVE_BODY_FILE="$RUNNER_TEMP/live-body-${TAG}.md"

          # If the release already exists (release-please-action / version-bump.yml
          # pre-create it, #645), we can't re-create it — but a curated tier-1 ELI5
          # notes file (#1028) should still WIN over the commit-speak body those
          # tools set. Apply it (footer-preserving + idempotent) and exit. This is
          # the mechanism that makes stable release notes user-friendly, and makes
          # committed backfill notes self-heal if a build re-runs.
          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            if [ -f "$NOTES_FILE" ]; then
              echo "::notice::Release $TAG exists; applying curated tier-1 notes (overwrite, footer-preserving)"
              bash scripts/release-notes/apply-notes.sh "$TAG" "$REPO"
              exit 0
            fi

            # No tier-1 file staged. PRERELEASES self-heal (#1046): detect
            # whether the live body is commit-speak / bare bump noise (e.g.
            # cut from a tree that predates #1027, or created by a stale
            # workflow re-run) and, if so, regenerate + splice instead of
            # leaving it broken forever. STABLES are never auto-rewritten
            # here — they always require an explicit curated file so a
            # maintainer signs off on stable release copy (see the
            # ::error below, unchanged from before).
            if [[ "$STRIPPED" == *-* ]]; then
              gh release view "$TAG" --repo "$REPO" --json body --jq '.body' \
                > "$LIVE_BODY_FILE" 2>/dev/null || echo "" > "$LIVE_BODY_FILE"
              if python3 scripts/release-notes/detect-commit-speak.py < "$LIVE_BODY_FILE"; then
                echo "::notice::Release $TAG exists with a commit-speak/bare body — regenerating ELI5 notes and self-healing (#1046)"
                SELF_HEAL=1
              else
                echo "::notice::Release $TAG already exists with an ELI5-formatted body; leaving untouched"
                exit 0
              fi
            else
              echo "::notice::Release $TAG already exists and no tier-1 notes staged; leaving body untouched"
              echo "::error::Stable $TAG has no .github/release-notes/${TAG}.md — its body may be release-please commit-speak. Stage the file on main, then run: bash scripts/release-notes/apply-notes.sh $TAG"
              exit 0
            fi
          fi

          # Tier 1: pre-staged release notes file (create path).
          if [ -f "$NOTES_FILE" ]; then
            echo "::notice::Using pre-staged release notes from $NOTES_FILE"
            NOTES_PATH="$NOTES_FILE"
          else
            # Tier 2: git-cliff diff between this tag and the previous
            # tag of the same channel for the same base version.
            # Strip the trailing `.N` from prerelease suffixes
            # (`v1.11.0-alpha.19` → channel `alpha`, base `1.11.0`) so
            # we can find the previous tag in the same channel on the
            # same base version.
            #
            # The earlier implementation searched `v*-alpha.*` which
            # would semver-rank historic abandoned alphas (e.g.
            # `v2.0.0-alpha.8` from 2025) above current alphas (e.g.
            # `v1.11.0-alpha.19`), producing a months-of-commits
            # changelog that blew through GitHub's 125 000-char body
            # limit and failed the create-release API call. Constraining
            # to the same base version keeps the range bounded.
            #
            # Fallback (e.g. when this is the FIRST alpha on a new base
            # like `v1.11.0-alpha.18` after the `v1.10.0` → `v1.11.0`
            # bump): use the matching channel on any LOWER base version
            # whose tag sorts immediately below this one.
            if [[ "$STRIPPED" == *-* ]]; then
              CHANNEL_SUFFIX=$(echo "$STRIPPED" | sed -E 's/.*-([a-z]+)\..*/\1/')
              BASE_VERSION=$(echo "$STRIPPED" | sed -E 's/-.*//')
              PREV_TAG=$(git tag --sort=-version:refname --list "v${BASE_VERSION}-${CHANNEL_SUFFIX}.*" | grep -v "^$TAG$" | head -1 || true)
              if [ -z "$PREV_TAG" ]; then
                # First channel tag on this base. Use the previous
                # base version's last channel tag — or, failing that,
                # the previous stable. Skip semver-higher historic
                # leftovers by selecting only tags lexicographically
                # below this one in the version-aware sort.
                PREV_TAG=$(git tag --sort=-version:refname --list "v[0-9]*.[0-9]*.[0-9]*-${CHANNEL_SUFFIX}.*" \
                  | awk -v cur="$TAG" '$0 < cur { print; exit }' || true)
              fi
              if [ -z "$PREV_TAG" ]; then
                # No same-channel predecessor at all. Use the previous
                # stable as the absolute fallback.
                PREV_TAG=$(git tag --sort=-version:refname --list "v[0-9]*.[0-9]*.[0-9]*" \
                  | grep -vE '\-' \
                  | awk -v cur="$TAG" '$0 < cur { print; exit }' || true)
              fi
            else
              PREV_TAG=$(git tag --sort=-version:refname --list "v[0-9]*.[0-9]*.[0-9]*" \
                | grep -vE '\-' \
                | grep -v "^$TAG$" \
                | head -1 || true)
            fi
            echo "::notice::Previous tag for $TAG = ${PREV_TAG:-<none>}"

            # Cumulative anchor for PRERELEASE notes (#1027): the newest STABLE
            # tag (git version-sort, prereleases stripped). For a prerelease
            # this is always the right "since the last stable" baseline; a
            # backwards/empty range (pathological) simply renders no content and
            # is dropped below.
            PREV_STABLE=""
            if [[ "$STRIPPED" == *-* ]]; then
              PREV_STABLE=$(git tag --sort=-version:refname --list "v[0-9]*.[0-9]*.[0-9]*" | grep -vE -- '-' | head -1 || true)
              echo "::notice::Cumulative anchor (last stable) for $TAG = ${PREV_STABLE:-<none>}"
            fi

            GENERATED="$RUNNER_TEMP/release-notes-${TAG}.md"
            INC="$RUNNER_TEMP/inc-${TAG}.md"
            CUM="$RUNNER_TEMP/cum-${TAG}.md"

            # git-cliff renders a `## [version]` header even when EVERY commit
            # in the range is skipped, so `-s` is not a real content check.
            # "Has content" == at least one `### <group>` section heading.
            has_content() { grep -q '^### ' "$1" 2>/dev/null; }

            # ELI5 render (#1028): plain-English notes from `Release-Note:` PR
            # trailers, grouped into What's new / What's fixed / Performance /
            # Notes by .github/cliff-eli5-body.tera. Empty until trailered commits
            # land in the range — then it becomes the top of every release body.
            ELI5="$RUNNER_TEMP/eli5-${TAG}.md"
            if command -v git-cliff &>/dev/null && [ -n "$PREV_TAG" ]; then
              git-cliff --strip all --tag "$TAG" \
                --body "$(cat .github/cliff-eli5-body.tera)" \
                "${PREV_TAG}..${TAG}" > "$ELI5" 2>/dev/null || true
            fi

            if command -v git-cliff &>/dev/null; then
              # Full technical render — collapsed under <details> for developers.
              [ -n "$PREV_TAG" ] && git-cliff --strip all --tag "$TAG" "${PREV_TAG}..${TAG}" > "$INC" 2>/dev/null || true

              if [[ "$STRIPPED" != *-* ]]; then
                # --- STABLE ---
                # tier-1 (checked above) already won when present; reaching here
                # means no curated file. A stable must NOT ship commit-speak, so
                # require ELI5 from trailers — else FAIL now, before any platform
                # build starts (#1028). (First-ever stable with no predecessor
                # falls through to tier-3 rather than failing.)
                if has_content "$ELI5"; then
                  {
                    echo "# MeedyaDL ${STRIPPED}"
                    echo
                    cat "$ELI5"
                    if has_content "$INC"; then
                      echo
                      echo "<details><summary>Full technical changelog (for developers)</summary>"
                      echo
                      grep -v '^## \[' "$INC"
                      echo
                      echo "</details>"
                    fi
                  } > "$GENERATED"
                  echo "::notice::Generated ELI5 stable notes for $TAG"
                  NOTES_PATH="$GENERATED"
                elif [ -n "$PREV_TAG" ]; then
                  echo "::error::Stable release $TAG has no user-facing notes — no .github/release-notes/${TAG}.md and no Release-Note: trailers in ${PREV_TAG}..${TAG}. Stage a curated notes file (see .github/release-notes/STYLE_GUIDE.md) on main and re-run: gh workflow run Release -f tag=$TAG"
                  exit 1
                fi
              else
                # --- PRERELEASE ---
                # Compact "since last stable" cumulative view so every prerelease
                # is self-describing even when the delta is deps/housekeeping only
                # (#1027). --ignore-tags (no leading '-', git-cliff parses that as
                # a flag) collapses intermediate prerelease tags into ONE section.
                if [ -n "$PREV_STABLE" ]; then
                  git-cliff --strip all --tag "$TAG" \
                    --ignore-tags '(alpha|beta|rc|nightly|weekly|monthly)\.[0-9]' \
                    --body "$(cat .github/cliff-cumulative-body.tera)" \
                    "${PREV_STABLE}..${TAG}" > "$CUM" 2>/dev/null || true
                fi
                {
                  echo "# MeedyaDL ${STRIPPED}"
                  echo
                  if [ -n "${PREV_TAG:-}" ] && has_content "$ELI5"; then
                    cat "$ELI5"
                    echo
                  elif [ -n "${PREV_TAG:-}" ] && ! has_content "$INC"; then
                    # Genuinely nothing user-facing (all commits skipped, e.g. deps).
                    # NOT shown when the technical changelog has content but no
                    # Release-Note trailers yet (migration) — the cumulative
                    # section + <details> below carry those changes.
                    echo "_No user-facing changes since ${PREV_TAG} — dependency and internal housekeeping updates only._"
                    echo
                  fi
                  if [ -n "${PREV_STABLE:-}" ] && has_content "$CUM"; then
                    echo "## What's changed since ${PREV_STABLE} (the last stable release)"
                    echo
                    cat "$CUM"
                    echo
                  fi
                  if has_content "$INC"; then
                    echo "<details><summary>Full technical changelog (for developers)</summary>"
                    echo
                    grep -v '^## \[' "$INC"
                    echo
                    echo "</details>"
                  fi
                } > "$GENERATED"

                # Body-size guard: GitHub caps release bodies at 125 000 chars
                # and finalize-release later appends a ~3 000-char download guide.
                MAX_NOTES_BYTES=100000
                if [ "$(wc -c < "$GENERATED")" -gt "$MAX_NOTES_BYTES" ]; then
                  head -c "$MAX_NOTES_BYTES" "$GENERATED" > "${GENERATED}.tmp"
                  sed -i '$ d' "${GENERATED}.tmp"
                  printf '\n\n_Notes truncated — see [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for the full list._\n' "$REPO" >> "${GENERATED}.tmp"
                  mv "${GENERATED}.tmp" "$GENERATED"
                fi

                # Composed body always has the title + a fallback line → non-empty.
                if [ -s "$GENERATED" ]; then
                  echo "::notice::Generated prerelease notes for $TAG (ELI5: $(has_content "$ELI5" && echo yes || echo none); cumulative: ${PREV_STABLE:-none})"
                  NOTES_PATH="$GENERATED"
                fi
              fi
            fi

            # Tier 3: static fallback. Always produces non-empty
            # content so the GitHub API never sees the "Release
            # in progress…" placeholder string the #857 verification
            # step is screening for.
            if [ -z "${NOTES_PATH:-}" ]; then
              cat > "$GENERATED" <<EOF
          # MeedyaDL ${TAG}

          See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for the full change list.

          The platform-specific download links and \`.sig\` file
          explanations are appended after all builds finish (see
          \`finalize-release\` job in this workflow).
          EOF
              echo "::notice::Using tier-3 static-fallback release notes (git-cliff unavailable or no previous tag)"
              NOTES_PATH="$GENERATED"
            fi
          fi

          if [ "$SELF_HEAL" = "1" ]; then
            # Splice the regenerated notes onto the EXISTING body,
            # preserving the "Choose your download" footer if the
            # platform builds already appended one (#1046). Shared regex
            # with apply-notes.sh via splice-body.py.
            SPLICED="$RUNNER_TEMP/spliced-${TAG}.md"
            python3 scripts/release-notes/splice-body.py "$NOTES_PATH" "$LIVE_BODY_FILE" "$SPLICED"
            gh release edit "$TAG" --repo "$REPO" --notes-file "$SPLICED"
            echo "::notice::Self-healed release $TAG with regenerated ELI5 notes (footer preserved, #1046)"
          else
            # Create the release with the chosen notes content. The
            # --notes-file form keeps the body intact (no shell
            # quoting issues with multi-line Markdown).
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft $GH_FLAG \
              --title "$TAG" \
              --notes-file "$NOTES_PATH"
            echo "::notice::Created release $TAG with proper notes (no placeholder)"
          fi

  # ============================================================
  # Build and Publish Release Installers
  # ============================================================
  publish:
    name: Build (${{ matrix.settings.name }})
    needs: ensure-release

    # permissions: contents: write is required for the tauri-action to:
    #   - Create the GitHub Release
    #   - Upload release assets (installers)
    # This uses the automatic GITHUB_TOKEN, no PAT needed.
    # @see https://docs.github.com/en/actions/security-guides/automatic-token-authentication
    permissions:
      contents: write

    strategy:
      # fail-fast: false -- Build all platforms even if one fails.
      # A macOS build failure shouldn't prevent the Windows and Linux builds
      # from completing (they might succeed and be usable).
      fail-fast: false

      # Matrix defines the platform-specific build configurations.
      # Each entry produces a separate parallel job.
      matrix:
        settings:
          # ==========================================================
          # Tier 1: Stable targets (native or MSVC cross-compilation)
          # ==========================================================

          # macOS Apple Silicon (ARM64)
          # aarch64-apple-darwin targets Apple M1/M2/M3/M4 chips.
          # macos-latest runners are ARM64 by default.
          # Produces: MeedyaDL_x.x.x_aarch64.dmg and MeedyaDL.app
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin

          # Windows x64 (64-bit)
          # x86_64-pc-windows-msvc targets 64-bit Windows with MSVC toolchain.
          # --bundles nsis: Only build NSIS installer (skip WiX .msi).
          # Also works on ARM64 Windows via the built-in x64 emulation layer.
          # Produces: MeedyaDL_x.x.x_x64-setup.exe (NSIS)
          - name: Windows (x64)
            os: windows-latest
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            rust_target: x86_64-pc-windows-msvc

          # Windows ARM64 — cross-compiled from x64 runner
          # aarch64-pc-windows-msvc targets ARM64 Windows (Snapdragon X laptops,
          # Surface Pro X, etc.). MSVC provides ARM64 cross-compilation toolchain.
          # --bundles nsis: Only build NSIS installer (skip WiX .msi).
          # Produces: MeedyaDL_x.x.x_arm64-setup.exe (NSIS)
          - name: Windows (ARM64)
            os: windows-latest
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
            rust_target: aarch64-pc-windows-msvc

          # Linux x64 (64-bit)
          # Uses the default target triple for ubuntu-latest (x86_64-unknown-linux-gnu).
          # Empty args/rust_target means "build for the host architecture".
          # Produces: gamdl_x.x.x_amd64.deb and gamdl_x.x.x_amd64.AppImage
          - name: Linux (x64)
            os: ubuntu-latest
            args: ''
            rust_target: ''

          # ==========================================================
          # Tier 2: Experimental targets (Linux ARM cross-compilation)
          # ==========================================================
          # These targets use multi-arch apt to install ARM system libraries
          # and a cross-compilation toolchain. They are marked as experimental
          # because ARM webkit2gtk packages may have availability issues.

          # Linux ARM64 — for ARM servers, Raspberry Pi 4/5 (64-bit OS)
          # Cross-compiled from x64 ubuntu-latest using gcc-aarch64-linux-gnu.
          # --bundles deb rpm: Skip AppImage because linuxdeploy's ARM64 binary
          # can't execute on x86_64 runners (Exec format error).
          # Produces: MeedyaDL_x.x.x_arm64.deb, MeedyaDL-x.x.x-1.aarch64.rpm
          - name: Linux (ARM64)
            os: ubuntu-latest
            args: '--target aarch64-unknown-linux-gnu --bundles deb rpm'
            rust_target: aarch64-unknown-linux-gnu
            cross_arch: arm64
            cross_gcc: gcc-aarch64-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
            cross_pkg_config_prefix: aarch64-linux-gnu

          # Linux ARMv7 — for Raspberry Pi (32-bit Raspberry Pi OS)
          # Cross-compiled from x64 ubuntu-latest using gcc-arm-linux-gnueabihf.
          # --bundles deb rpm: Skip AppImage (same reason as ARM64 above).
          # Produces: MeedyaDL_x.x.x_armhf.deb, MeedyaDL-x.x.x-1.armv7hl.rpm
          - name: Linux (ARMv7)
            os: ubuntu-latest
            args: '--target armv7-unknown-linux-gnueabihf --bundles deb rpm'
            rust_target: armv7-unknown-linux-gnueabihf
            cross_arch: armhf
            cross_gcc: gcc-arm-linux-gnueabihf
            cross_linker: arm-linux-gnueabihf-gcc
            cross_pkg_config_prefix: arm-linux-gnueabihf

    runs-on: ${{ matrix.settings.os }}

    # Suppress Node's DEP0040 punycode deprecation warning emitted by
    # `@actions/cache`'s bundled dependencies, which the Swatinem/rust-cache
    # post step invokes. Cosmetic only — neither MeedyaDL nor the action's
    # hot path call `require('punycode')` — but it clutters every Build job's
    # log. Job-level env propagates to main + post steps. Targeted
    # (`--disable-warning=DEP0040`) so other deprecations remain visible.
    env:
      NODE_OPTIONS: --disable-warning=DEP0040

    # Linux ARM builds are experimental — allow them to fail without
    # blocking the overall release. All Tier 1 builds must succeed.
    continue-on-error: ${{ matrix.settings.cross_arch != '' }}

    steps:
      # Step 0: Resolve the release tag.
      # For tag pushes: github.ref_name is the tag (e.g., v0.3.1).
      # For workflow_dispatch: the tag is provided as an input.
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          # Shape-validate before the tag is interpolated into downstream
          # run: shells and release commands (#977). Rejects any tag carrying
          # shell metacharacters injected via a workflow_dispatch input.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag format: '$TAG' (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      # Step 0b: Extract the numeric version (strip 'v' prefix) for asset filenames.
      # Asset files use the version without 'v': MeedyaDL_0.6.4_aarch64.dmg
      - name: Extract version number
        id: version
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Step 0c: Derive the GitHub Release `prerelease` flag from the tag.
      # Any tag with a pre-release suffix (e.g. `-alpha.1`, `-beta.2`,
      # `-rc.3`, `-nightly.20260420`) marks the release as pre-release.
      # A bare semver tag (`v1.0.0`) marks it as a stable / non-prerelease
      # release. This replaces the previous hard-coded `prerelease: true`
      # flag and lets the same workflow handle both stable and pre-release
      # tag pushes correctly.
      - name: Derive prerelease flag from tag
        id: prerelease
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # Strip leading 'v' then check for a `-` indicating a pre-release suffix.
          STRIPPED="${TAG#v}"
          if [[ "$STRIPPED" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "gh_flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "gh_flag=" >> "$GITHUB_OUTPUT"
          fi

      # Step 1: Check out the repository code at the tagged commit.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.tag.outputs.name }}

      # Step 2: Set up Node.js LTS with npm dependency caching.
      # Required for building the frontend (Vite build) before Tauri packaging.
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Step 3: Set up Rust stable toolchain with the target platform.
      # The 'targets' input installs the cross-compilation target triple.
      # For macOS (aarch64) and Windows (x86_64-msvc), this ensures the correct
      # standard library is available. Linux uses the default host target.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.settings.rust_target }}

      # Step 4: Cache Rust compilation artifacts.
      # Release builds compile all dependencies from scratch with optimizations,
      # which takes 15-30 minutes without caching. The cache saves most of this time.
      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        with:
          workspaces: src-tauri

      # Step 5: Install Linux system dependencies for native x64 builds.
      # Same dependencies as ci.yml -- required for compiling the Rust backend
      # which links against WebKit, GTK, and other native libraries.
      # Only runs for the native Linux x64 build (not ARM cross-compilation).
      # @see https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && matrix.settings.cross_arch == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      # Step 6: Set up Linux ARM cross-compilation environment.
      # This step configures multi-arch apt, installs ARM system libraries,
      # and sets up the cross-compilation toolchain. Only runs for ARM targets.
      #
      # The approach:
      #   1. Add the ARM architecture to dpkg (arm64 or armhf)
      #   2. Add Ubuntu ARM ports repository for ARM packages
      #   3. Pin x86_64 packages to the default repo to avoid conflicts
      #   4. Install the cross-compiler (gcc-aarch64-linux-gnu or gcc-arm-linux-gnueabihf)
      #   5. Install ARM versions of Tauri's system dependencies (webkit2gtk, gtk3, etc.)
      - name: Setup Linux ARM cross-compilation
        if: matrix.settings.cross_arch != ''
        env:
          CROSS_ARCH: ${{ matrix.settings.cross_arch }}
          CROSS_GCC: ${{ matrix.settings.cross_gcc }}
        run: |
          # Add the ARM architecture so apt can install ARM packages
          sudo dpkg --add-architecture $CROSS_ARCH

          # Restrict the default Ubuntu sources to amd64 only.
          # Ubuntu 24.04 uses deb822 format in /etc/apt/sources.list.d/ubuntu.sources.
          # Without this, apt-get update tries to fetch ARM packages from
          # security.ubuntu.com and archive.ubuntu.com, which don't host ARM
          # packages and return 404. ARM packages must come from ports.ubuntu.com.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb$/Architectures: amd64\nTypes: deb/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          # Also handle legacy sources.list format (Ubuntu < 24.04)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb http|deb [arch=amd64] http|g' /etc/apt/sources.list
          fi

          # Add Ubuntu ports repository for ARM packages.
          # The standard archive only has amd64/i386; ARM packages come from ports.
          CODENAME=$(lsb_release -cs)
          sudo tee /etc/apt/sources.list.d/arm-cross.list << EOF
          deb [arch=$CROSS_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $CODENAME main restricted universe
          deb [arch=$CROSS_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $CODENAME-updates main restricted universe
          deb [arch=$CROSS_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $CODENAME-security main restricted universe
          EOF

          sudo apt-get update

          # Upgrade all existing amd64 packages to their latest versions.
          # This ensures Multi-Arch:same packages (like libgnutls30t64) have
          # matching versions between amd64 and the ARM arch being installed.
          # Without this, held-back packages on GitHub runners cause version
          # conflicts when installing ARM library dependencies.
          sudo apt-get upgrade -y

          # Install the cross-compilation toolchain
          sudo apt-get install -y $CROSS_GCC

          # Install ARM versions of Tauri's native library dependencies.
          # The :$CROSS_ARCH suffix tells apt to install the ARM variant.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev:$CROSS_ARCH \
            libappindicator3-dev:$CROSS_ARCH \
            librsvg2-dev:$CROSS_ARCH \
            patchelf \
            libssl-dev:$CROSS_ARCH \
            libgtk-3-dev:$CROSS_ARCH

      # Step 7: Configure cross-compilation environment variables.
      # These environment variables tell Cargo and pkg-config how to find
      # the ARM libraries and which linker to use for the target architecture.
      - name: Configure cross-compilation env
        if: matrix.settings.cross_arch != ''
        run: |
          # Tell Cargo which linker to use for the target triple.
          # The env var name is CARGO_TARGET_<TRIPLE>_LINKER with dashes replaced by underscores.
          TARGET_UPPER=$(echo "${{ matrix.settings.rust_target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ matrix.settings.cross_linker }}" >> "$GITHUB_ENV"

          # Configure pkg-config to find ARM libraries instead of host x86_64 ones.
          echo "PKG_CONFIG_PATH=/usr/lib/${{ matrix.settings.cross_pkg_config_prefix }}/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"

      # Step 8: Install npm dependencies.
      # 'npm ci' ensures a clean, reproducible install from package-lock.json.
      - name: Install npm dependencies
        run: npm ci

      # Step 8.5: Pre-bundle engines for offline installer (optional).
      # When bundle_engines is true (manual workflow_dispatch only), downloads
      # Python, pip engines (GAMDL, votify), and binary tools (FFmpeg, mp4decrypt,
      # N_m3u8DL-RE, MP4Box, MediaInfo) into src-tauri/bundled-deps/.
      # The setup wizard detects these on first launch and skips downloading.
      #
      # Reads engines.toml to determine which pip packages to install
      # (bundled=true AND enabled=true). Binary tools are downloaded from
      # the MeedyaDL-Tools mirror.
      #
      # Skipped for tag-push triggers (always tiny installer).
      # Only activated via: gh workflow run "Release" -f tag=vX.X.X -f bundle_engines=true
      - name: Pre-bundle engines (offline installer)
        if: inputs.bundle_engines == true
        env:
          BUNDLE_ENGINES: ${{ inputs.bundle_engines }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Pre-bundle engines for offline installer"

          DEPS_DIR="src-tauri/bundled-deps"
          mkdir -p "$DEPS_DIR/tools"

          # --- Determine platform ---
          case "$RUNNER_OS" in
            macOS)   MIRROR_OS="macos"; MIRROR_ARCH="aarch64"; EXT="tar.gz" ;;
            Windows) MIRROR_OS="windows"; MIRROR_ARCH="x86_64"; EXT="zip" ;;
            Linux)   MIRROR_OS="linux"; MIRROR_ARCH="x86_64"; EXT="tar.gz" ;;
          esac

          # Override arch for Windows ARM64 and Linux ARM builds
          if [[ "${{ matrix.settings.rust_target }}" == *"aarch64"* && "$RUNNER_OS" != "macOS" ]]; then
            MIRROR_ARCH="aarch64"
          fi
          if [[ "${{ matrix.settings.rust_target }}" == *"armv7"* ]]; then
            MIRROR_ARCH="armhf"
            # ARMv7 tools may use tar.gz even on Linux
          fi

          echo "Platform: ${MIRROR_OS}-${MIRROR_ARCH} (.${EXT})"

          # --- Install pip engines ---
          # Parse engines.toml for bundled+enabled pip packages.
          # Uses Python (available on all runners) to parse TOML.
          #
          # Bare package names (e.g. "gamdl") resolve to PyPI *latest* on
          # `pip install`, which bypasses the runtime support-window
          # ceiling that `install_gamdl()` / `gamdl_capabilities::
          # pip_version_spec()` enforce at runtime (`gamdl>={minimum_version},
          # <={maximum_tested_version}` from tool-versions.toml's [gamdl]
          # section). Without this, the offline installer could bundle an
          # above-ceiling, untested GAMDL release the app itself would only
          # ever install via the explicit opt-in "Untested" upgrade flow —
          # #984. Only `gamdl` is pinned this way; other bundled pip
          # engines (e.g. votify) are intentionally left unpinned unless
          # tool-versions.toml grows a matching section for them too.
          PIP_PACKAGES=$(python3 -c "
          import tomllib, sys
          with open('src-tauri/engines.toml', 'rb') as f:
              data = tomllib.load(f)
          with open('src-tauri/tool-versions.toml', 'rb') as f:
              tool_versions = tomllib.load(f)
          gamdl_min = tool_versions.get('gamdl', {}).get('minimum_version')
          gamdl_max = tool_versions.get('gamdl', {}).get('maximum_tested_version')
          pkgs = []
          for e in data.get('engines', {}).values():
              if not (e.get('bundled') and e.get('enabled') and e.get('install_method') == 'pip' and e.get('pip_package')):
                  continue
              pkg = e['pip_package']
              # Mirror gamdl_capabilities::pip_version_spec() — pin gamdl to
              # the tested support window instead of shipping PyPI latest.
              if pkg == 'gamdl' and gamdl_min and gamdl_max:
                  pkg = f'gamdl>={gamdl_min},<={gamdl_max}'
              pkgs.append(pkg)
          print(' '.join(pkgs))
          ")

          if [ -n "$PIP_PACKAGES" ]; then
            echo "Installing pip engines: $PIP_PACKAGES"
            # Use the runner's system Python to bootstrap pip install into bundled-deps
            # The actual managed Python is downloaded at app runtime; these packages
            # are placed so the setup wizard can detect them.
            python3 -m pip install --target="$DEPS_DIR/pip-packages" $PIP_PACKAGES
            echo "Pip engines installed to $DEPS_DIR/pip-packages/"
          fi

          # --- Download binary tools from MeedyaDL-Tools mirror ---
          MIRROR_REPO="MeedyaSuite/MeedyaDL-Tools"
          TOOLS=("ffmpeg" "mp4decrypt" "nm3u8dlre" "mp4box" "mediainfo")

          # Also download binary engines (bundled=true, install_method=binary)
          BINARY_ENGINES=$(python3 -c "
          import tomllib
          with open('src-tauri/engines.toml', 'rb') as f:
              data = tomllib.load(f)
          ids = [
              eid for eid, e in data.get('engines', {}).items()
              if e.get('bundled') and e.get('enabled') and e.get('install_method') == 'binary'
          ]
          print(' '.join(ids))
          ")

          for engine_id in $BINARY_ENGINES; do
            TOOLS+=("$engine_id")
          done

          # Fetch asset list from mirror
          ASSETS_JSON=$(curl -s -H "User-Agent: MeedyaDL-CI" \
            "https://api.github.com/repos/${MIRROR_REPO}/releases/tags/latest")

          for tool in "${TOOLS[@]}"; do
            ASSET_PREFIX="${tool}-${MIRROR_OS}-${MIRROR_ARCH}"
            ASSET_URL=$(echo "$ASSETS_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for asset in data.get('assets', []):
              if asset['name'].startswith('${ASSET_PREFIX}'):
                  print(asset['browser_download_url'])
                  break
          " || true)

            if [ -n "$ASSET_URL" ]; then
              echo "Downloading $tool from mirror: $ASSET_URL"
              TOOL_DIR="$DEPS_DIR/tools/$tool"
              mkdir -p "$TOOL_DIR"
              # TODO(#984): verify a published checksum (e.g. checksums.txt
              # or a per-asset *.sha256) once the MeedyaDL-Tools mirror
              # publishes one — this repo's release process is out of
              # scope for this change. Until then, `-f` makes curl fail
              # loudly on HTTP errors (was previously silent — a 404
              # response body would get written to disk and only fail
              # later, confusingly, at the tar/unzip step) and the
              # explicit non-empty + archive-integrity checks below are a
              # fail-safe against a truncated/corrupt download from the
              # mutable `latest` tag, though neither substitutes for real
              # integrity verification against a signed/known-good hash.
              curl -fsSL "$ASSET_URL" -o "/tmp/${tool}.${EXT}"
              if [ ! -s "/tmp/${tool}.${EXT}" ]; then
                echo "::error::Downloaded archive for $tool is empty ($ASSET_URL)"
                exit 1
              fi
              if [ "$EXT" = "zip" ]; then
                if ! unzip -tqq "/tmp/${tool}.${EXT}" >/dev/null; then
                  echo "::error::Downloaded archive for $tool is not a valid zip ($ASSET_URL)"
                  exit 1
                fi
                unzip -qo "/tmp/${tool}.${EXT}" -d "$TOOL_DIR"
              else
                if ! tar -tzf "/tmp/${tool}.${EXT}" >/dev/null; then
                  echo "::error::Downloaded archive for $tool is not a valid tar.gz ($ASSET_URL)"
                  exit 1
                fi
                tar -xzf "/tmp/${tool}.${EXT}" -C "$TOOL_DIR"
              fi
              rm -f "/tmp/${tool}.${EXT}"
              echo "  → $tool extracted to $TOOL_DIR"
            else
              echo "::warning::No mirror asset found for ${ASSET_PREFIX} — will download at runtime"
            fi
          done

          # --- Write manifest ---
          python3 -c "
          import json, datetime
          manifest = {
              'bundled_at': datetime.datetime.utcnow().isoformat() + 'Z',
              'target_os': '${MIRROR_OS}',
              'target_arch': '${MIRROR_ARCH}',
              'pip_packages': '${PIP_PACKAGES}'.split(),
              'tools': [t for t in '${TOOLS[*]}'.split() if t],
              'offline_installer': True
          }
          with open('src-tauri/bundled-deps/manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          "

          echo "::endgroup::"
          echo "✅ Offline installer bundle ready"
          du -sh "$DEPS_DIR"

      # Step 8.6: Harvest third-party licence notices from every bundled
      # component into the offline installer.
      #
      # Why: MIT/BSD/Unlicense/PSF components require the upstream copyright
      # notice + permission notice to travel with the binary when we
      # redistribute. LGPL/GPL components additionally require a written
      # offer for source code (#802). This step gathers both into the
      # offline bundle so the legal text physically ships alongside the
      # binaries it covers — no separate manual step, no risk of forgetting
      # when a new component lands in tool-versions.toml.
      #
      # The repo-root THIRD_PARTY_LICENSES.md is the source of truth for
      # the textual notices and is embedded into the app binary via
      # include_str!() (src-tauri/src/commands/legal.rs). The bundle copy
      # is additionally useful for downstream packagers and auditors who
      # only see the offline installer tarball.
      - name: Bundle third-party licence notices (offline installer, #802)
        if: inputs.bundle_engines == true
        run: |
          set -euo pipefail
          DEPS_DIR="src-tauri/bundled-deps"
          if [ ! -d "$DEPS_DIR" ]; then
            echo "::warning::No bundled-deps directory found — skipping licence harvest"
            exit 0
          fi
          echo "::group::Bundle third-party licence notices"

          # Copy the repo-root verbatim file in (single source of truth).
          cp THIRD_PARTY_LICENSES.md "$DEPS_DIR/THIRD_PARTY_LICENSES.md"
          cp ACKNOWLEDGEMENTS.md     "$DEPS_DIR/ACKNOWLEDGEMENTS.md"

          # Harvest per-component LICENSE files from pip wheels' dist-info
          # metadata. Most modern wheels carry the upstream LICENSE next
          # to the METADATA file under *.dist-info/. We aggregate those
          # into a single browseable directory so the bundle includes the
          # raw upstream files, not just our consolidated markdown.
          LIC_DIR="$DEPS_DIR/licences"
          mkdir -p "$LIC_DIR/pip-packages" "$LIC_DIR/tools" "$LIC_DIR/source-offers"

          if [ -d "$DEPS_DIR/python" ]; then
            find "$DEPS_DIR/python" -type d -name '*.dist-info' | while read -r distinfo; do
              pkg=$(basename "$distinfo" .dist-info)
              find "$distinfo" -maxdepth 2 -type f \
                \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
                | while read -r f; do
                  out="$LIC_DIR/pip-packages/$pkg-$(basename "$f")"
                  cp "$f" "$out" 2>/dev/null || true
                done
            done
          fi

          # Harvest binary-tool licence text from the tool source archives'
          # standard layout. The mirror repo (MeedyaDL-Tools) stores the
          # upstream LICENSE file alongside each tool binary, so the
          # bundle dirs may already contain them — copy any we find.
          if [ -d "$DEPS_DIR/tools" ]; then
            find "$DEPS_DIR/tools" -type f \
              \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
              | while read -r f; do
                # Preserve the tool dir name so the user can tell which
                # tool a licence belongs to (e.g. ffmpeg-LICENSE.txt).
                tool=$(basename "$(dirname "$f")")
                out="$LIC_DIR/tools/$tool-$(basename "$f")"
                cp "$f" "$out" 2>/dev/null || true
              done
          fi

          # Emit the per-version OFFER_FOR_SOURCE.txt for the LGPL/GPL
          # components actually shipped. Versions come from tool-versions.toml
          # which is the canonical source for what we'll be downloading. We
          # parse minimally because installing a TOML parser inside this
          # step would inflate CI time for one read.
          OFFER="$LIC_DIR/source-offers/OFFER_FOR_SOURCE.txt"
          {
            echo "MeedyaDL written offer for complete corresponding source code"
            echo "============================================================="
            echo ""
            echo "This file is part of the MeedyaDL offline-installer artefact for"
            echo "the version named in ../../manifest.json. It constitutes the"
            echo "MeedyaDL project's written offer to provide the complete"
            echo "corresponding source code for every LGPL- or GPL-licensed"
            echo "component shipped inside this installer, valid for three (3)"
            echo "years from the date of this distribution."
            echo ""
            echo "The unmodified upstream source for the exact version of each"
            echo "component listed below is available from the linked upstream"
            echo "release page. If a linked URL becomes unreachable, you may"
            echo "obtain a copy by opening an issue at:"
            echo "    https://github.com/MWBMPartners/MeedyaDL/issues"
            echo "with the subject 'Source request - <component> <version>'."
            echo ""
            echo "MeedyaDL does NOT currently modify any of these components."
            echo "If a future release does, the modified source tree will be"
            echo "published in MWBMPartners/MeedyaDL-Tools alongside the binary."
            echo ""
            echo "--- Components covered ---"
            echo ""
            if [ -f tool-versions.toml ]; then
              echo "FFmpeg   - LGPL-2.1+  - https://ffmpeg.org/releases/"
              echo "MP4Box   - LGPL-2.1   - https://github.com/gpac/gpac/releases"
              echo "mp4decrypt (Bento4) - GPL-2.0 w/ linking exception"
              echo "         - https://github.com/axiomatic-systems/Bento4/releases"
              echo ""
              echo "Exact shipped versions for this build:"
              grep -E '^\s*(minimum_version|recommended_version|maximum_tested_version)\s*=' \
                tool-versions.toml || true
            fi
            echo ""
            echo "--- Issued by ---"
            echo "MeedyaDL maintainers, ${GITHUB_REF_NAME:-unknown-tag}, $(date -u +%Y-%m-%d)"
          } > "$OFFER"

          echo "✅ Licences + source offer bundled at $LIC_DIR"
          ls -la "$LIC_DIR" "$LIC_DIR/pip-packages" "$LIC_DIR/tools" "$LIC_DIR/source-offers" || true
          echo "::endgroup::"

      # Step 8.9: Fix macOS codesign secure timestamp.
      # Tauri's tauri-macos-sign crate omits --timestamp from the codesign command,
      # causing Apple's notarization service to reject signatures with:
      #   "The signature does not include a secure timestamp."
      # Apple requires --timestamp for all notarizable binaries:
      #   https://developer.apple.com/documentation/security/resolving-common-notarization-issues
      #
      # This workaround installs a codesign wrapper that injects --timestamp into
      # every codesign invocation. It can be removed once Tauri adds --timestamp
      # natively (tracked upstream: https://github.com/tauri-apps/tauri/issues/11992).
      - name: Fix macOS codesign secure timestamp
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/codesign" << 'WRAPPER'
          #!/bin/bash
          # Wrapper: injects --timestamp into codesign for Apple notarization.
          # See: https://github.com/tauri-apps/tauri/issues/11992
          REAL=/usr/bin/codesign
          for arg in "$@"; do
            [ "$arg" = "--timestamp" ] && exec "$REAL" "$@"
          done
          exec "$REAL" --timestamp "$@"
          WRAPPER
          chmod +x "$HOME/bin/codesign"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Step 8.95: Sign all Mach-O binaries inside bundled-deps with our Developer ID.
      # Apple's notarization service inspects EVERYTHING inside the .app bundle,
      # including files inside tar.gz archives. Third-party binaries (Python, Perl,
      # FFmpeg, MP4Box libs, etc.) are not signed with our certificate, so we must
      # re-sign them before Tauri packages them into the installer.
      # The codesign wrapper (step 8.9) ensures --timestamp is included automatically.
      - name: Sign bundled macOS dependencies
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          DEPS_DIR="src-tauri/bundled-deps"
          if [ ! -d "$DEPS_DIR" ]; then
            echo "No bundled-deps directory found — skipping"
            exit 0
          fi

          # Set up a temporary keychain for signing
          KEYCHAIN_PATH="$RUNNER_TEMP/bundled-deps-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the Developer ID certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Add keychain to search list and allow codesign access
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Find and sign all Mach-O binaries
          echo "Signing bundled dependencies with: $APPLE_SIGNING_IDENTITY"
          SIGNED=0
          FAILED=0
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "Mach-O"; then
              if codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$file" 2>/dev/null; then
                SIGNED=$((SIGNED + 1))
              else
                echo "::warning::Failed to sign: $file"
                FAILED=$((FAILED + 1))
              fi
            fi
          done < <(find "$DEPS_DIR" -type f -print0)
          echo "Signed $SIGNED Mach-O binaries ($FAILED failures)"

          # Re-create the tar.gz with signed binaries
          tar czf "${DEPS_DIR}.tar.gz" -C "$(dirname "$DEPS_DIR")" "$(basename "$DEPS_DIR")"
          echo "Re-created bundled-deps.tar.gz with signed binaries"

      # Step 9: Validate required Apple signing/notarization secrets on macOS.
      # Keeps failures explicit and prevents accidentally publishing unsigned
      # macOS binaries when secret configuration is incomplete.
      - name: Validate macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              echo "::error title=Missing secret::Required secret '$var' is not set."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Set the required Apple secrets in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Step 10: Build the application and create release bundles.
      # The tauri-apps/tauri-action@v0 performs the complete build pipeline:
      #
      #   1. Frontend: Runs 'npm run build' (Vite production build)
      #   2. Backend:  Runs 'cargo build --release' with the target from matrix.settings.args
      #   3. Bundle:   Creates platform installers per tauri.conf.json "bundle" settings
      #   4. Release:  Creates/updates a GitHub Release and uploads installer files
      #
      # Environment:
      #   GITHUB_TOKEN -- Authenticates with GitHub API for release creation and asset upload.
      #                   This is the automatic token provided by GitHub Actions.
      #
      # Inputs:
      #   tagName     -- The Git tag that triggered this build (e.g., "v0.1.0")
      #   releaseName -- Human-readable release title shown on GitHub
      #   releaseBody -- Markdown content for the release description
      #   releaseDraft -- true = creates a draft release (not public until manually published)
      #   prerelease  -- false = marks this as a stable release (not pre-release)
      #   args        -- Extra arguments passed to 'cargo tauri build' (e.g., --target)
      #
      # @see https://github.com/tauri-apps/tauri-action -- Action documentation
      #
      # Build and publish: For most platforms, tauri-action handles the full
      # build + release upload pipeline. ARMv7 and macOS are excluded:
      #   - ARMv7: tauri-action skips the build entirely when includeRelease=false
      #     + includeUpdaterJson=false, and it can't match 'armhf' filenames.
      #   - macOS: built manually with notarization retry logic (see Step 10a)
      #     because Apple's notarization service occasionally returns HTTP 503
      #     "Slow Down" rate-limiting errors that fail the entire build.
      # Both are built and uploaded manually in subsequent steps.
      - name: Build and publish
        if: matrix.settings.cross_arch != 'armhf' && runner.os != 'macOS'
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key — generates .sig signature files alongside
          # each build artifact. The final latest.json manifest is rebuilt once
          # after the matrix completes to avoid parallel release-asset races.
          # Required for the in-app auto-update system to verify downloads.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # AcoustID application API key — embedded at compile time via option_env!().
          # Allows release builds to ship with a pre-configured key for audio
          # fingerprinting, so users don't need to register their own.
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: '${{ steps.tag.outputs.name }}'
          releaseBody: |
            ## MeedyaDL ${{ steps.tag.outputs.name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ---

            ## Choose your download

            | If you're using... | Download this | Notes |
            |--------------------|--------------|-------|
            | 🍎 **Mac** (M1, M2, M3, M4) | [MeedyaDL_${{ steps.version.outputs.number }}_aarch64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/MeedyaDL_${{ steps.version.outputs.number }}_aarch64.dmg) | Most Macs since late 2020 |
            | 🪟 **Windows** (most PCs) | [MeedyaDL_${{ steps.version.outputs.number }}_x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/MeedyaDL_${{ steps.version.outputs.number }}_x64-setup.exe) | Works on all modern Windows PCs |
            | 🪟 **Windows** (Snapdragon / ARM) | [MeedyaDL_${{ steps.version.outputs.number }}_arm64-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/MeedyaDL_${{ steps.version.outputs.number }}_arm64-setup.exe) | Surface Pro X, Snapdragon laptops |
            | 🐧 **Linux** (most PCs) | [MeedyaDL_${{ steps.version.outputs.number }}_amd64.deb](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/MeedyaDL_${{ steps.version.outputs.number }}_amd64.deb) or [.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/MeedyaDL_${{ steps.version.outputs.number }}_amd64.AppImage) | Ubuntu, Debian, Mint, Pop!_OS |
            | 🐧 **Linux** (RPM-based) | [MeedyaDL-${{ steps.version.outputs.number }}-1.x86_64.rpm](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/MeedyaDL-${{ steps.version.outputs.number }}-1.x86_64.rpm) | Fedora, RHEL, CentOS, openSUSE |
            | 🐧 **Linux** (Raspberry Pi 4/5) | [MeedyaDL_${{ steps.version.outputs.number }}_arm64.deb](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/MeedyaDL_${{ steps.version.outputs.number }}_arm64.deb) or [.aarch64.rpm](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/MeedyaDL-${{ steps.version.outputs.number }}-1.aarch64.rpm) | Requires 64-bit OS |
            | 💻 **Chromebook** | [MeedyaDL_${{ steps.version.outputs.number }}_amd64.deb](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/MeedyaDL_${{ steps.version.outputs.number }}_amd64.deb) | Install via Linux (Crostini) |

            > **Not sure which to pick?** Most Mac users want the `.dmg`. Most Windows users want `_x64-setup.exe`. Most Linux desktop users want the `.deb` or `.AppImage`.

            > **Windows ARM64 users**: The `_x64-setup.exe` also works on ARM64 via Windows' built-in emulation layer.

            > **Raspberry Pi users**: You may need to install [GDebi](https://packages.debian.org/gdebi) to install `.deb` packages with dependencies: `sudo apt install gdebi-core && sudo gdebi MeedyaDL_*_arm64.deb`

            ### What are the `.sig` files?

            Files ending in `.sig` are **cryptographic signatures** used by MeedyaDL's built-in auto-updater. They verify that downloaded updates haven't been tampered with. **You do not need to download `.sig` files** — they are used automatically by the app when checking for updates. The `latest.json` file is also part of the auto-update system and can be ignored.

            ### macOS Users

            The macOS `.dmg` is code-signed and notarized by Apple. If macOS still shows a security warning on an unsigned development build, right-click the app and choose **Open**, or run:
            ```
            xattr -cr /Applications/MeedyaDL.app
            ```

            ### First-Time Users

            On first launch, MeedyaDL will guide you through a setup wizard that downloads Python, GAMDL, and required tools automatically. You will also need to provide your Apple Music cookies exported from your browser — see the in-app help for instructions.
          releaseDraft: true
          # `prerelease` is derived from the tag suffix in step 0c:
          # any `-alpha.N` / `-beta.N` / `-rc.N` / `-nightly.*` / `-weekly.*`
          # / `-monthly.*` tag → pre-release; bare `vX.Y.Z` → stable. This
          # lets the same release workflow handle every channel without
          # hard-coding the flag for each tag push.
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          args: ${{ matrix.settings.args }}
          # Do not let every matrix job create/update latest.json. Parallel
          # tauri-action uploads can race and fail while updating the same
          # release asset; finalize-release rebuilds the complete manifest once.
          includeUpdaterJson: false

      # Step 10a: Build macOS with notarization retry.
      # Apple's notarization service occasionally returns HTTP 503 "Slow Down"
      # rate-limiting errors. Since tauri-action wraps the entire build + notarize
      # pipeline in a single step with no retry capability, we handle the macOS
      # build manually with retry logic. Up to 3 attempts with exponential backoff
      # (30s, 60s). Only notarization failures (503/serviceUnavailable) trigger
      # a retry — compilation or signing errors fail immediately.
      # See: https://github.com/MWBMPartners/MeedyaDL/issues/361
      - name: Build macOS with notarization retry
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
        shell: bash
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=1
          BACKOFF=30

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "::group::Build attempt $ATTEMPT of $MAX_ATTEMPTS"

            # Capture both stdout and stderr, and the exit code
            BUILD_LOG=$(mktemp)
            set +e
            npx tauri build ${{ matrix.settings.args }} 2>&1 | tee "$BUILD_LOG"
            EXIT_CODE=${PIPESTATUS[0]}
            set -e

            echo "::endgroup::"

            if [ $EXIT_CODE -eq 0 ]; then
              echo "Build succeeded on attempt $ATTEMPT"
              rm -f "$BUILD_LOG"
              break
            fi

            # Check if the failure is a transient notarization error (503 / SlowDown)
            if grep -qiE "503|SlowDown|serviceUnavailable|Slow Down|reduce your request rate" "$BUILD_LOG"; then
              echo "::warning::Apple notarization returned 503 (attempt $ATTEMPT of $MAX_ATTEMPTS)"
              rm -f "$BUILD_LOG"

              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Retrying in ${BACKOFF}s..."
                sleep $BACKOFF
                BACKOFF=$((BACKOFF * 2))
                ATTEMPT=$((ATTEMPT + 1))
              else
                echo "::error::Apple notarization failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
            else
              # Non-notarization failure (compilation, signing, etc.) — fail immediately
              echo "::error::Build failed with a non-transient error (not retrying)"
              rm -f "$BUILD_LOG"
              exit $EXIT_CODE
            fi
          done

      # Step 10a.1: Upload macOS artifacts to the GitHub release.
      # Since macOS is built manually (not via tauri-action), we need to upload
      # the artifacts ourselves. This mirrors the ARMv7 manual upload pattern.
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${{ steps.version.outputs.number }}"
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"

          # #857: the `ensure-release` job created the release object
          # with proper notes BEFORE this job started. No race-guard
          # `gh release create` needed here — we just upload assets
          # against the existing release.

          # Upload .dmg
          DMG_FILE="$BUNDLE_DIR/dmg/MeedyaDL_${VERSION}_aarch64.dmg"
          if [ -f "$DMG_FILE" ]; then
            gh release upload "$TAG" "$DMG_FILE" --clobber
            echo "Uploaded $DMG_FILE"
          else
            echo "::warning::DMG not found at $DMG_FILE"
          fi

          # Upload .app.tar.gz (updater artifact)
          # Tauri 2.x names this after the .app bundle (no version/arch suffix),
          # so the file is MeedyaDL.app.tar.gz, NOT MeedyaDL_aarch64.app.tar.gz.
          # We rename on upload to include the arch suffix for consistency with
          # other platform assets and to support future universal builds.
          APP_TAR="$BUNDLE_DIR/macos/MeedyaDL.app.tar.gz"
          UPLOAD_TAR_NAME="MeedyaDL.app.tar.gz"
          if [ -f "$APP_TAR" ]; then
            gh release upload "$TAG" "$APP_TAR#${UPLOAD_TAR_NAME}" --clobber
            echo "Uploaded $APP_TAR as $UPLOAD_TAR_NAME"
          else
            echo "::warning::app.tar.gz not found at $APP_TAR"
          fi

          # Upload .app.tar.gz.sig (updater signature)
          APP_SIG="$BUNDLE_DIR/macos/MeedyaDL.app.tar.gz.sig"
          UPLOAD_SIG_NAME="MeedyaDL.app.tar.gz.sig"
          if [ -f "$APP_SIG" ]; then
            gh release upload "$TAG" "$APP_SIG#${UPLOAD_SIG_NAME}" --clobber
            echo "Uploaded $APP_SIG as $UPLOAD_SIG_NAME"
          else
            echo "::warning::app.tar.gz.sig not found at $APP_SIG"
          fi

      # Step 10b: Build ARMv7 manually.
      # tauri-action is skipped for ARMv7 because:
      #   1. When includeRelease=false + includeUpdaterJson=false, tauri-action
      #      skips the build entirely (reports "No artifacts were found").
      #   2. When they are true, tauri-action can't match Debian's 'armhf'
      #      filenames (it expects 'armv7').
      # The solution: build directly with `npm run tauri build` and upload
      # artifacts manually in the next step.
      - name: Build ARMv7
        if: matrix.settings.cross_arch == 'armhf'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
        shell: bash
        run: npx tauri build --target armv7-unknown-linux-gnueabihf --bundles deb rpm

      # Step 11: Upload ARMv7 artifacts manually.
      # Tauri's bundler uses Debian's 'armhf' naming convention for 32-bit ARM.
      # This step renames the files to use 'armv7' for clarity and uploads them
      # to the draft release.
      - name: Upload ARMv7 artifacts
        if: matrix.settings.cross_arch == 'armhf'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          BUNDLE_DIR="src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle"

          # #857: release object already exists (created by the
          # `ensure-release` job). Skipping the legacy race-guard
          # `gh release create` that previously planted the
          # "Release in progress…" placeholder.

          # Upload .deb: rename armhf → armv7 for clarity
          for f in "$BUNDLE_DIR"/deb/*_armhf.deb; do
            [ -f "$f" ] || continue
            new="${f/_armhf.deb/_armv7.deb}"
            mv "$f" "$new"
            gh release upload "$TAG" "$new" --clobber
          done

          # Upload .rpm: rename armhfp → armv7 for clarity
          for f in "$BUNDLE_DIR"/rpm/*.armhfp.rpm; do
            [ -f "$f" ] || continue
            new=$(echo "$f" | sed 's/\.armhfp\.rpm/.armv7.rpm/')
            mv "$f" "$new"
            gh release upload "$TAG" "$new" --clobber
          done

  # ============================================================
  # Finalize Release Notes
  # ============================================================
  # After all builds complete, append the platform download guide and
  # .sig file explanation to the release body. This runs as a separate
  # job because:
  #   1. release-please creates the GitHub Release first with changelog
  #      content, so tauri-action's releaseBody is ignored for existing
  #      releases.
  #   2. We only want to append once (not per-matrix-job).
  #   3. The guide is idempotent — it checks for existing content before
  #      appending.
  finalize-release:
    name: Finalize Release Notes
    needs: publish
    # Run even if some builds failed (ARM builds are allowed to fail)
    if: always() && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          # Shape-validate before the tag is interpolated into downstream
          # run: shells and release commands (#977). Rejects any tag carrying
          # shell metacharacters injected via a workflow_dispatch input.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag format: '$TAG' (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      # Rebuild latest.json from release assets to fix the race condition
      # where parallel tauri-action builds overwrite each other's entries.
      # Each platform build uploads its own latest.json with only its entry,
      # and the last build to finish wins — losing all other platforms.
      # This step reconstructs the complete manifest after all builds finish.
      - name: Rebuild updater manifest (latest.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          REPO="${{ github.repository }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Download the current latest.json to preserve notes and pub_date
          gh release download "$TAG" --repo "$REPO" --pattern "latest.json" --dir /tmp/updater --clobber 2>/dev/null || true

          # Extract existing notes and pub_date (fall back to now if missing)
          if [ -f /tmp/updater/latest.json ]; then
            NOTES=$(jq -r '.notes // ""' /tmp/updater/latest.json)
            PUB_DATE=$(jq -r '.pub_date // ""' /tmp/updater/latest.json)
          fi
          : "${NOTES:=See CHANGELOG.md for details.}"
          : "${PUB_DATE:=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")}"

          # List all release assets to determine which platforms built successfully
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')

          # Start building the platforms JSON object
          PLATFORMS="{}"

          # Helper: download a .sig file content from the release
          download_sig() {
            local sig_name="$1"
            if echo "$ASSETS" | grep -qF "$sig_name"; then
              gh release download "$TAG" --repo "$REPO" --pattern "$sig_name" --dir /tmp/updater --clobber 2>/dev/null
              if [ -f "/tmp/updater/$sig_name" ]; then
                cat "/tmp/updater/$sig_name"
                return 0
              fi
            fi
            return 1
          }

          # macOS ARM64 (darwin-aarch64)
          # Tauri 2.x names the updater bundle after the .app (no version/arch
          # suffix): MeedyaDL.app.tar.gz. This matches the upload step above.
          MAC_SIG_FILE="MeedyaDL.app.tar.gz.sig"
          MAC_URL="${BASE}/MeedyaDL.app.tar.gz"
          if SIG=$(download_sig "$MAC_SIG_FILE"); then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$MAC_URL" \
              '. + {"darwin-aarch64": {"signature": $sig, "url": $url}}')
            echo "Added darwin-aarch64 to latest.json"
          fi

          # Windows x64 (windows-x86_64 + windows-x86_64-nsis)
          WIN_X64_SIG_FILE="MeedyaDL_${VERSION}_x64-setup.exe.sig"
          WIN_X64_URL="${BASE}/MeedyaDL_${VERSION}_x64-setup.exe"
          if SIG=$(download_sig "$WIN_X64_SIG_FILE"); then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$WIN_X64_URL" \
              '. + {"windows-x86_64": {"signature": $sig, "url": $url}, "windows-x86_64-nsis": {"signature": $sig, "url": $url}}')
            echo "Added windows-x86_64 to latest.json"
          fi

          # Windows ARM64 (windows-aarch64 + windows-aarch64-nsis)
          WIN_ARM_SIG_FILE="MeedyaDL_${VERSION}_arm64-setup.exe.sig"
          WIN_ARM_URL="${BASE}/MeedyaDL_${VERSION}_arm64-setup.exe"
          if SIG=$(download_sig "$WIN_ARM_SIG_FILE"); then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$WIN_ARM_URL" \
              '. + {"windows-aarch64": {"signature": $sig, "url": $url}, "windows-aarch64-nsis": {"signature": $sig, "url": $url}}')
            echo "Added windows-aarch64 to latest.json"
          fi

          # Linux x64 (linux-x86_64) — uses AppImage for updater
          LINUX_X64_SIG_FILE="MeedyaDL_${VERSION}_amd64.AppImage.sig"
          LINUX_X64_URL="${BASE}/MeedyaDL_${VERSION}_amd64.AppImage"
          if SIG=$(download_sig "$LINUX_X64_SIG_FILE"); then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$LINUX_X64_URL" \
              '. + {"linux-x86_64": {"signature": $sig, "url": $url}}')
            echo "Added linux-x86_64 to latest.json"
          fi

          # Build the final latest.json
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > /tmp/updater/latest.json

          # Count platforms for logging
          PLATFORM_COUNT=$(jq '.platforms | length' /tmp/updater/latest.json)
          echo "Rebuilt latest.json with ${PLATFORM_COUNT} platform(s)"
          jq '.platforms | keys' /tmp/updater/latest.json

          # Upload the rebuilt manifest (overwrite the incomplete one)
          if [ "$PLATFORM_COUNT" -gt 0 ]; then
            gh release upload "$TAG" /tmp/updater/latest.json --repo "$REPO" --clobber
            echo "Uploaded rebuilt latest.json"
          else
            echo "WARNING: No platform signatures found — skipping latest.json upload"
          fi

      - name: Append download guide to release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          REPO="${{ github.repository }}"

          # Extract the numeric version from the tag (strip leading "v")
          VERSION="${TAG#v}"

          # Base URL for release assets
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Get the current release body
          CURRENT_BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body' 2>/dev/null || echo "")

          # Strip any "Release in progress..." placeholder + the optional
          # `---` separator that follows it (#857). The placeholder is
          # inserted by the macOS / ARMv7 race-guard `gh release create
          # --notes "Release in progress..."` calls earlier in the
          # workflow (lines ~930 / ~998). Without this strip the
          # placeholder becomes persistent in the final body — see the
          # 2026-05-10 release-pipeline-cleanup PR which backfilled 13
          # historical releases that had this issue, and #857 which
          # re-raised it on v1.9.4-alpha.10.
          #
          # Pre-#857 the regex was anchored to `^` (start of body), which
          # missed cases where macOS/ARMv7 won the race AFTER tauri-action
          # had set a proper body — the placeholder would land in the
          # MIDDLE of the body and the anchored strip wouldn't see it.
          # Now we strip the placeholder wherever it appears (one-shot,
          # at the first match) and prune the optional `---` separator
          # that immediately follows it. We also collapse the extra
          # blank lines left behind.
          CURRENT_BODY=$(printf '%s' "$CURRENT_BODY" | python3 -c "
          import re,sys
          body = sys.stdin.read()
          # Strip the placeholder line + optional '---' separator + the
          # blank lines around it. Multiline + non-anchored so a leaked
          # placeholder in the middle of an otherwise-good body still
          # gets removed.
          body = re.sub(r'(?m)^Release in progress[^\n]*\n+(?:---\s*\n+)?', '', body)
          # Collapse any 3+ consecutive newlines down to 2 (one blank
          # line) to keep the resulting body tidy.
          body = re.sub(r'\n{3,}', '\n\n', body)
          # Strip leading blank lines that the placeholder removal left behind.
          body = body.lstrip('\n')
          sys.stdout.write(body)
          ")

          # Detect whether the body looked broken before the strip.
          # If the placeholder appeared anywhere, we need to write the
          # cleaned body back even if the download guide is already
          # present (because the guide check comes BEFORE the cleanup
          # write in the legacy flow). Set a flag the post-cleanup
          # branch reads.
          if gh release view "$TAG" --repo "$REPO" --json body --jq '.body' \
            | grep -q "Release in progress"; then
            NEEDS_PLACEHOLDER_CLEANUP="1"
          else
            NEEDS_PLACEHOLDER_CLEANUP="0"
          fi

          # Check if the download guide has already been appended (idempotent).
          # If so AND no placeholder cleanup is needed → exit clean. If a
          # placeholder is still present (NEEDS_PLACEHOLDER_CLEANUP=1) we
          # fall through and call `gh release edit` with just the cleaned
          # body (no new guide appended) so the placeholder is removed.
          if echo "$CURRENT_BODY" | grep -q "Choose your download"; then
            if [ "$NEEDS_PLACEHOLDER_CLEANUP" = "1" ]; then
              echo "Download guide already present BUT placeholder leaked into body — cleaning."
              gh release edit "$TAG" --repo "$REPO" --notes "$CURRENT_BODY"
              echo "Placeholder cleaned for $TAG (guide preserved)."
            else
              echo "Download guide already present in release notes. Skipping."
            fi
            exit 0
          fi

          # Build the download guide with platform emojis and direct download
          # links. This mirrors the releaseBody template used by tauri-action
          # (lines 512-550) but is needed here because release-please creates
          # the GitHub Release before tauri-action runs, so tauri-action's
          # releaseBody is ignored for existing releases.
          # Uses a double-quoted heredoc for variable expansion ($VERSION, $BASE).
          # The table + platform-specific tips are wrapped in a <details>
          # block (#1046 G3) so a thin release body isn't dominated by a
          # full-height table below the fold — but the "## Choose your
          # download" HEADING itself stays literal and directly after the
          # "---" divider, unchanged, because three other things key on
          # that exact shape: the idempotence grep just above (`grep -q
          # "Choose your download"`), scripts/release-notes/splice-body.py
          # (divider regex expects `\n---\n\n## Choose your download`
          # with nothing in between), and the placeholder-leak verify step
          # below. Only the collapsible wrapper is new; nothing above it moves.
          DOWNLOAD_GUIDE=$(cat <<GUIDE_EOF

          ---

          ## Choose your download

          <details>
          <summary>Download links for all platforms</summary>

          | If you're using... | Download this | Notes |
          |--------------------|--------------|-------|
          | 🍎 **Mac** (M1, M2, M3, M4) | [MeedyaDL_${VERSION}_aarch64.dmg](${BASE}/MeedyaDL_${VERSION}_aarch64.dmg) | Most Macs since late 2020 |
          | 🪟 **Windows** (most PCs) | [MeedyaDL_${VERSION}_x64-setup.exe](${BASE}/MeedyaDL_${VERSION}_x64-setup.exe) | Works on all modern Windows PCs |
          | 🪟 **Windows** (Snapdragon / ARM) | [MeedyaDL_${VERSION}_arm64-setup.exe](${BASE}/MeedyaDL_${VERSION}_arm64-setup.exe) | Surface Pro X, Snapdragon laptops |
          | 🐧 **Linux** (most PCs) | [MeedyaDL_${VERSION}_amd64.deb](${BASE}/MeedyaDL_${VERSION}_amd64.deb) or [.AppImage](${BASE}/MeedyaDL_${VERSION}_amd64.AppImage) | Ubuntu, Debian, Mint, Pop!_OS |
          | 🐧 **Linux** (RPM-based) | [MeedyaDL-${VERSION}-1.x86_64.rpm](${BASE}/MeedyaDL-${VERSION}-1.x86_64.rpm) | Fedora, RHEL, CentOS, openSUSE |
          | 🐧 **Linux** (Raspberry Pi 4/5) | [MeedyaDL_${VERSION}_arm64.deb](${BASE}/MeedyaDL_${VERSION}_arm64.deb) or [.aarch64.rpm](${BASE}/MeedyaDL-${VERSION}-1.aarch64.rpm) | Requires 64-bit OS |
          | 💻 **Chromebook** | [MeedyaDL_${VERSION}_amd64.deb](${BASE}/MeedyaDL_${VERSION}_amd64.deb) | Install via Linux (Crostini) |

          > **Not sure which to pick?** Most Mac users want the \`.dmg\`. Most Windows users want \`_x64-setup.exe\`. Most Linux desktop users want the \`.deb\` or \`.AppImage\`.

          > **Windows ARM64 users**: The \`_x64-setup.exe\` also works on ARM64 via Windows' built-in emulation layer.

          > **Raspberry Pi users**: You may need to install [GDebi](https://packages.debian.org/gdebi) to install \`.deb\` packages with dependencies: \`sudo apt install gdebi-core && sudo gdebi MeedyaDL_*_arm64.deb\`

          ### What are the \`.sig\` files?

          Files ending in \`.sig\` are **cryptographic signatures** used by MeedyaDL's built-in auto-updater. They verify that downloaded updates haven't been tampered with. **You do not need to download \`.sig\` files** — they are used automatically by the app when checking for updates. The \`latest.json\` file is also part of the auto-update system and can be ignored.

          ### macOS Users

          The macOS \`.dmg\` is code-signed and notarized by Apple. If macOS still shows a security warning on an unsigned development build, right-click the app and choose **Open**, or run:
          \`\`\`
          xattr -cr /Applications/MeedyaDL.app
          \`\`\`

          ### First-Time Users

          On first launch, MeedyaDL will guide you through a setup wizard that downloads Python, GAMDL, and required tools automatically. You will also need to provide your Apple Music cookies exported from your browser — see the in-app help for instructions.

          </details>
          GUIDE_EOF
          )

          # Strip leading whitespace from heredoc indentation
          DOWNLOAD_GUIDE=$(echo "$DOWNLOAD_GUIDE" | sed 's/^          //')

          # Append the guide to the existing body
          NEW_BODY="${CURRENT_BODY}${DOWNLOAD_GUIDE}"

          # Update the release
          gh release edit "$TAG" --repo "$REPO" --notes "$NEW_BODY"
          echo "Download guide appended to release notes for $TAG"

      # Verify the placeholder is not still leaking into the published body (#857).
      #
      # CI safety net for the "Release in progress..." placeholder bug.
      # The strip + cleanup branches above should always remove it, but the
      # race surface is broad enough that a regression could go unnoticed
      # for several release cycles (it did between PR #741 in 2026-05-10 and
      # the v1.9.4-alpha.10 incident on 2026-05-22). This step fetches the
      # final published body and fails the job loudly if the placeholder
      # string survived — catching the bug at release time instead of
      # waiting for a user to notice their changelog is a stub.
      - name: Verify placeholder did not leak into release body
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          REPO="${{ github.repository }}"
          BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body' 2>/dev/null || echo "")
          if [ -z "$BODY" ]; then
            echo "::warning::Could not fetch release body for $TAG — skipping placeholder check"
            exit 0
          fi
          if echo "$BODY" | grep -q "Release in progress"; then
            echo "::error::Release body for $TAG still contains the 'Release in progress' placeholder."
            echo "::error::This is the #857 / PR #741 regression — the strip-and-replace logic in finalize-release is not catching every race."
            echo "::error::Recover with: gh release edit $TAG --repo $REPO --notes-file /path/to/proper-notes.md"
            echo "--- offending body (first 30 lines) ---"
            echo "$BODY" | head -30
            exit 1
          fi
          echo "✓ No placeholder leak detected in $TAG release body"

      # Auto-publish prerelease drafts (#646).
      #
      # tauri-action creates the GitHub Release as a draft and never publishes
      # it. For STABLE releases (tag matches `vX.Y.Z` exactly), `release-please-
      # action` publishes the release object itself before this workflow runs,
      # so the draft state is irrelevant. For PRERELEASES (`vX.Y.Z-{nightly|
      # weekly|monthly|alpha|beta|rc}.N` etc.) there is no release-please-action
      # involvement — the draft sits unpublished forever, and end-users see
      # only the source-archive auto-attachments on the public tag page.
      #
      # This step flips draft→published for any prerelease tag. Stable tags are
      # deliberately left alone — `version-bump.yml`'s gap is fixed separately
      # in #645 (pre-create the release object before the tag push).
      #
      # Idempotent: skips releases that are already published, so re-running
      # the workflow on the same tag is safe.
      - name: Auto-publish prerelease draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          REPO="${{ github.repository }}"

          # Prerelease tags carry a hyphen suffix (`-nightly.YYYYMMDD`,
          # `-alpha.N`, `-rc.N`, etc.) immediately after the `vX.Y.Z` core.
          # Stable tags are bare semver (`v1.2.3`).
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "Stable tag $TAG — leaving draft state alone (handled by release-please / #645)"
            exit 0
          fi

          IS_DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)
          if [ "$IS_DRAFT" != "true" ]; then
            echo "Prerelease $TAG is already published — no action"
            exit 0
          fi

          echo "Publishing prerelease draft: $TAG"
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "Published $TAG as a public prerelease"
