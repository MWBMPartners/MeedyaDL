# Update Security Policy Workflow for MeedyaDL
# ============================================
#
# Regenerates the "Supported Versions" table in SECURITY.md so it always
# reflects the current shipping version, with no manual edits required.
#
# Trigger:
#   - On every push to `main` that touches `package.json` (catches version
#     bumps merged via release-please or manual override).
#   - On every tag push of `v*` (catches the tag created by release-please
#     and by the channel-specific release workflows).
#   - Manual `workflow_dispatch`.
#
# Rules (matches the user-defined support criteria):
#   - If current version is `0.x.y`: supported = ">= 0.x.y" (the current
#     latest 0.x.y or newer). Anything older is unsupported.
#   - If current version is `1.0.0` or higher: supported = "{version}" (the
#     current full release only). Everything else is unsupported.
#
# The workflow rewrites the section between two sentinel HTML comments:
#   <!-- BEGIN supported-versions -->
#   ... generated table ...
#   <!-- END supported-versions -->
#
# When the regenerated table differs from the file, the workflow commits
# `docs(security): update supported versions to {version} [skip ci]` and
# pushes back to main. `[skip ci]` prevents recursive workflow triggering.

name: Update Security Policy

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-security-policy
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate supported-versions table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute supported-versions table
        id: table
        run: |
          set -euo pipefail
          # Read base version from package.json, strip pre-release suffix.
          BASE=$(node -p "require('./package.json').version")
          BASE="${BASE%%-*}"
          MAJOR="${BASE%%.*}"

          # Build the table rows per the support rules.
          if [ "$MAJOR" = "0" ]; then
            # Pre-1.0: support latest 0.x.y or newer.
            BLOCK=$(cat <<EOF
| Version       | Supported          |
| ------------- | ------------------ |
| >= ${BASE}    | :white_check_mark: |
| < ${BASE}     | :x:                |
EOF
)
          else
            # 1.0+: support only the current full release.
            BLOCK=$(cat <<EOF
| Version       | Supported          |
| ------------- | ------------------ |
| ${BASE}       | :white_check_mark: |
| != ${BASE}    | :x:                |
EOF
)
          fi

          # Write the generated block to a temp file so the next step can
          # splice it into SECURITY.md without escaping headaches.
          {
            echo "<!-- BEGIN supported-versions -->"
            echo "<!-- This table is auto-generated by .github/workflows/update-security-policy.yml."
            echo "     Manual edits between the BEGIN/END markers will be overwritten. The rules:"
            echo "       - While the project is on 0.x.y: support the current latest 0.x.y or newer."
            echo "       - At 1.0.0+: support only the current full (stable) release. -->"
            echo "$BLOCK"
            echo "<!-- END supported-versions -->"
          } > /tmp/supported-versions.md

          echo "version=$BASE" >> "$GITHUB_OUTPUT"

      - name: Splice into SECURITY.md
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          path = pathlib.Path("SECURITY.md")
          content = path.read_text()
          generated = pathlib.Path("/tmp/supported-versions.md").read_text().rstrip("\n")

          pattern = re.compile(
              r"<!-- BEGIN supported-versions -->.*?<!-- END supported-versions -->",
              re.DOTALL,
          )
          if not pattern.search(content):
              print("ERROR: SECURITY.md is missing BEGIN/END supported-versions sentinels", file=sys.stderr)
              sys.exit(1)

          new_content = pattern.sub(generated, content)
          if new_content != content:
              path.write_text(new_content)
              print("SECURITY.md updated.")
          else:
              print("SECURITY.md already up to date.")
          PY

      - name: Commit and push if changed
        env:
          VERSION: ${{ steps.table.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- SECURITY.md; then
            echo "No SECURITY.md changes — skipping commit."
            exit 0
          fi
          git add SECURITY.md
          git commit -m "docs(security): update supported versions to ${VERSION} [skip ci]"
          # Rebase against any commits that landed during this run, then push.
          git pull --rebase origin main
          git push origin main
