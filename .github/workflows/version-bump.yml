# Version Bump & Release Trigger Workflow for MeedyaDL (MANUAL OVERRIDE)
# =========================================================================
#
# NOTE: For normal releases, use the automated release-please workflow
# (release-please.yml) which creates Release PRs from conventional commits.
#
# Use this workflow when you need to:
#   - Force a specific version number (e.g., 1.0.0 for a major launch)
#   - Bypass the Release PR process for hotfixes
#   - Recover from a failed automated release
#
# This workflow automates the entire release process with a single command:
#   1. Bumps the version in all source files (package.json, tauri.conf.json, Cargo.toml, Cargo.lock)
#   2. Commits the version bump with a conventional commit message
#   3. Creates an annotated git tag (e.g., v1.2.0)
#   4. Pushes both the commit and tag to origin
#   5. The tag push automatically triggers the Release workflow (release.yml)
#
# Usage (GitHub CLI):
#   gh workflow run "Version Bump" -f bump=patch     # 0.1.0 → 0.1.1
#   gh workflow run "Version Bump" -f bump=minor     # 0.1.0 → 0.2.0
#   gh workflow run "Version Bump" -f bump=major     # 0.1.0 → 1.0.0
#   gh workflow run "Version Bump" -f bump=1.0.0     # Explicit version
#
# Or trigger from the GitHub Actions UI → "Version Bump" → "Run workflow".
#
# IMPORTANT PREREQUISITE:
#   This workflow requires a Personal Access Token (PAT) stored as the
#   repository secret `RELEASE_PAT`. This is necessary because pushes made
#   with the default GITHUB_TOKEN do NOT trigger other workflows (GitHub's
#   infinite-loop prevention). The PAT allows the tag push to trigger release.yml.
#
#   To set up:
#     1. Go to GitHub → Settings → Developer Settings → Personal Access Tokens
#     2. Create a fine-grained token with "Contents: Read and write" permission
#        for the MeedyaDL repository
#     3. Add it as a repository secret named RELEASE_PAT:
#        Repository → Settings → Secrets and variables → Actions → New repository secret
#
# The version bump commit uses the message "chore(release): vX.Y.Z" which is
# filtered out of the changelog by cliff.toml's commit_parsers configuration.
#
# @see .github/workflows/release.yml -- The release workflow triggered by the tag push
# @see scripts/bump-version.mjs -- The version bump script that updates all files
# @see cliff.toml -- Changelog config that filters chore(release) commits

name: Version Bump

# ============================================================
# Trigger: Manual dispatch only
# ============================================================
# workflow_dispatch allows triggering from the GitHub UI or gh CLI.
# The 'bump' input accepts: major, minor, patch, or an explicit version.
# @see https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump type (major, minor, patch) or explicit version (e.g., 1.2.0)'
        required: true
        type: string

# permissions: contents: write is required to push commits and tags.
permissions:
  contents: write

jobs:
  bump:
    name: Bump Version & Tag
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the full repository history.
      # fetch-depth: 0 ensures all tags are available for accurate version parsing.
      # The RELEASE_PAT token is used instead of GITHUB_TOKEN so that the push
      # in step 5 triggers the release workflow (release.yml).
      # @see https://github.com/actions/checkout
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      # Step 2: Set up Node.js to run the version bump script.
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 'lts/*'

      # Step 3: Run the bump script to update all version files.
      # The script updates package.json, tauri.conf.json, Cargo.toml, and Cargo.lock,
      # then prints the new version to stdout which we capture as a step output.
      - name: Bump version
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          NEW_VERSION=$(node scripts/bump-version.mjs "$BUMP_TYPE")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped version to v$NEW_VERSION"

      # Step 4: Commit the version bump.
      # The commit message "chore(release): vX.Y.Z" is filtered by cliff.toml
      # so it never appears in the auto-generated CHANGELOG.md.
      # We deliberately do NOT create a local annotated tag here; the tag is
      # created on the remote in step 6 by `gh release create`, which makes
      # the tag and the GitHub Release object atomically.
      - name: Commit version bump
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Step 5: Push the commit (without any tag yet) to origin.
      # The tag is deliberately created later by `gh release create` so that
      # the GitHub Release object exists *before* `release.yml` is triggered
      # — see step 6's comment for why.
      - name: Push commit
        run: git push origin main

      # Step 6: Pre-create the GitHub Release object as a draft (#645).
      #
      # WHY this exists:
      #   `release.yml` runs six platform-build jobs in parallel via
      #   tauri-action. Each job's `tauri-action@v0` calls `gh release
      #   view` first; if no release exists for the tag, it falls back to
      #   `gh release create --draft …`. When two jobs hit that fallback
      #   simultaneously (which happens on every manual `version-bump.yml`
      #   run because there is no release-please-action to pre-create the
      #   release), GitHub's API races each other and creates two-or-three
      #   separate draft releases for the same tag, fragmenting installer
      #   assets across them. v0.49.1 and v0.49.2 both shipped this way —
      #   v0.49.1's published release was missing 14 of 20 installers
      #   until 2026-04-28; v0.49.2 sat as three competing drafts until
      #   the same date. See #645 for the full audit.
      #
      # `gh release create` creates the tag *and* the draft release
      # atomically through one API call. When `release.yml` triggers from
      # the resulting tag-create event, every platform job's
      # `gh release view` finds the same existing draft and attaches its
      # assets to it, so no race, no fragmentation.
      #
      # The placeholder `--notes` are intentionally short. `release.yml`'s
      # `Finalize Release Notes` step appends a download guide at the end
      # of the build, and `changelog.yml` regenerates CHANGELOG.md with
      # full git-cliff content on the next commit. If a maintainer wants
      # richer release notes for a manual version-bump release, they can
      # `gh release edit "$TAG" --notes "…"` after the build completes.
      #
      # Stable releases stay as drafts post-creation so the maintainer can
      # review platform artifacts and notes before publishing — `version-
      # bump.yml` is the manual override / hotfix path, not the standard
      # automated release path. The standard `release-please-action` path
      # publishes the release itself.
      - name: Pre-create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          gh release create "$TAG" \
            --target "${{ steps.commit.outputs.sha }}" \
            --draft \
            --title "$TAG" \
            --notes "Release $TAG — build in progress."
          echo "Pre-created draft release for $TAG at ${{ steps.commit.outputs.sha }}"

      # Step 6: Print a summary for the workflow run log.
      - name: Summary
        run: |
          echo "### Version Bump Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **New version**: v${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: v${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release workflow**: Should be triggered automatically" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the [Release workflow](../release.yml) for build status." >> "$GITHUB_STEP_SUMMARY"
