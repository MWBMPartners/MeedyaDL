#
# Preserve Release-Please PR Body — RETIRED (kept as a signpost, not a job)
# ==========================================================================
#
# This workflow used to do two things, both of them by reading a hand-
# written file from `.github/release-drafts/vX.Y.Z.md`:
#
#   1. Overwrite the body of the open release-please pull request with that
#      file, every time release-please force-pushed its branch (which wipes
#      any manual edit to the PR body).
#   2. As a safety net, overwrite the body of the published GitHub Release
#      itself with the same file, in case (1) missed the race.
#
# Neither of those is how this project writes release notes any more, and
# checking that before touching this file is what turned up why it had to
# go, not just be tidied:
#
#   - `.github/release-drafts/` — the folder this workflow reads from — was
#     last written to for v1.9.4. `.github/release-notes/` — the folder
#     every current mechanism actually uses — has a file for every release
#     since, up to and past v1.13.0. Nobody had written a drafts file in
#     roughly ten months of releases, so for all of that time both jobs in
#     this workflow took their "file not found, leaving it alone" branch on
#     every single run and reported success while doing nothing. A
#     workflow that always reports green while never doing its job is worse
#     than one that is honestly switched off, because nothing about a green
#     run tells you that.
#   - The real replacement already exists and is more careful than this
#     workflow ever was. `.github/workflows/release.yml`'s `ensure-release`
#     job applies `.github/release-notes/v<tag>.md` to the release body —
#     footer-preserving and idempotent, via `scripts/release-notes/
#     apply-notes.sh` and `scripts/release-notes/splice-body.py` — and can
#     also self-heal a prerelease body that looks like raw commit text. A
#     stable release with no curated file is refused loudly (`::error::`)
#     rather than silently shipping commit-speak. If this workflow had kept
#     running on real data, its job 2 would have been racing that logic —
#     "whichever one runs last wins" — over the exact same release body,
#     which is a bug waiting to happen, not a safety net.
#   - The PR-body half (job 1) solved a problem this project no longer
#     tries to solve that way. `.github/workflows/release-note-gate.yml`'s
#     `release-pr-notes-file` job now REQUIRES the curated notes file to
#     already be merged to `main`, reviewed in its OWN pull request, before
#     the release-please PR is allowed to merge. Nobody needs the
#     release-please PR itself to look pretty any more, because the human
#     review of the actual words happens somewhere else, earlier, and is
#     enforced by a check rather than hoped for.
#   - The drafts-file content was also never linted. `.github/release-notes/`
#     files are checked by `scripts/release-notes/lint-notes.py` (wired
#     into `release-note-gate.yml`) for things like accidentally revealing
#     how a feature is built. A rewritten workflow that pointed this file's
#     job 2 at `.github/release-notes/` instead would have published that
#     folder's content through a path with none of that checking — a
#     second, weaker way of doing the one thing `release.yml` already does
#     properly. Better to have one path than two that can drift apart; a
#     comment near the top of this repo's updater-manifest script explains
#     the same lesson learned the same way, the hard way.
#
# What is actually lost by retiring this: nothing that still does anything
# today. The `.github/release-drafts/*.md` files already committed are left
# in place as a historical record of what shipped in past releases; see
# `.github/release-drafts/README.md`, which has been updated to say the
# same thing this comment does. The manual re-apply command this workflow
# used to offer — `gh workflow run "Preserve Release-Please PR Body"` — is
# replaced by `bash scripts/release-notes/apply-notes.sh vX.Y.Z`, which is
# the exact command `.claude/CLAUDE.md`'s release workflow notes already
# tell you to run for a post-hoc fix.
#
# The file is kept, rather than deleted outright, purely so that a command
# typed from old habit — `gh workflow run "Preserve Release-Please PR
# Body"` — prints this explanation and points at the current mechanism,
# instead of failing with "workflow not found" and no clue why.

name: Preserve Release-Please PR Body

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: This workflow is retired — see the header comment
    runs-on: ubuntu-latest
    steps:
      - name: Explain the retirement
        run: |
          echo "::notice::This workflow no longer does anything. It used to rewrite the release-please PR body and the published release body from .github/release-drafts/vX.Y.Z.md, but that folder has not been used since v1.9.4."
          echo "::notice::The current mechanism: write .github/release-notes/vX.Y.Z.md, get it merged to main (release-note-gate.yml requires this before the release-please PR can merge), and release.yml's ensure-release job applies it to the release automatically."
          echo "::notice::To re-apply notes to an already-published release by hand: bash scripts/release-notes/apply-notes.sh vX.Y.Z"
          echo "See the header comment in this file for the full reasoning."
