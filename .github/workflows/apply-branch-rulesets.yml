#
# Apply Branch Rulesets
# =====================
#
# Idempotently applies every JSON ruleset under `.github/rulesets/` to the
# repository. Run manually after editing a ruleset file, or on push when
# one of them changes. Each ruleset's `name` field is used to detect an
# existing ruleset on the repo: present → PUT update, absent → POST create.
#
# Rulesets committed in this repo:
#   - protected-stable-branches.json
#       Strict protection for main, release-candidate, beta, alpha. No bypass
#       actors — these branches must never receive a force-push from automation.
#
# Note: protected-cron-channels.json (formerly covering nightly/weekly/monthly
# with admin bypass) was removed in v1.11.0 along with the cron channels
# themselves. The reconciliation logic below will auto-delete the leftover
# ruleset on the GitHub side the first time this workflow runs after that
# change merges, because the source-tree no longer contains the
# `protected-cron-channels` ruleset name.
#
# After applying source-tree rulesets, any BRANCH-targeted ruleset on the
# repo whose name is NOT present in the source tree is deleted. A ruleset
# that targets tags (for example, protection on release tags set up through
# the GitHub web page) is never looked at by this workflow at all — see the
# comment above the reconciliation step below for why that distinction has
# to be made in the code, not just claimed in a comment. This is what
# cleans up the legacy `protected-release-branches` ruleset after the split
# landed (and now also the legacy `protected-cron-channels` ruleset).
#
# Requires: RELEASE_PAT with `administration:write` scope on the repo.

name: Apply Branch Rulesets

on:
  push:
    branches: [main]
    paths:
      - '.github/rulesets/*.json'
      - '.github/workflows/apply-branch-rulesets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Apply rulesets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # List existing rulesets (name → id map). Filtered to
          # target == "branch" here, at the one place this list is built,
          # so every later step — the create/update lookup just below, and
          # the delete-what's-unmanaged step further down — only ever sees
          # branch rulesets. GitHub's rulesets API returns tag rulesets and
          # push rulesets in the same list as branch ones; a tag ruleset
          # (protection on release tags set up through the GitHub web page
          # is the real example on this repo) was previously being read
          # into this same map and then deleted by the reconciliation step
          # below purely because its name did not happen to match one of
          # our `.github/rulesets/*.json` files — which it never could,
          # since those files only ever describe branch rules. Filtering
          # here means a tag ruleset is never even a candidate for delete.
          EXISTING=$(gh api "repos/$REPO/rulesets" --jq '[.[] | select(.target == "branch")] | map({ (.name): .id }) | add // {}')

          # Collect the set of names defined in the source tree so we can
          # reconcile (delete unmanaged rulesets) after applying.
          SOURCE_NAMES=()

          for FILE in .github/rulesets/*.json; do
            NAME=$(jq -r '.name' "$FILE")
            SOURCE_NAMES+=("$NAME")
            echo "::group::$NAME ($FILE)"

            # Strip comment-only fields (keys starting with _) before sending
            PAYLOAD=$(jq 'with_entries(select(.key | startswith("_") | not))' "$FILE")

            ID=$(echo "$EXISTING" | jq -r --arg n "$NAME" '.[$n] // empty')
            if [ -n "$ID" ]; then
              echo "Updating existing ruleset id=$ID"
              echo "$PAYLOAD" | gh api -X PUT "repos/$REPO/rulesets/$ID" --input -
            else
              echo "Creating new ruleset"
              echo "$PAYLOAD" | gh api -X POST "repos/$REPO/rulesets" --input -
            fi
            echo "::endgroup::"
          done

          # Reconcile: delete any BRANCH ruleset on the repo whose name is
          # not present in the source tree. This cleans up renamed / split /
          # removed rulesets without manual intervention.
          #
          # $EXISTING was already filtered to target == "branch" above, so
          # a tag ruleset (or any other non-branch ruleset) never reaches
          # this step and is never a delete candidate — every branch
          # ruleset genuinely IS meant to be source-controlled in
          # `.github/rulesets/*.json`, which was the intent all along;
          # what was missing was making the code match that intent instead
          # of just asserting it in a comment while also deleting tag
          # rulesets a line below.
          UNMANAGED=$(echo "$EXISTING" | jq -r --argjson keep "$(printf '%s\n' "${SOURCE_NAMES[@]}" | jq -R . | jq -s .)" \
            'to_entries | map(select(.key as $k | $keep | index($k) | not)) | .[] | "\(.key)\t\(.value)"')
          if [ -n "$UNMANAGED" ]; then
            # A delete that fails should fail the run, not just leave a
            # warning buried in the log that nobody reads. We keep going
            # through the rest of the list (so one bad delete doesn't stop
            # the others from being cleaned up) but remember that it
            # happened, and fail the job at the end if it did.
            DELETE_FAILED=0
            while IFS=$'\t' read -r NAME ID; do
              echo "::group::Deleting unmanaged ruleset: $NAME (id=$ID)"
              if ! gh api -X DELETE "repos/$REPO/rulesets/$ID"; then
                echo "::error::Failed to delete ruleset $NAME (id=$ID)"
                DELETE_FAILED=1
              fi
              echo "::endgroup::"
            done <<< "$UNMANAGED"
            if [ "$DELETE_FAILED" = "1" ]; then
              echo "::error::One or more unmanaged rulesets could not be deleted — see the errors above."
              exit 1
            fi
          else
            echo "No unmanaged rulesets to clean up."
          fi
