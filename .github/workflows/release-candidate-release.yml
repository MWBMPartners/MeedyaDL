# Release-Candidate Release Workflow for MeedyaDL
# ===============================================
#
# Identical to `alpha-release.yml` except:
#   - Triggered on push to `release-candidate` branch
#   - Tag suffix: `-rc.N` (monotonic, never resets)
#
# RC builds map to the `Rc` tier in the in-app update channel — between
# Beta and Stable. RC subscribers receive RC and Stable releases only;
# they do not receive Beta releases.
#
# See alpha-release.yml header for design rationale.

name: Release-Candidate Release

on:
  push:
    branches: [release-candidate]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run version bump locally but skip the tag push'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-candidate-release
  cancel-in-progress: false

jobs:
  rc:
    name: Build release-candidate tag
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout release-candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: release-candidate
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next rc version
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version")
          BASE="${BASE%%-*}"
          MAX=$(gh api "repos/$REPO/tags" --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' \
            | sed -E 's/.*-rc\.([0-9]+)$/\1/' \
            | sort -n | tail -1 || echo 0)
          MAX="${MAX:-0}"
          NEXT=$((MAX + 1))
          VERSION="${BASE}-rc.${NEXT}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "counter=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch version in manifests
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const v = process.env.NEW_VERSION;
            for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(readFileSync(p, 'utf8'));
              j.version = v;
              writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "
          python3 - <<PY
          import re, pathlib, os
          p = pathlib.Path('src-tauri/Cargo.toml')
          t = p.read_text()
          t = re.sub(r'(?m)^version\s*=\s*"[^"]*"', f'version = "{os.environ["NEW_VERSION"]}"', t, count=1)
          p.write_text(t)
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Regenerate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit version bump
        run: |
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          # `[skip ci]` is critical: this push lands on the same `release-candidate`
          # branch that triggers this workflow, and our `RELEASE_PAT` causes
          # GitHub to attribute the bot's push to the PAT owner (a human
          # account), which defeats the `if: github.actor != 'github-actions[bot]'`
          # guard at the job level. Without `[skip ci]` the workflow loops:
          # a single human push produces N consecutive RC tags before someone
          # notices (rc.1 → rc.2 → … → rc.21 occurred on 2026-05-08).
          # The marker is parsed at GitHub's trigger layer so the workflow
          # is never even queued for the bot's own push. Belt-and-braces with
          # the existing actor check.
          git commit -m "chore(rc): ${{ steps.version.outputs.version }} [skip ci]"

      - name: Push release-candidate branch and tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git push origin release-candidate
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release Candidate ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Release Candidate Build"
            echo ""
            echo "- **Tag:** \`${{ steps.version.outputs.tag }}\`"
            echo "- **Channel:** rc"
            echo "- **Counter:** ${{ steps.version.outputs.counter }}"
            echo "- **Base version:** ${{ steps.version.outputs.base }}"
          } >> "$GITHUB_STEP_SUMMARY"
