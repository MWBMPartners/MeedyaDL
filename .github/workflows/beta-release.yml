# Beta Release Workflow for MeedyaDL
# ==================================
#
# Identical to `alpha-release.yml` except:
#   - Triggered on push to `beta` branch
#   - Tag suffix: `-beta.N` (monotonic, never resets)
#
# See alpha-release.yml header for design rationale.

name: Beta Release

on:
  push:
    branches: [beta]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run version bump locally but skip the tag push'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  beta:
    name: Build beta tag
    runs-on: ubuntu-latest
    # Stop this workflow re-triggering on the version-bump commit it pushes
    # itself. Without a working guard here the channel runs away: release
    # candidate did exactly that once, cutting rc.22 through rc.34 in minutes.
    #
    # The guard MUST match on the commit subject, not on who pushed. The push
    # uses RELEASE_PAT, so GitHub attributes it to the token owner — a human
    # account — and the old `github.actor != 'github-actions[bot]'` test below
    # never matched. That is why `[skip ci]` was added to the bump commit as a
    # belt-and-braces measure, and `[skip ci]` is what silently killed this
    # whole channel: it also stopped the tag push from starting a build, so
    # v1.9.4-beta.1, .2 and .3 were tagged and produced nothing at all.
    #
    # Matching `chore(beta): ` AND `-beta.` together is deliberate. Matching
    # the prefix alone would also swallow a human commit such as
    # "chore(beta): combined housekeeping", which is how PR #954 was silently
    # suppressed on the alpha channel. A human subject never carries the
    # `-beta.` version suffix.
    #
    # workflow_dispatch always proceeds so a maintainer can force a build.
    if: |
      github.event_name == 'workflow_dispatch' ||
      !(startsWith(github.event.head_commit.message, 'chore(beta): ') && contains(github.event.head_commit.message, '-beta.'))
    steps:
      - name: Checkout beta
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next beta version
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version")
          BASE="${BASE%%-*}"
          MAX=$(gh api "repos/$REPO/tags" --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' \
            | sed -E 's/.*-beta\.([0-9]+)$/\1/' \
            | sort -n | tail -1 || echo 0)
          MAX="${MAX:-0}"
          NEXT=$((MAX + 1))
          VERSION="${BASE}-beta.${NEXT}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "counter=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch version in manifests
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const v = process.env.NEW_VERSION;
            for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(readFileSync(p, 'utf8'));
              j.version = v;
              writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          "
          python3 - <<PY
          import re, pathlib, os
          p = pathlib.Path('src-tauri/Cargo.toml')
          t = p.read_text()
          t = re.sub(r'(?m)^version\s*=\s*"[^"]*"', f'version = "{os.environ["NEW_VERSION"]}"', t, count=1)
          p.write_text(t)
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Regenerate Cargo.lock
        # Update ONLY this package's own entry in the lockfile.
        #
        # `cargo generate-lockfile` re-resolves EVERY dependency to the
        # newest version its range allows. That is how stable v1.10.5 broke:
        # it quietly moved two halves of the app toolkit to different
        # versions while the JavaScript half stayed put, and all six platform
        # builds then refused to build (#1134). A release bump should change
        # one version number and nothing else.
        #
        # The version comes in as an environment variable from the step that
        # already computed it. Do NOT read package.json here: this step runs
        # inside src-tauri and package.json lives in the repository root, so
        # reading it from here fails and, under `set -e`, would stop every
        # beta release before the commit and tag. Same shape alpha uses.
        working-directory: src-tauri
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: cargo update --package meedyadl --precise "$NEW_VERSION"

      - name: Commit version bump
        run: |
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          # NO `[skip ci]` here. It used to be present, to stop this
          # workflow re-triggering on its own push. It did that — but it
          # ALSO stopped the release build from ever starting, because
          # GitHub applies the skip rule to every workflow triggered by
          # that push, including the tag push that release.yml listens for.
          #
          # The result was a silently dead channel: v1.9.4-beta.1, .2 and .3
          # were all tagged, and not one of them produced a release, a
          # download, or even a build. Nobody was told.
          #
          # Self-triggering is now prevented by the job-level `if:` guard at
          # the top of this job instead, which gates only THIS workflow and
          # leaves the tag push free to start the build. Same fix alpha and
          # release-candidate already carry (#937).
          git commit -m "chore(beta): ${{ steps.version.outputs.version }}"

      - name: Push beta branch and tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git push origin beta
          git tag -a "${{ steps.version.outputs.tag }}" -m "Beta ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Beta Build"
            echo ""
            echo "- **Tag:** \`${{ steps.version.outputs.tag }}\`"
            echo "- **Channel:** beta"
            echo "- **Counter:** ${{ steps.version.outputs.counter }}"
            echo "- **Base version:** ${{ steps.version.outputs.base }}"
          } >> "$GITHUB_STEP_SUMMARY"
