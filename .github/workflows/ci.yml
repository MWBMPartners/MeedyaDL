# Continuous Integration (CI) Workflow for MeedyaDL
# ===================================================
#
# This GitHub Actions workflow validates code quality on every push and pull request.
# It runs two independent job groups in parallel:
#
#   1. Frontend (Node.js/TypeScript/React):
#      - ESLint linting (eslint.config.js rules)
#      - TypeScript type checking (tsconfig.json)
#      - Vitest unit tests (vitest.config.ts)
#
#   2. Backend (Rust/Tauri):
#      - cargo check (compilation verification)
#      - cargo clippy (Rust linter with warnings-as-errors)
#      - cargo deny (licence scanning and security advisory auditing)
#      - cargo test (Rust unit tests)
#
# Both job groups run on a 3x3 matrix across macOS, Windows, and Linux to catch
# platform-specific issues. The frontend and backend jobs run independently
# (no dependency between them) for maximum parallelism.
#
# Cost Optimization:
#   - 'fail-fast: false' ensures all matrix combinations run even if one fails,
#     giving a complete picture of what's broken across platforms.
#   - npm and Cargo caches reduce reinstallation time on subsequent runs.
#   - Concurrency groups cancel in-progress runs when new commits are pushed.
#
# Related config files:
#   - eslint.config.js    -- Defines the lint rules enforced by 'npm run lint'
#   - vitest.config.ts    -- Test runner configuration for 'npm run test'
#   - tsconfig.json       -- TypeScript options for 'npm run type-check'
#   - src-tauri/Cargo.toml -- Rust dependencies compiled by cargo check/clippy/test
#   - src-tauri/deny.toml  -- cargo-deny config for licence/advisory checks
#
# @see https://docs.github.com/en/actions -- GitHub Actions documentation
# @see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions -- Workflow syntax
# @see https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs -- Matrix strategy

# Workflow display name in the GitHub Actions UI
name: CI

# ============================================================
# Trigger Events
# ============================================================
# @see https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows
on:
  # Run on pushes to main and develop branches (direct commits and merged PRs)
  push:
    branches: [main, develop]
  # Run on pull requests targeting main (validates PR code before merge)
  pull_request:
    branches: [main]
  # Allow manual trigger from GitHub UI or CLI (gh workflow run "CI")
  # Useful for conserving Actions minutes during rapid development:
  #   1. Push commits with "[skip ci]" in the message to skip auto-triggers
  #   2. When ready to validate, manually trigger this workflow
  workflow_dispatch:

# ============================================================
# Permissions
# ============================================================
# Restrict the GITHUB_TOKEN to the minimum required permissions.
# CI only needs to read repository contents (checkout code).
# This follows the principle of least privilege and satisfies
# GitHub Code Scanning alert: actions/missing-workflow-permissions.
#
# @see https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
permissions:
  contents: read

# ============================================================
# Concurrency Control
# ============================================================
# Prevents multiple CI runs from executing simultaneously for the same branch/PR.
# If a new commit is pushed while a CI run is in progress, the in-progress run
# is cancelled and a new run starts. This saves CI minutes and avoids stale results.
#
# The group key combines the workflow name and git ref (branch name or PR number)
# to scope cancellation to the same context.
#
# @see https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Frontend Job: TypeScript/React Quality Checks
  # ============================================================
  # Validates the React frontend code across all three target platforms.
  # These checks don't require Rust or Tauri -- they only test the
  # TypeScript/React code and can run with just Node.js.
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Matrix strategy: Run on all three platforms in parallel.
    # @see https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
    strategy:
      # fail-fast: false -- Don't cancel other matrix jobs when one fails.
      # We want to see results from ALL platforms, not just the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # Step 1: Check out the repository code.
      # actions/checkout@v6 clones the repo at the commit that triggered this workflow.
      # @see https://github.com/actions/checkout
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Step 2: Set up Node.js LTS with npm dependency caching.
      # 'lts/*' automatically selects the latest LTS version (currently Node 22.x).
      # 'cache: npm' caches ~/.npm to speed up npm ci on subsequent runs.
      # @see https://github.com/actions/setup-node
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Step 3: Install npm dependencies using a clean install.
      # 'npm ci' (clean install) is preferred over 'npm install' in CI because:
      #   - It uses the exact versions from package-lock.json (no version drift)
      #   - It deletes node_modules/ first for a deterministic install
      #   - It fails if package-lock.json is out of sync with package.json
      - name: Install dependencies
        run: npm ci

      # Step 3.5: Check for known vulnerabilities in npm dependencies.
      # 'npm audit' checks installed packages against the npm advisory database.
      # --audit-level=high only fails the build on high/critical severity issues.
      # This runs on all platforms but is fast (no network call, uses cached data).
      - name: Security audit
        run: npm audit --audit-level=high

      # Step 4: Run ESLint linting.
      # Checks all TypeScript/TSX files against rules defined in eslint.config.js.
      # Catches: unused variables, incorrect hook usage, type safety issues, etc.
      - name: Lint
        run: npm run lint

      # Step 5: Run TypeScript type checking.
      # Runs 'tsc --noEmit' to verify all TypeScript types are correct without
      # producing output files. Catches: type mismatches, missing imports, etc.
      - name: Type check
        run: npm run type-check

      # Step 6: Run frontend unit tests.
      # Executes Vitest with the configuration from vitest.config.ts.
      # Tests run in a jsdom environment simulating browser DOM APIs.
      - name: Run tests
        run: npm run test

  # ============================================================
  # Backend Job: Rust/Tauri Quality Checks
  # ============================================================
  # Validates the Rust backend code. This job requires additional setup:
  #   - Linux: System libraries for WebKit and GTK (Tauri's WebView dependencies)
  #   - All platforms: Node.js + npm (Tauri's build script runs the frontend build)
  #   - Rust toolchain with clippy component
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Suppress Node's DEP0040 punycode deprecation warning emitted by
    # `@actions/cache`'s bundled dependencies, which the Swatinem/rust-cache
    # post step invokes. The warning is cosmetic — neither MeedyaDL nor the
    # action's hot path call `require('punycode')` — but it clutters CI logs
    # on every cache save. Job-level env propagates to both the main and post
    # steps of every action in this job. Targeted (`--disable-warning=DEP0040`
    # rather than `--no-deprecation`) so other deprecations remain visible.
    # @see https://github.com/MWBMPartners/MeedyaDL/issues — punycode audit 2026-05-17
    env:
      NODE_OPTIONS: --disable-warning=DEP0040
    strategy:
      fail-fast: false
      matrix:
        # macos-14 pinned (not macos-latest) because the macos-15 runner image
        # rotated in mid-2026 ships a Homebrew `cargo` shim at
        # `/opt/homebrew/bin/cargo` that proxies to `rustup-init` when rustup
        # isn't fully initialised. With the current `dtolnay/rust-toolchain`
        # pin, that shim wins the PATH race and `cargo check` resolves to
        # `rustup-init`, failing with `error: unexpected argument 'check'
        # found`. Pinning the previous LTS image bypasses the shim.
        # Revisit when `dtolnay/rust-toolchain` (or a successor action) ships
        # a version that handles the new image layout.
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      # Step 1: Check out the repository code.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Step 2: Install Linux system dependencies required by Tauri.
      # These are C/C++ libraries that Tauri's Rust code links against.
      # Only runs on Linux (macOS and Windows have these built-in).
      #   - libwebkit2gtk-4.1-dev: WebView rendering engine (GTK WebKit)
      #   - libappindicator3-dev: System tray icon support
      #   - librsvg2-dev: SVG rendering (used by Tauri for icon processing)
      #   - patchelf: ELF binary patching (used by AppImage bundler)
      #   - libssl-dev: OpenSSL development headers (for reqwest HTTPS)
      #   - libgtk-3-dev: GTK 3 development headers (Tauri's window toolkit)
      #
      # @see https://v2.tauri.app/start/prerequisites/#linux -- Tauri Linux prerequisites
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      # Step 2.5: Scrub Homebrew rustup-init shims on macOS runners.
      # GitHub macOS runner images ship Homebrew-installed `rustup-init` plus
      # symlinks at `/opt/homebrew/bin/{cargo,rustc,rustdoc,rustup,rustup-init}`
      # (and the older `/usr/local/bin/` Intel paths). When rustup isn't fully
      # initialised the shim falls back to running `rustup-init`, so any later
      # `cargo check` resolves to the installer and fails with
      # `error: unexpected argument 'check' found`. The first attempt at fixing
      # this just pinned `macos-14` — same shim layout, same failure.
      # Removing the shims here, BEFORE `dtolnay/rust-toolchain` runs, lets
      # the rustup install put `~/.cargo/bin/cargo` on PATH unopposed.
      - name: Remove Homebrew rustup shims (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "Scrubbing Homebrew rustup shims AND stale ~/.cargo/bin/ symlinks..."
          # /opt/homebrew/bin/ + /usr/local/bin/ — Homebrew install paths.
          for bindir in /opt/homebrew/bin /usr/local/bin; do
            for binname in cargo rustc rustdoc rustup rustup-init; do
              target="$bindir/$binname"
              if [ -e "$target" ] || [ -L "$target" ]; then
                echo "  removing $target"
                sudo rm -f "$target"
              fi
            done
          done
          # ~/.cargo/bin/ — runner image bakes this in pre-symlinked to
          # the Homebrew rustup-init we just removed (PR #770 v3 root
          # cause). Wipe it too so the upstream installer rebuilds clean
          # links to ~/.cargo/bin/rustup (the actual proxy, not
          # rustup-init).
          if [ -d "${HOME}/.cargo/bin" ]; then
            for binname in cargo rustc rustdoc rustup rustup-init; do
              target="${HOME}/.cargo/bin/${binname}"
              if [ -e "$target" ] || [ -L "$target" ]; then
                echo "  removing $target"
                rm -f "$target"
              fi
            done
          fi
          # ~/.rustup/ — pre-installed on the runner image; without
          # removing it, `rustup-init.sh` short-circuits with
          # "Updating existing toolchain" and never re-populates
          # ~/.cargo/bin/. Wipe so the installer takes the fresh path.
          if [ -d "${HOME}/.rustup" ]; then
            echo "  removing ${HOME}/.rustup (forces fresh install)"
            rm -rf "${HOME}/.rustup"
          fi
          echo "Done. Remaining cargo on PATH (should be empty until Setup Rust runs):"
          command -v cargo || echo "  (none — good, Setup Rust will install a clean one)"

      # Step 3: Set up the Rust stable toolchain with clippy.
      #
      # On Linux/Windows, dtolnay/rust-toolchain places real binaries at
      # ~/.cargo/bin/ via upstream rustup-init.sh and just works.
      #
      # On macOS, dtolnay re-creates `/opt/homebrew/bin/rustup-init` (the
      # very shim that Step 2.5 just scrubbed) and symlinks
      # ~/.cargo/bin/cargo back to it, perpetuating the original shim
      # bug — `cargo check` resolves to `rustup-init check` which exits
      # 1 with `unexpected argument 'check' found`. The PR #770 v2
      # diagnostic step caught this happening at 20:38:09 UTC on
      # commit 27b7000.
      #
      # Bypass the action entirely on macOS — run upstream rustup-init.sh
      # ourselves. The official installer places REAL binaries at
      # ~/.cargo/bin/{cargo,rustc,rustup,...} (proxied through rustup,
      # not rustup-init), which is what every subsequent step expects.
      # @see https://github.com/dtolnay/rust-toolchain
      # @see https://rustup.rs (upstream rustup installer source)
      - name: Setup Rust (Linux/Windows)
        if: runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy

      - name: Setup Rust (macOS — upstream rustup, bypasses Homebrew shim)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # `--default-toolchain stable` matches dtolnay/rust-toolchain@stable.
          # `--profile minimal` skips docs/tests we don't need on CI.
          # `--component clippy` matches the dtolnay step's `with: components: clippy`.
          # `-y` accepts all defaults non-interactively.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y \
                --default-toolchain stable \
                --profile minimal \
                --component clippy
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      # Step 3.5: Diagnostic + sanity check — confirm cargo on PATH is the
      # rustup-managed binary, not a Homebrew rustup-init shim. Same step
      # runs again right before `cargo check` (the actual failure point on
      # the v1 fix) so we can pinpoint whether state degrades between steps.
      # The realpath check is stronger than the earlier `cargo --version |
      # grep rustup-init` approach which falsely passed in the v1 fix run.
      - name: Verify cargo is rustup-managed (post-setup)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Rust toolchain diagnostic (post-setup) ==="
          echo "PATH=$PATH"
          echo "CARGO_HOME=${CARGO_HOME:-<unset>}"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-<unset>}"
          cargo_path="$(command -v cargo)" || { echo "::error::cargo not on PATH"; exit 1; }
          echo "command -v cargo => $cargo_path"
          if command -v realpath >/dev/null 2>&1; then
            echo "realpath           => $(realpath "$cargo_path")"
          fi
          case "$cargo_path" in
            */.cargo/bin/cargo|*/cargo/bin/cargo) ;;
            *)
              echo "::error::cargo on PATH ($cargo_path) is NOT in ~/.cargo/bin — likely a Homebrew/system shim."
              exit 1 ;;
          esac
          if [ "$(basename "$cargo_path")" = "rustup-init" ] || \
             (command -v realpath >/dev/null 2>&1 && [ "$(basename "$(realpath "$cargo_path")")" = "rustup-init" ]); then
            echo "::error::cargo resolves to rustup-init."
            exit 1
          fi
          cargo --version

      # Step 4: Cache Rust compilation artifacts for faster builds.
      # Caches the target/ directory within src-tauri/ (the Cargo workspace).
      # This can save 5-15 minutes on subsequent runs by reusing compiled dependencies.
      # @see https://github.com/Swatinem/rust-cache
      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        with:
          workspaces: src-tauri

      # Step 5: Set up Node.js (required because Tauri's build process runs the frontend build).
      # Even though we're testing the backend, Tauri's cargo check/build requires
      # the frontend dist/ directory to exist (referenced in tauri.conf.json).
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Step 6: Install npm dependencies.
      # Needed for step 7 (building the frontend).
      - name: Install npm dependencies
        run: npm ci

      # Step 7: Build the frontend.
      # Runs 'vite build' to generate the dist/ directory with compiled HTML/JS/CSS.
      # Tauri's build script (tauri-build) validates that frontendDist ("../dist") exists,
      # and cargo check would fail without it.
      - name: Build frontend
        run: npm run build

      # Step 7.5: Re-run the cargo-shim diagnostic from the working dir that
      # `cargo check` will actually use. If cargo state changed between
      # Setup Rust and now (cache restore, Node.js setup, npm install, etc.),
      # this is where we'll see it — with full PATH dump for forensic context.
      - name: Verify cargo is rustup-managed (pre-cargo-check)
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Rust toolchain diagnostic (pre-cargo-check) ==="
          echo "PWD=$(pwd)"
          echo "PATH=$PATH"
          echo "CARGO_HOME=${CARGO_HOME:-<unset>}"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-<unset>}"
          cargo_path="$(command -v cargo)" || { echo "::error::cargo not on PATH"; exit 1; }
          echo "command -v cargo => $cargo_path"
          if command -v realpath >/dev/null 2>&1; then
            echo "realpath           => $(realpath "$cargo_path")"
          fi
          case "$cargo_path" in
            */.cargo/bin/cargo|*/cargo/bin/cargo) ;;
            *)
              echo "::error::cargo on PATH ($cargo_path) is NOT in ~/.cargo/bin at cargo-check time."
              exit 1 ;;
          esac
          cargo --version

      # Step 8: Verify Rust compilation.
      # 'cargo check' runs the compiler without producing a binary -- much faster than
      # 'cargo build' but still validates all types, lifetimes, and borrow checking.
      # This catches compilation errors without the full link step.
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      # Step 9: Run the Rust linter (clippy).
      # Clippy catches common mistakes, performance issues, and style problems.
      # '-- -D warnings' promotes all clippy warnings to errors, failing the build
      # on any warning. This enforces a high code quality bar.
      # @see https://rust-lang.github.io/rust-clippy/ -- Clippy lint list
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Step 10: Check dependency licences and security advisories.
      # cargo-deny scans the entire dependency tree against:
      #   - RustSec Advisory Database for known vulnerabilities
      #   - Allowed licence list (MIT, Apache-2.0, BSD, ISC, MPL-2.0, etc.)
      #   - Allowed crate sources (crates.io only)
      # Configuration is in src-tauri/deny.toml. GTK3 unmaintained advisories
      # from Tauri's Linux dependencies are explicitly ignored (no security risk).
      # Only runs on Linux because cargo-deny-action is a container action
      # (Docker-based) which is not supported on macOS or Windows runners.
      # Licence/advisory checks are platform-independent so running once suffices.
      # @see https://github.com/EmbarkStudios/cargo-deny-action
      # @see https://embarkstudios.github.io/cargo-deny/
      - name: Cargo deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2
        with:
          manifest-path: src-tauri/Cargo.toml

      # Step 11: Run Rust unit tests.
      # Executes all #[test] functions in the src-tauri/src/ directory.
      # Tests run in a single-threaded or parallel mode (Cargo's default).
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      # Generate rustdoc to verify doc comments compile.
      # Only runs on ubuntu to save CI minutes (doc compilation is platform-agnostic).
      # Uses -A rustdoc::all to allow pre-existing doc link warnings (backtick words
      # like `Explicit` are interpreted as Rust item links). These will be cleaned up
      # incrementally.
      - name: Cargo doc (verify documentation compiles)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-A rustdoc::all"
