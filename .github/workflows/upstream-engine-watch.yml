#
# Upstream engine release watcher (generalised)
# =============================================
#
# Daily cron job that compares the latest release on PyPI for each MeedyaDL
# download engine against the `maximum_tested_version` declared in
# `src-tauri/tool-versions.toml`. When PyPI ships a release beyond our
# validated ceiling, the workflow opens (or updates) a GitHub Issue
# labelled `upstream-<engine>` so we can triage the change before users
# hit it.
#
# This file is the generalised successor to `upstream-gamdl-watch.yml`,
# which was retired in PR M9-1 (#101) when votify joined the family.
# The matrix below polls every engine MeedyaDL knows about; adding a
# new engine (M8 BBC iPlayer get_iplayer / yt-dlp, M10 YouTube yt-dlp,
# any future Tidal / Deezer / Amazon Music engines) is a one-entry
# addition to the matrix plus a matching `[<engine>]` section in
# `tool-versions.toml`.
#
# The support window is intentionally client-side (see #518):
#
#   * The respective `install_<engine>()` flows pin to `<engine>>=min,<=max`,
#     so first-time setup never pulls an untested release.
#   * The update banner suppresses prompts when PyPI advertises a version
#     above the ceiling.
#
# Both of those protect users, but without this watcher we have no signal
# that upstream moved — the first indicator would be a crash-report ticket
# weeks later. That's exactly what bit us on 2026-04-21 when GAMDL v3.0
# shipped with a breaking CLI change (see #516).
#
# To run manually: `gh workflow run "Upstream Engine Watch" --ref main`
# Related issues: #101, #516, #518, #520, #898

name: Upstream Engine Watch

on:
  schedule:
    # Run daily at 06:00 UTC. Daily cadence catches same-day point
    # releases (GAMDL has shipped multiple within 24 h of each other —
    # see the 2026-04 v3.4 + v3.5 same-day pair, the 2026-05 v3.7.2 +
    # v3.7.3 same-day pair). Earlier weekly cadence let those collapse
    # into one ticket; daily gives each release its own audit window
    # before the next one lands.
    #
    # 06:00 UTC = 06:00 GMT / 07:00 BST / 02:00 EST / 23:00 PST previous
    # day / 15:00 JST. Chosen as a quiet window across global maintainer
    # time zones, far from typical CI rush hours.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print diagnostics without creating/updating issues'
        required: false
        default: false
        type: boolean

permissions:
  # `contents: read` for the checkout, `issues: write` to create / update
  # the triage ticket. No other scopes needed — we deliberately avoid
  # `pull-requests` so a compromised workflow run can't open unreviewed
  # PRs.
  contents: read
  issues: write

jobs:
  watch:
    name: Poll PyPI for ${{ matrix.engine.id }} ceiling breaches
    runs-on: ubuntu-latest
    strategy:
      # Run each engine's check independently — one engine's PyPI
      # flake shouldn't suppress the others. The matrix produces N
      # parallel jobs (one per engine row); the cron fires once and
      # the matrix expansion runs every row.
      fail-fast: false
      matrix:
        engine:
          - id: gamdl
            display_name: GAMDL
            pypi_package: gamdl
            toml_section: gamdl
            audit_label: upstream-gamdl
            upstream_repo: glomatico/gamdl
          - id: votify
            display_name: votify
            pypi_package: votify
            toml_section: votify
            audit_label: upstream-votify
            upstream_repo: glomatico/votify

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The ceiling is read from BOTH the branch this run checked out (the
      # default branch, for the schedule) AND `alpha`, and the higher one is
      # used. Two reasons, both found on 27 Sept 2026:
      #
      #   - The question this watcher answers is "has the engine released
      #     something nobody here has checked yet?", and that checking always
      #     lands on `alpha` first. `main` only catches up at the next stable
      #     release. Comparing against `main` alone reported work already
      #     done: the retired upstream-gamdl-watch.yml, which did exactly
      #     that, opened #1189 ("GAMDL 3.8.5 is beyond MeedyaDL's tested
      #     ceiling (3.7.4)") after alpha had already moved past 3.8.5.
      #   - An engine that so far exists only on `alpha` (votify, until the
      #     next stable release) has no section in `main`'s tool list at all,
      #     so reading `main` alone failed every single day.
      #
      # If `alpha` cannot be fetched, the run fails rather than quietly
      # comparing against the default branch alone: a watcher that cannot
      # finish its check must never report "within the ceiling".
      - name: Fetch alpha's tool list
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin alpha
          git show FETCH_HEAD:src-tauri/tool-versions.toml > "$RUNNER_TEMP/alpha-tool-versions.toml"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          # 3.11+ ships `tomllib` in the stdlib — no extra install step needed.
          python-version: '3.12'

      - name: Detect PyPI drift for ${{ matrix.engine.display_name }}
        id: detect
        # Environment-based inputs prevent shell injection from workflow
        # dispatch parameters AND make the matrix values explicit. Every
        # engine-specific value the Python step needs gets a named env
        # entry rather than `${{ matrix.engine.* }}` interpolation in
        # the script body — keeps the same script reusable across
        # matrix rows.
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ENGINE_ID: ${{ matrix.engine.id }}
          ENGINE_DISPLAY_NAME: ${{ matrix.engine.display_name }}
          PYPI_PACKAGE: ${{ matrix.engine.pypi_package }}
          TOML_SECTION: ${{ matrix.engine.toml_section }}
          CHECKED_OUT_REF: ${{ github.ref_name }}
        run: |
          python <<'PY'
          """Compare PyPI's latest release for this engine against our
          support ceiling.

          Writes outputs to $GITHUB_OUTPUT for the downstream step:
            * `ceiling` — the maximum_tested_version from tool-versions.toml
            * `minimum` — the minimum_version from tool-versions.toml
            * `recommended` — the recommended_version from tool-versions.toml
            * `latest`  — the info.version from PyPI
            * `breach`  — "true" if latest > ceiling, else "false"

          Additionally writes a markdown summary to $GITHUB_STEP_SUMMARY so
          the workflow page is useful even when no issue is opened.
          """
          import json
          import os
          import pathlib
          import sys
          import tomllib
          import urllib.request


          def parse_semver(value: str) -> tuple[int, int, int]:
              parts = value.split(".")
              def _part(i: int) -> int:
                  try:
                      return int(parts[i])
                  except (IndexError, ValueError):
                      return 0
              return _part(0), _part(1), _part(2)


          def emit(name: str, value: str) -> None:
              output_path = os.environ.get("GITHUB_OUTPUT")
              if output_path:
                  with open(output_path, "a", encoding="utf-8") as fh:
                      fh.write(f"{name}={value}\n")


          def summary(markdown: str) -> None:
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as fh:
                      fh.write(markdown + "\n")


          engine_id = os.environ["ENGINE_ID"]
          engine_display = os.environ["ENGINE_DISPLAY_NAME"]
          pypi_package = os.environ["PYPI_PACKAGE"]
          toml_section = os.environ["TOML_SECTION"]

          # 1. Read the ceiling from tool-versions.toml on BOTH branches
          #    (see "Fetch alpha's tool list" above for why) and use the
          #    higher one.
          #
          #    A file that cannot be read or parsed stops the run. A branch
          #    whose file simply has no section for this engine is skipped
          #    (the engine is not part of the app there yet); if NEITHER has
          #    one, the run stops, because the matrix names an engine nobody
          #    declared. A section that is there but missing a field also
          #    stops the run: that is a broken file, not an absent engine.
          checked_out_ref = os.environ.get("CHECKED_OUT_REF") or "checked-out branch"
          sources = [
              (checked_out_ref, pathlib.Path("src-tauri/tool-versions.toml")),
              ("alpha", pathlib.Path(os.environ["RUNNER_TEMP"]) / "alpha-tool-versions.toml"),
          ]
          found = []
          for branch, toml_path in sources:
              try:
                  with toml_path.open("rb") as fh:
                      config = tomllib.load(fh)
              except (OSError, tomllib.TOMLDecodeError) as exc:
                  print(f"::error::Could not read tool-versions.toml from {branch}: {exc}")
                  sys.exit(1)
              section = config.get(toml_section)
              if section is None:
                  print(f"[{engine_display}] {branch}: no [{toml_section}] section (not part of the app there yet)")
                  continue
              try:
                  found.append((
                      branch,
                      section["maximum_tested_version"],
                      section["minimum_version"],
                      section["recommended_version"],
                  ))
              except KeyError as exc:
                  print(f"::error::tool-versions.toml on {branch} has a [{toml_section}] section with no {exc} field")
                  sys.exit(1)

          if not found:
              print(f"::error::No branch declares [{toml_section}] in tool-versions.toml")
              sys.exit(1)

          # Highest ceiling wins; on a tie, the checked-out branch (listed
          # first) is kept, because max() keeps the first of equal items.
          ceiling_branch, ceiling, minimum, recommended = max(
              found, key=lambda row: parse_semver(row[1])
          )

          # 2. Query PyPI for the latest release.
          pypi_url = f"https://pypi.org/pypi/{pypi_package}/json"
          try:
              with urllib.request.urlopen(pypi_url, timeout=15) as resp:
                  payload = json.load(resp)
              latest = payload["info"]["version"]
          except Exception as exc:  # noqa: BLE001
              print(f"::error::Failed to query PyPI for {pypi_package}: {exc}")
              sys.exit(1)

          breach = parse_semver(latest) > parse_semver(ceiling)

          for branch, branch_ceiling, _, _ in found:
              print(f"[{engine_display}] Ceiling on {branch}: {branch_ceiling}")
          print(f"[{engine_display}] Ceiling used (highest, from {ceiling_branch}): {ceiling}")
          print(f"[{engine_display}] Minimum (from {ceiling_branch}): {minimum}")
          print(f"[{engine_display}] Recommended (from {ceiling_branch}): {recommended}")
          print(f"[{engine_display}] Latest (from PyPI): {latest}")
          print(f"[{engine_display}] Breach: {breach}")

          emit("ceiling", ceiling)
          emit("ceiling_branch", ceiling_branch)
          emit("minimum", minimum)
          emit("recommended", recommended)
          emit("latest", latest)
          emit("breach", "true" if breach else "false")

          summary(
              f"## {engine_display} support window\n"
              f"- Minimum supported: `{minimum}`\n"
              f"- Maximum tested: `{ceiling}` (highest across branches, from `{ceiling_branch}`)\n"
              f"- Recommended: `{recommended}`\n"
              f"- Latest on PyPI: `{latest}`\n"
              f"- **Breach**: {'YES' if breach else 'no'}\n"
          )
          PY

      - name: Report no-breach status for ${{ matrix.engine.display_name }}
        if: steps.detect.outputs.breach == 'false'
        # LATEST is a version string read straight from PyPI. Every other
        # externally-sourced value in this repo's workflows is passed
        # through `env:` before it is used in a shell command, rather
        # than interpolated straight into `run:` via `${{ }}` -- this
        # step was the one place that pattern wasn't followed. PyPI's
        # own rules on what a version string can contain make a
        # dangerous value here very unlikely, but there is no reason to
        # be the exception.
        env:
          ENGINE_DISPLAY_NAME: ${{ matrix.engine.display_name }}
          LATEST: ${{ steps.detect.outputs.latest }}
          CEILING: ${{ steps.detect.outputs.ceiling }}
        run: |
          echo "::notice::${ENGINE_DISPLAY_NAME} ${LATEST} is within the supported ceiling (${CEILING}) — no action required."

      - name: Open or update tracking issue for ${{ matrix.engine.display_name }}
        if: steps.detect.outputs.breach == 'true' && github.event.inputs.dry_run != 'true'
        # Using the REST API via the pre-installed `gh` CLI. We search for an
        # existing open issue with a well-known title pattern and update it
        # rather than spamming fresh issues every day — at the daily cadence
        # an unaddressed ticket would otherwise accumulate 365 duplicate
        # comments in a year where upstream sits above the ceiling.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CEILING: ${{ steps.detect.outputs.ceiling }}
          CEILING_BRANCH: ${{ steps.detect.outputs.ceiling_branch }}
          MINIMUM: ${{ steps.detect.outputs.minimum }}
          RECOMMENDED: ${{ steps.detect.outputs.recommended }}
          LATEST: ${{ steps.detect.outputs.latest }}
          ENGINE_ID: ${{ matrix.engine.id }}
          ENGINE_DISPLAY_NAME: ${{ matrix.engine.display_name }}
          PYPI_PACKAGE: ${{ matrix.engine.pypi_package }}
          AUDIT_LABEL: ${{ matrix.engine.audit_label }}
          UPSTREAM_REPO: ${{ matrix.engine.upstream_repo }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="upstream: ${ENGINE_DISPLAY_NAME} ${LATEST} is beyond MeedyaDL's tested ceiling (${CEILING})"

          # Search for an existing open issue with this engine's label so
          # we update rather than duplicate. The label is per-engine
          # (upstream-gamdl / upstream-votify / etc.) so each engine's
          # ticket stays in its own thread.
          EXISTING=$(gh issue list --repo "$REPO" \
            --state open \
            --label "$AUDIT_LABEL" \
            --json number,title \
            --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          ## What changed?

          \`${PYPI_PACKAGE}\` is now at **${LATEST}** on PyPI, but MeedyaDL's
          \`maximum_tested_version\` in \`src-tauri/tool-versions.toml\` is
          still **${CEILING}** — the highest on any branch checked (\`main\` and
          \`alpha\`), read from \`${CEILING_BRANCH}\`.

          ## Support window

          | Field | Value |
          |---|---|
          | Engine | \`${ENGINE_DISPLAY_NAME}\` |
          | PyPI package | \`${PYPI_PACKAGE}\` |
          | Minimum supported | \`${MINIMUM}\` |
          | Maximum tested | \`${CEILING}\` |
          | Recommended | \`${RECOMMENDED}\` |
          | Latest on PyPI | \`${LATEST}\` |

          ## Triage checklist

          - [ ] Review the [${ENGINE_DISPLAY_NAME} ${LATEST} release notes](https://github.com/${UPSTREAM_REPO}/releases/tag/${LATEST}) — are any CLI flags removed, renamed, or defaults changed?
          - [ ] Check [upstream commits since v${CEILING}](https://github.com/${UPSTREAM_REPO}/compare/${CEILING}...main) for structural refactors (logging, output format, downloader module).
          - [ ] Run \`cargo test --lib services::${ENGINE_ID}_capabilities::\` to confirm no capability gate regressions.
          - [ ] If safe to admit: bump \`maximum_tested_version\` + \`recommended_version\` in \`src-tauri/tool-versions.toml\` to \`${LATEST}\` on \`alpha\` (it reaches \`main\` with the next stable release).
          - [ ] If breaking: add a \`${ENGINE_DISPLAY_NAME}Feature\` capability gate (mirroring the existing GAMDL pattern in \`gamdl_capabilities.rs\`) before bumping the ceiling.
          - [ ] Write an audit doc under \`.github/audits/${ENGINE_ID}-v${LATEST}-audit.md\` summarising findings.

          ## Context

          - Part of the long-running upstream-cadence tracking work (#516 / #518).
          - The MeedyaDL support window is client-side: users only get prompted to upgrade to releases within \`[minimum, maximum_tested]\`. Bumping the ceiling is a deliberate per-release audit decision, not an automatic Dependabot bump.
          - This workflow: \`.github/workflows/upstream-engine-watch.yml\`. Runs daily at 06:00 UTC for every engine declared in the matrix.

          ---

          _This ticket is opened and updated automatically by the upstream engine watcher. When you close it (manually or by merging a ceiling bump), the workflow will open a fresh ticket next time PyPI advertises yet another release above the new ceiling._
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$(cat <<COMMENT
          Daily watcher tick — \`${PYPI_PACKAGE}\` is still at **${LATEST}** on PyPI (ceiling: \`${CEILING}\`).

          $(date -u '+%Y-%m-%d %H:%M UTC')
          COMMENT
          )"
            gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body "$BODY"
            echo "::notice::Updated existing tracking issue #${EXISTING} for ${ENGINE_DISPLAY_NAME}"
          else
            # Ensure the per-engine label exists. Labels created at the same
            # name + colour are idempotent — gh returns non-zero on conflict
            # which we tolerate.
            gh label create "$AUDIT_LABEL" \
              --repo "$REPO" \
              --description "Upstream ${ENGINE_DISPLAY_NAME} release above MeedyaDL's tested ceiling" \
              --color "FBCA04" \
              2>/dev/null || true

            NEW=$(gh issue create --repo "$REPO" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "$AUDIT_LABEL" \
              --label "upstream-bump")
            echo "::notice::Opened new tracking issue $NEW for ${ENGINE_DISPLAY_NAME}"
          fi
