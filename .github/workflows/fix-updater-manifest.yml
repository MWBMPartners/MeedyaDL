#
# Fix Updater Manifest Workflow
# ================================
#
# Manually triggered workflow that rebuilds the `latest.json` updater manifest
# for an existing GitHub Release. This fixes the race condition where parallel
# platform builds each upload their own `latest.json` and the last one wins,
# potentially missing platforms that built earlier.
#
# Usage: Actions → "Fix Updater Manifest" → Run workflow → enter tag (e.g., v0.29.0)
#
# The rebuild itself lives in scripts/release/updater-manifest.sh, shared with
# release.yml. This workflow used to carry its own copy of that logic, and the
# copy fell six platform keys behind — so running this tool on a healthy
# release would have DELETED the entries that let every .deb and .rpm install
# update itself, then reported the result as complete. The shared script also
# seeds from whatever is already published, so a rebuild can now only add and
# refresh entries, never remove one.

name: Fix Updater Manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to fix (e.g., v0.29.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix-manifest:
    runs-on: ubuntu-latest
    steps:
      # The rebuild and the check below both run a script kept in this
      # repository, so the repository has to be on disk.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Fail early with a clear message if someone types a tag that does not
      # exist, rather than letting the rebuild produce a confusing error
      # several commands later.
      #
      # The tag arrives here straight from a hand-typed workflow input, so it
      # is passed as an environment variable and quoted rather than
      # interpolated into the shell — an interpolated `${{ }}` value would be
      # pasted into the script text itself, where punctuation could run
      # commands. Its *shape* is then checked by the rebuild step below, which
      # refuses anything that is not a plain vX.Y.Z tag.
      - name: Check the release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::Release $TAG not found in $REPO."
            exit 1
          fi
          echo "Release $TAG found."

      - name: Rebuild and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: bash scripts/release/updater-manifest.sh build "$TAG"

      # Check what is now live on the release.
      #
      # WARN-ONLY BY DESIGN (never exit 1): unlike release.yml, this workflow
      # is dispatched by a human specifically for releases where a platform is
      # already known to be missing — e.g. alpha.52, where the Windows ARM64
      # build failed and a manifest short those keys is the CORRECT, intended
      # outcome of running this tool. If this step were strict by default it
      # would go red every single time the workflow is used for its most
      # common purpose, which teaches the operator that a red run here is
      # normal and worth ignoring — exactly the failure mode this whole
      # hardening effort exists to avoid. A `strict` input was the other
      # option on the table, but it adds a setting an operator has to remember
      # to flip on the one run where it would matter; a plain warning that
      # always shows the actual gap is simpler and just as informative for a
      # tool that is, by definition, already being run to patch up a
      # known-imperfect release.
      - name: Verify published updater manifest (latest.json)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: bash scripts/release/updater-manifest.sh verify "$TAG" warn
