# Fix Updater Manifest Workflow
# ================================
#
# Manually triggered workflow that rebuilds the `latest.json` updater manifest
# for an existing GitHub Release. This fixes the race condition where parallel
# platform builds each upload their own `latest.json` and the last one wins,
# potentially missing platforms that built earlier.
#
# Usage: Actions → "Fix Updater Manifest" → Run workflow → enter tag (e.g., v0.29.0)

name: Fix Updater Manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to fix (e.g., v0.29.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          mkdir -p /tmp/updater

          # Verify the release exists
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "ERROR: Release $TAG not found"
            exit 1
          fi

          # Download the current latest.json to preserve notes and pub_date
          gh release download "$TAG" --repo "$REPO" --pattern "latest.json" --dir /tmp/updater --clobber 2>/dev/null || true

          # Extract existing notes and pub_date (fall back to defaults if missing)
          if [ -f /tmp/updater/latest.json ]; then
            NOTES=$(jq -r '.notes // ""' /tmp/updater/latest.json)
            PUB_DATE=$(jq -r '.pub_date // ""' /tmp/updater/latest.json)
            echo "Existing latest.json found with $(jq '.platforms | length' /tmp/updater/latest.json) platform(s)"
            echo "Existing platforms:"
            jq '.platforms | keys' /tmp/updater/latest.json
          fi
          : "${NOTES:=See CHANGELOG.md for details.}"
          : "${PUB_DATE:=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")}"

          # List all release assets
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Release assets:"
          echo "$ASSETS"

          # Start building the platforms JSON object
          PLATFORMS="{}"

          # Helper: download a .sig file content from the release.
          #
          # Hardened the same way as the equivalent helper in release.yml
          # after the v1.13.0-alpha.58 incident: windows-x86_64 and
          # windows-x86_64-nsis silently vanished from latest.json even
          # though every signature had been uploaded 30 minutes earlier —
          # two transient `gh release download` failures within a ~2 second
          # window, hidden entirely by `2>/dev/null` and never retried.
          #
          # STDOUT DISCIPLINE: this function's stdout is captured by the
          # caller as `SIG=$(download_sig ...)`, so only the signature
          # bytes may ever reach stdout. Every diagnostic line below is
          # explicitly redirected to stderr (`>&2` / `1>&2`) so it can
          # never contaminate a signature and corrupt latest.json.
          download_sig() {
            local sig_name="$1"
            if ! echo "$ASSETS" | grep -qF "$sig_name"; then
              return 1
            fi

            local attempt
            for attempt in 1 2 3; do
              # gh's stdout AND stderr both go to our stderr here — the
              # download writes the file to disk, it doesn't need to print
              # anything to our stdout, and dropping "2>/dev/null" means a
              # real failure now shows up in the log instead of vanishing.
              gh release download "$TAG" --repo "$REPO" --pattern "$sig_name" --dir /tmp/updater --clobber 1>&2

              # -s (has content), not -f (merely exists): a zero-byte file
              # left behind by a truncated download must count as a
              # failure, not a false "success" with an empty signature.
              if [ -s "/tmp/updater/$sig_name" ]; then
                cat "/tmp/updater/$sig_name"
                return 0
              fi

              echo "::warning::download_sig: attempt ${attempt}/3 for ${sig_name} produced no usable file" >&2
              if [ "$attempt" -eq 1 ]; then
                sleep 5
              elif [ "$attempt" -eq 2 ]; then
                sleep 10
              fi
            done
            return 1
          }

          # macOS ARM64 (darwin-aarch64)
          # Tauri 2.x names the updater bundle after the .app (no version/arch
          # suffix): MeedyaDL.app.tar.gz — matches the upload step in release.yml.
          MAC_SIG_FILE="MeedyaDL.app.tar.gz.sig"
          MAC_URL="${BASE}/MeedyaDL.app.tar.gz"
          if SIG=$(download_sig "$MAC_SIG_FILE"); then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$MAC_URL" \
              '. + {"darwin-aarch64": {"signature": $sig, "url": $url}}')
            echo "✓ Added darwin-aarch64"
          else
            echo "✗ Skipped darwin-aarch64 (no sig file)"
          fi

          # Windows x64 (windows-x86_64 + windows-x86_64-nsis)
          WIN_X64_SIG_FILE="MeedyaDL_${VERSION}_x64-setup.exe.sig"
          WIN_X64_URL="${BASE}/MeedyaDL_${VERSION}_x64-setup.exe"
          if SIG=$(download_sig "$WIN_X64_SIG_FILE"); then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$WIN_X64_URL" \
              '. + {"windows-x86_64": {"signature": $sig, "url": $url}, "windows-x86_64-nsis": {"signature": $sig, "url": $url}}')
            echo "✓ Added windows-x86_64 + windows-x86_64-nsis"
          else
            echo "✗ Skipped windows-x86_64 (no sig file)"
          fi

          # Windows ARM64 (windows-aarch64 + windows-aarch64-nsis)
          WIN_ARM_SIG_FILE="MeedyaDL_${VERSION}_arm64-setup.exe.sig"
          WIN_ARM_URL="${BASE}/MeedyaDL_${VERSION}_arm64-setup.exe"
          if SIG=$(download_sig "$WIN_ARM_SIG_FILE"); then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$WIN_ARM_URL" \
              '. + {"windows-aarch64": {"signature": $sig, "url": $url}, "windows-aarch64-nsis": {"signature": $sig, "url": $url}}')
            echo "✓ Added windows-aarch64 + windows-aarch64-nsis"
          else
            echo "✗ Skipped windows-aarch64 (no sig file)"
          fi

          # Linux x64 (linux-x86_64) — uses AppImage for updater
          LINUX_X64_SIG_FILE="MeedyaDL_${VERSION}_amd64.AppImage.sig"
          LINUX_X64_URL="${BASE}/MeedyaDL_${VERSION}_amd64.AppImage"
          if SIG=$(download_sig "$LINUX_X64_SIG_FILE"); then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg sig "$SIG" --arg url "$LINUX_X64_URL" \
              '. + {"linux-x86_64": {"signature": $sig, "url": $url}}')
            echo "✓ Added linux-x86_64"
          else
            echo "✗ Skipped linux-x86_64 (no sig file)"
          fi

          # Build the final latest.json
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > /tmp/updater/latest.json

          # Count platforms for logging
          PLATFORM_COUNT=$(jq '.platforms | length' /tmp/updater/latest.json)
          echo ""
          echo "Rebuilt latest.json with ${PLATFORM_COUNT} platform(s):"
          jq '.' /tmp/updater/latest.json

          # Upload the rebuilt manifest (overwrite the incomplete one)
          if [ "$PLATFORM_COUNT" -gt 0 ]; then
            gh release upload "$TAG" /tmp/updater/latest.json --repo "$REPO" --clobber
            echo ""
            echo "✓ Uploaded corrected latest.json to ${TAG}"
          else
            echo "ERROR: No platform signatures found — aborting"
            exit 1
          fi

      # Verify the manifest that is now LIVE on the release actually has
      # everything the in-app updater can ask for.
      #
      # WARN-ONLY BY DESIGN (never exit 1): unlike release.yml's own copy of
      # this check, this workflow is dispatched by a human specifically for
      # releases where a platform is already known to be missing — e.g.
      # alpha.52, where the Windows ARM64 build failed and a 4-of-6-key
      # manifest is the CORRECT, intended outcome of running this tool. If
      # this step were strict by default it would go red every single time
      # the workflow is used for its most common purpose, which teaches the
      # operator that a red run here is normal and worth ignoring — exactly
      # the failure mode this whole hardening effort exists to avoid. A
      # `strict` input was the other option on the table, but it adds a
      # setting an operator has to remember to flip on the one run where it
      # would matter; a plain warning that always shows the actual gap is
      # simpler and just as informative for a tool that is, by definition,
      # already being run to patch up a known-imperfect release.
      - name: Verify published updater manifest (latest.json)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          EXPECTED_VERSION="${TAG#v}"

          # A separate directory from the rebuild step above, so this
          # always re-fetches the file that is actually live on the
          # release right now, rather than trusting the local copy this
          # job already has lying around from the step above.
          rm -rf /tmp/updater-verify
          mkdir -p /tmp/updater-verify

          DOWNLOAD_OK=0
          for attempt in 1 2 3; do
            if gh release download "$TAG" --repo "$REPO" --pattern "latest.json" --dir /tmp/updater-verify --clobber 1>&2; then
              DOWNLOAD_OK=1
              break
            fi
            echo "::warning::Verify step: attempt ${attempt}/3 to download the published latest.json failed" >&2
            if [ "$attempt" -eq 1 ]; then
              sleep 5
            elif [ "$attempt" -eq 2 ]; then
              sleep 10
            fi
          done

          if [ "$DOWNLOAD_OK" -ne 1 ]; then
            echo "::warning::Could not download the published latest.json for ${TAG} after 3 attempts — unable to verify the updater manifest."
            exit 0
          fi

          MANIFEST="/tmp/updater-verify/latest.json"

          # latest.json stores the bare version, e.g. "1.13.0-alpha.58" —
          # never the "v"-prefixed tag. Comparing against the raw tag
          # would fail this check on every single release, so it is
          # deliberately compared against ${TAG#v}.
          ACTUAL_VERSION=$(jq -r '.version // ""' "$MANIFEST")
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::warning::Published latest.json version mismatch for ${TAG}: expected '${EXPECTED_VERSION}', found '${ACTUAL_VERSION}'."
          else
            echo "latest.json version OK: ${ACTUAL_VERSION}"
          fi

          # The six keys the in-app updater (Tauri's updater plugin) can
          # request. windows-x86_64-nsis / windows-aarch64-nsis are the
          # NSIS-installer aliases the rebuild step above writes with the
          # SAME signature as their non-nsis counterpart.
          MISSING=0
          for key in darwin-aarch64 windows-x86_64 windows-x86_64-nsis windows-aarch64 windows-aarch64-nsis linux-x86_64; do
            SIG=$(jq -r --arg k "$key" '.platforms[$k].signature // ""' "$MANIFEST")
            if [ -z "$SIG" ]; then
              echo "::warning::Published latest.json for ${TAG} has no signature for '${key}' — this platform will not be offered an in-app update. If that platform's build is known to have failed for this release, this is expected."
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -eq 0 ] && [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ]; then
            echo "✓ Published latest.json for ${TAG} looks complete (6/6 platform keys, version matches)."
          fi
