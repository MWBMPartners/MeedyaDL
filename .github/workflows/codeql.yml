#
# CodeQL Code Scanning Workflow
# ==============================
#
# Runs GitHub CodeQL static analysis on push to main and the three
# long-lived channel branches (alpha, beta, release-candidate), and on
# pull requests targeting any of those four. This file overrides the
# GitHub "Default setup" CodeQL configuration.
#
# Languages analysed:
#   - actions: GitHub Actions workflow YAML files
#   - javascript-typescript: React/TypeScript frontend code
#   - rust: the Rust backend (src-tauri/)
#
# Rust history: Rust used to be left out because CodeQL then had to build
# the whole Rust project to read it, and that build hung for 6+ hours.
# CodeQL can now read Rust source without building it ("build-mode: none"),
# which removes the cause, so Rust is back in (main first, #1338, where the
# first Rust scan took about ten minutes). Leaving it out also left the Rust
# results GitHub holds frozen at their last scan (20 March 2026), which is
# what the "Code Scanning results may be out of date" warning on the
# Security page was about. The job time limit below is a safety net in case
# a Rust scan ever runs away again; if it does, the scan stops and fails
# rather than holding a runner for hours.
#
# Rust is still also checked by `cargo clippy -- -D warnings`, `cargo test`
# and `cargo-deny` in ci.yml; CodeQL adds security-focused checks on top.

name: CodeQL

on:
  # Same branch list as ci.yml: main plus the three long-lived channel
  # branches (alpha, beta, release-candidate). All real development lands
  # on one of these, not just main, so this scan has to watch all four —
  # otherwise a change can reach a channel users install with no static
  # security scan ever having looked at it. A real PR into `alpha` was
  # checked and found no CodeQL run at all before this was added.
  push:
    branches: [main, alpha, beta, release-candidate]
  pull_request:
    branches: [main, alpha, beta, release-candidate]

# Cancel in-progress runs for the same branch/PR to save Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Safety net for the Rust scan (see the header comment). The other two
    # languages finish in a couple of minutes.
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Read the Rust source without building it — see the header comment.
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d4b3ca9fa7f69d38bfcd667bdc45bc373d16277e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d4b3ca9fa7f69d38bfcd667bdc45bc373d16277e # v4
        with:
          category: "/language:${{ matrix.language }}"
