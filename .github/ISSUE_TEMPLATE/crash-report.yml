name: Crash Report
description: Report a crash or error from MeedyaDL
title: "[Crash Report] "
labels: ["bug", "crash-report"]
body:
  - type: markdown
    attributes:
      value: |
        **This template is for crash reports generated by MeedyaDL's in-app reporting feature.**
        If you're filing a crash report manually, please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: App Version
      description: "MeedyaDL version (e.g., 0.5.3)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: arch
    attributes:
      label: Architecture
      description: "e.g., aarch64, x86_64"

  - type: textarea
    id: error-message
    attributes:
      label: Error Message
      render: text

  - type: textarea
    id: backtrace
    attributes:
      label: Backtrace / Stack Trace
      render: text

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      placeholder: "Add any other context about the problem here."
