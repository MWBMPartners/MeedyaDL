# Secret scanning configuration.
# https://docs.github.com/en/code-security/secret-scanning/excluding-folders-and-repositories-from-secret-scanning
#
# `paths-ignore` lists locations that legitimately contain secret-LOOKING text
# which is NOT a real credential, so secret scanning does not raise
# false-positive alerts on them.
#
# Policy: NO real secrets are ever committed to this repository. Production
# tokens are injected at build time via CI secrets — see the TokenSource chain
# in `src-tauri/src/services/apple_music_api.rs` (Apple developer token) and
# `DEV_ACCESS_HASH` in `src-tauri/src/commands/credentials.rs` (dev-access
# passphrase hash). The only secret-shaped strings in the tree are:
#   * Onboarding/help docs that instruct users to paste their OWN Apple
#     MusicKit `.p8` private key; they show the `-----BEGIN/END PRIVATE KEY-----`
#     markers purely as formatting guidance, never real key material.
# Code test fixtures no longer contain contiguous PEM markers or hash literals
# (assembled at runtime), so no source file needs excluding here.
paths-ignore:
  - "help/**"
  - "src/components/help/**"
