#
# Dependabot Version Updates Configuration
# ==========================================
#
# Automatically creates PRs for outdated dependencies on a weekly schedule.
# Only proposes semver-compatible updates (patch + minor) — major version
# jumps are NOT included (those require manual migration, tracked in #117).
#
# Two ecosystems monitored:
#   1. npm (package.json / package-lock.json) — frontend + build tools
#   2. cargo (Cargo.toml / Cargo.lock) — Rust backend
#
# Minor/patch updates are grouped into a single PR per ecosystem to reduce
# noise. Security updates are always created immediately (not batched).
#
# Cooldown (supply-chain safety)
# ------------------------------
# Version updates observe a 7-day `cooldown`: Dependabot waits until a release
# has existed for 7 days before opening a PR for it. This blunts the "a package
# version published an hour ago is compromised" window — by the time we auto-
# merge, the release has had a week of public exposure. Cooldown applies to
# VERSION updates only; Dependabot's separate SECURITY-update path is not
# delayed by it, so security fixes are still raised (and auto-merged) immediately.
#
# Auto-merge (see .github/workflows/dependabot-auto-merge.yml)
# -----------------------------------------------------------
# Version PRs (which target `alpha`) and security PRs (which GitHub forces onto
# `main`) are squash-merged automatically once EVERY check on them passes.
# `beta` / `release-candidate` are not auto-merged — they advance via the
# deliberate alpha -> beta -> rc -> stable promotion path.
#
# @see https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # npm dependencies (frontend + build tools)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Group minor/patch updates into a single PR to reduce noise
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Ignore major version bumps — these require manual migration and are
    # tracked as dedicated tasks (e.g., Tailwind v4, ESLint 10).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Limit open PRs to avoid overwhelming the maintainer
    open-pull-requests-limit: 5
    # Wait 7 days after a release is published before opening a version-update
    # PR for it (supply-chain cooldown). Does not affect security updates.
    cooldown:
      default-days: 7
    # Target branch for PRs
    # Target the alpha integration branch so dependency updates flow
    # through the same channel-promotion model as user-facing changes:
    # alpha → (after testing) → beta / rc → stable. Without this,
    # Dependabot would land patches directly on main, bypassing the
    # validation that the alpha channel provides. Security updates
    # are still created immediately by Dependabot's separate
    # vulnerability path; this only changes the cadence of the
    # weekly batched updates.
    target-branch: "alpha"
    # Labels for easy filtering
    labels:
      - "dependencies"
    # Commit message format matching conventional commits
    commit-message:
      prefix: "chore"
      include: "scope"

  # Cargo dependencies (Rust backend)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Ignore major version bumps — manual migration required.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    # Wait 7 days after a release is published before opening a version-update
    # PR for it (supply-chain cooldown). Does not affect security updates.
    cooldown:
      default-days: 7
    # Target the alpha integration branch so dependency updates flow
    # through the same channel-promotion model as user-facing changes:
    # alpha → (after testing) → beta / rc → stable. Without this,
    # Dependabot would land patches directly on main, bypassing the
    # validation that the alpha channel provides. Security updates
    # are still created immediately by Dependabot's separate
    # vulnerability path; this only changes the cadence of the
    # weekly batched updates.
    target-branch: "alpha"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
