#
# Dependabot Version Updates Configuration
# ==========================================
#
# Automatically creates PRs for outdated dependencies on a weekly schedule.
# Only proposes semver-compatible updates (patch + minor) — major version
# jumps are NOT included (those require manual migration, tracked in #117).
#
# Two ecosystems monitored:
#   1. npm (package.json / package-lock.json) — frontend + build tools
#   2. cargo (Cargo.toml / Cargo.lock) — Rust backend
#
# Minor/patch updates are grouped into a single PR per ecosystem to reduce
# noise. Security updates are always created immediately (not batched).
#
# ROUTINE UPDATES vs SECURITY FIXES — read this before touching this file
# -------------------------------------------------------------------------
# GitHub Dependabot actually runs two separate systems, and only one of them
# reads anything in this file:
#
#   * ROUTINE updates — the weekly, grouped, minor/patch bumps configured
#     below — are the only thing `target-branch` controls. Each entry below
#     targets exactly one branch, so this file repeats the same two
#     ecosystems (npm, cargo) once per released channel branch — `alpha`,
#     `beta`, `release-candidate`, and `main` — giving each channel its own
#     weekly dependency bump opened directly against it. Before this, only
#     `alpha` received routine updates and the other three channels only got
#     newer dependencies whenever a human manually promoted `alpha`'s changes
#     forward — which could be weeks, or never.
#
#   * SECURITY updates (Dependabot has found a known vulnerability in a
#     dependency) ALWAYS open against the repository's default branch
#     (`main`) and COMPLETELY IGNORE `target-branch` — there is no setting
#     anywhere in this file that changes that; it's how GitHub built the
#     feature. Getting a security fix onto `alpha`/`beta`/`release-candidate`
#     is handled by a separate, independent workflow —
#     `.github/workflows/forward-port-security.yml` — which watches for a
#     Dependabot fix landing on `main` and copies it onto each channel branch
#     afterwards. Adding a branch entry to THIS file does nothing for
#     security fixes; it only ever changes where ROUTINE updates go.
#
# Also note: GitHub's Dependabot config schema rejects a "group" that spans
# more than one package-ecosystem in a single entry — a config file with one
# of those fails validation for the ENTIRE file, silencing updates on every
# branch, not just the entry that was wrong. Every group below stays scoped
# to one ecosystem for that reason.
#
# Cooldown (supply-chain safety)
# ------------------------------
# Version updates observe a 7-day `cooldown`: Dependabot waits until a release
# has existed for 7 days before opening a PR for it. This blunts the "a package
# version published an hour ago is compromised" window — by the time we auto-
# merge, the release has had a week of public exposure. Cooldown applies to
# VERSION updates only; Dependabot's separate SECURITY-update path is not
# delayed by it, so security fixes are still raised (and auto-merged) immediately.
#
# Auto-merge (see .github/workflows/dependabot-auto-merge.yml)
# -----------------------------------------------------------
# Every routine-update PR opened by an entry below — whichever of the four
# branches it targets — is squash-merged automatically once EVERY check on it
# passes. Security PRs (which GitHub always opens against `main`, regardless
# of what's configured here) are auto-merged the same way, without the cooldown.
#
# @see https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm dependencies (frontend + build tools) — one entry per channel branch,
  # each identical apart from `target-branch`.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Group minor/patch updates into a single PR to reduce noise
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Ignore major version bumps — these require manual migration and are
    # tracked as dedicated tasks (e.g., Tailwind v4, ESLint 10).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Limit open PRs to avoid overwhelming the maintainer
    open-pull-requests-limit: 5
    # Wait 7 days after a release is published before opening a version-update
    # PR for it (supply-chain cooldown). Does not affect security updates.
    cooldown:
      default-days: 7
    target-branch: "alpha"
    # Labels for easy filtering
    labels:
      - "dependencies"
    # Commit message format matching conventional commits
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    target-branch: "beta"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    target-branch: "release-candidate"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # ---------------------------------------------------------------------------
  # Cargo dependencies (Rust backend) — one entry per channel branch, each
  # identical apart from `target-branch`.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Ignore major version bumps — manual migration required.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    # Wait 7 days after a release is published before opening a version-update
    # PR for it (supply-chain cooldown). Does not affect security updates.
    cooldown:
      default-days: 7
    target-branch: "alpha"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    target-branch: "beta"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    target-branch: "release-candidate"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    target-branch: "main"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
